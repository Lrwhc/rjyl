{id:'e57',day:57,week:9,weekTitle:'社交深化',title:'从 small talk 到 real talk',sub:'把寒暄聊成朋友的转场技术',mins:15,steps:[
 {t:'intro',h:'美国社交的隐形门槛：转场',p:['寒暄谁都会，**从天气聊进真话题**才是交朋友的分水岭。三个转场钩子：','**钩子①追细节**：对方提到任何名词就抓住——You mentioned hiking—where do you usually go?','**钩子②给自己的料**：主动暴露一点信息让对方接——I\'ve been trying to get into podcasts lately.','**钩子③共同吐槽**：Safe的抱怨是最快的粘合剂——This weather has been something, huh?'],tip:'get into=开始迷上某事物——聊爱好第一动词，今天高频出现。'},
 {t:'chunks',h:'转场语块',sub:'从寒暄进入真话题',items:[
  {x:"You mentioned...—tell me more.",c:'你刚提到……多讲讲呗',ex:"You mentioned Japan—tell me more, I've been wanting to go.",exc:'你刚提到日本——多说说，我一直想去',n:'📍抓名词追细节，真诚感瞬间拉满'},
  {x:"I've been getting into...",c:'我最近迷上了……',ex:"I've been getting into trail running lately.",exc:'我最近迷上了越野跑',n:'get into=入坑；主动给料，等对方接'},
  {x:"How did you get into that?",c:'你怎么入坑的？',ex:"A consultant who DJs? How did you get into that?",exc:'会打碟的顾问？你怎么入坑的？',n:'对任何爱好职业都能问，答案必是好故事'},
  {x:"Wait, you too?",c:'等等，你也是？',ex:"Wait, you too? I thought I was the only one!",exc:'等等你也是？我以为只有我这样！',n:'发现共同点的惊喜句——友谊的着火点'},
  {x:"That's my kind of...",c:'这很对我胃口',ex:"Ramen at midnight? That's my kind of dinner.",exc:'半夜吃拉面？这很对我胃口',n:'表达同类认同，轻松幽默'},
  {x:"Speaking of which, ...",c:'说到这个……',ex:"Speaking of which, have you tried that new place?",exc:'说到这个，你去过那家新店吗？',n:'顺势转话题的润滑剂'}]},
 {t:'dialog',h:'转场实战：电梯寒暄变朋友',sub:'从天气聊到爱好',lang:'en-US',mode:'role',you:'你',lines:[
  {sp:'邻居',x:"This weather has been something, huh?",c:'这天气真是绝了，是吧？'},
  {sp:'你',x:"Right? Perfect weekend to stay in though. I've been getting into Japanese cooking lately, so I'm not complaining.",c:'可不是？不过正好宅家。我最近迷上做日料，所以不亏',n:'接吐槽+主动给料，转场完成'},
  {sp:'邻居',x:"No way, me too! Have you tried making ramen from scratch?",c:'不会吧我也是！你试过从头做拉面吗？',n:'from scratch=从零开始'},
  {sp:'你',x:"Wait, you too? I attempted it last week—total disaster, but fun. How did you get into it?",c:'等等你也是？我上周试了——彻底翻车，但很开心。你怎么入坑的？',n:'共鸣+自嘲小故事+回抛问题，教科书级转场'},
  {sp:'邻居',x:"Long story—we should swap recipes sometime!",c:'说来话长——改天咱们交换下菜谱！'}]},
 {t:'quiz',h:'转场检验',qs:[
  {q:'对方提到爬山，最好的深聊转场?',opts:["You mentioned hiking—where do you usually go?","OK. Nice weather today.","I don't hike.","Hiking is dangerous."],a:"You mentioned hiking—where do you usually go?"},
  {q:'「我最近迷上了播客」?',opts:["I've been getting into podcasts lately.","I go inside podcasts.","Podcasts enter me recently.","I am podcast person into."],a:"I've been getting into podcasts lately."},
  {q:'发现对方和你同好，惊喜句?',opts:["Wait, you too?","Who are you?","That's common.","Many people do that."],a:"Wait, you too?"}]},
 {t:'task',h:'开口任务',p:['准备你的三个「给料句」：I\'ve been getting into ___（真实的：日语/投资/某剧）——转场弹药提前装填。','练一遍完整转场：接天气→给料→How did you get into that?']}]},

{id:'e58',day:58,week:9,weekTitle:'社交深化',title:'聊爱好与热情：nerd out',
sub:'把你的热爱讲得有感染力',mins:14,steps:[
 {t:'intro',h:'聊爱好的进阶：从名词到故事',p:['初级聊爱好是报名词（I like movies），进阶是**讲状态和细节**：','**I\'m really into...**(超迷) / **I\'m obsessed with...**(上头) / **I nerd out about...**(一聊就停不下来)','程度阶梯：casual(随便玩玩)→hooked(上瘾)→obsessed(沉迷)——用对程度词，对方立刻知道这话题能聊多深。'],tip:'nerd out=像极客一样兴奋深聊——美国人聊到所爱之物的标准动词，带着自豪的自嘲。'},
 {t:'chunks',h:'热情语块',sub:'把热爱说出温度',items:[
  {x:"I'm really into...",c:'我特别迷……',ex:"I'm really into personal finance stuff.",exc:'我特别迷理财这块',n:'📍into句型的正装版，聊什么都行'},
  {x:"I'm kind of obsessed with...",c:'我有点沉迷……',ex:"I'm kind of obsessed with ramen these days.",exc:'我最近有点沉迷拉面',n:'kind of软化+obsessed强度=可爱的痴迷'},
  {x:"I could talk about ... all day.",c:'……我能聊一整天',ex:"Honestly, I could talk about AI all day.",exc:'讲真，AI我能聊一整天',n:'话题邀请函——对方感兴趣自然会接'},
  {x:"I got hooked after...",c:'自从……我就上瘾了',ex:"I got hooked after my first trip to Tokyo.",exc:'第一次去东京之后我就上瘾了',n:'hooked=上钩；讲入坑故事的起手式'},
  {x:"It's my happy place.",c:'那是我的快乐老家',ex:"The gym at 6 AM—that's my happy place.",exc:'早上6点的健身房——我的快乐老家',n:'美式温情表达，聊爱好收尾金句'},
  {x:"You should try it sometime.",c:'你哪天真该试试',ex:"You should try it sometime—I'll send you my playlist.",exc:'你真该试试——我把歌单发你',n:'安利收尾，顺便创造下次联系的理由'}]},
 {t:'quiz',h:'热情检验',qs:[
  {q:'「日语学习我能聊一整天」?',opts:["I could talk about Japanese learning all day.","Japanese talks me all day.","All day is Japanese.","I speak Japanese every day."],a:"I could talk about Japanese learning all day."},
  {q:'「第一次去东京后就上瘾了」?',opts:["I got hooked after my first trip to Tokyo.","Tokyo hooks fish me.","First Tokyo I addicted.","I hook Tokyo first time."],a:"I got hooked after my first trip to Tokyo."},
  {q:'nerd out 意思是?',opts:['兴奋地深聊所爱话题','变成书呆子','退出群聊','考试失败'],a:'兴奋地深聊所爱话题'}]},
 {t:'task',h:'开口任务',p:['用热情句式聊你的真爱好60秒：I\'m really into... + I got hooked after... + I could talk about it all day.','讲的时候允许语法出错——热情的感染力＞语法的正确率，这是社交英语第一定律。']}]},

{id:'e59',day:59,week:9,weekTitle:'社交深化',title:'旅行故事：最好聊的话题',sub:'讲一次旅行，带上五感和转折',mins:14,steps:[
 {t:'intro',h:'旅行是全世界通用的社交货币',p:['旅行话题双向公式：被问 **Have you been anywhere fun lately?** / 反问 **What\'s the best trip you\'ve ever taken?**','讲旅行的钩子结构：目的地+一个惊喜(What surprised me was...)+一个翻车(The one disaster was...)+一个推荐(If you go, you have to...)','翻车故事比完美游记受欢迎十倍——**尴尬即素材**，这是美式叙事的黄金法则。'],tip:'bucket list=人生愿望清单——旅行话题高频词：Japan is top of my bucket list.'},
 {t:'chunks',h:'旅行叙事语块',sub:'惊喜+翻车+推荐三件套',items:[
  {x:"Have you been anywhere fun lately?",c:'最近去哪儿玩了吗？',ex:"So have you been anywhere fun lately?",exc:'最近去哪儿浪了吗？',n:'📍美式旅行开场问句，答案可以是任何地方包括郊区'},
  {x:"What surprised me was...",c:'让我意外的是……',ex:"What surprised me was how quiet Tokyo is.",exc:'让我意外的是东京居然那么安静',n:'惊喜钩子——反差感抓耳'},
  {x:"The one disaster was...",c:'唯一的翻车是……',ex:"The one disaster was missing the last train.",exc:'唯一翻车是错过了末班车',n:'自嘲翻车，好感度暴涨'},
  {x:"If you go, you have to...",c:'你要去的话，一定要……',ex:"If you go, you have to try the 7-Eleven food.",exc:'你要去的话，一定得试试711的吃的',n:'推荐收尾，you have to=强烈安利'},
  {x:"It's top of my bucket list.",c:'它在我愿望清单第一位',ex:"Kyoto in cherry blossom season—top of my bucket list.",exc:'樱花季的京都——愿望清单第一名',n:'bucket list=人生清单，聊梦想目的地'},
  {x:"It was worth every penny.",c:'每一分钱都花得值',ex:"Pricey, but worth every penny.",exc:'贵是贵，但每分钱都值',n:'旅行总结金句'}]},
 {t:'dialog',h:'旅行话题实战',sub:'同事问起你的日本行',lang:'en-US',mode:'role',you:'你',lines:[
  {sp:'同事',x:"Have you been anywhere fun lately?",c:'最近去哪儿玩了吗？'},
  {sp:'你',x:"Actually, yeah—I did a week in Japan. What surprised me was how easy the trains are once you get the hang of it.",c:'还真去了——在日本待了一周。让我意外的是电车系统上手后特别好用',n:'get the hang of=掌握窍门'},
  {sp:'同事',x:"Nice! Any disasters?",c:'不错！有翻车吗？'},
  {sp:'你',x:"The one disaster was ordering by pointing and getting a giant plate of raw squid. Long story short, I ate all of it out of politeness.",c:'唯一翻车是指着菜单点单，结果上来一大盘生鱿鱼。长话短说，出于礼貌我全吃了',n:'翻车+第5周的long story short，故事结构复利'},
  {sp:'同事',x:"That's amazing. I've always wanted to go.",c:'太好笑了。我一直想去来着'},
  {sp:'你',x:"You have to. If you go, hit me up—I've got a whole list.",c:'必须去。你要去就找我——我攒了一整个清单',n:'hit me up=联系我；安利+建立联系，社交闭环'}]},
 {t:'quiz',h:'旅行叙事测',qs:[
  {q:'「让我意外的是物价没那么贵」?',opts:["What surprised me was how affordable it was.","Surprise me price cheap.","The price surprised very.","I am surprise of price."],a:"What surprised me was how affordable it was."},
  {q:'bucket list 是?',opts:['人生愿望清单','购物清单','水桶批发单','黑名单'],a:'人生愿望清单'},
  {q:'hit me up 意思是?',opts:['联系我','打我','敲门','涨价'],a:'联系我'}]},
 {t:'task',h:'开口任务',p:['用三件套讲你的一次真实旅行90秒：What surprised me / The one disaster / If you go, you have to...','这段故事会成为你的社交保留节目——讲三遍，磨到顺。']}]},

{id:'e60',day:60,week:9,weekTitle:'社交深化',title:'聊吃的：美国人的美食语言',sub:'推荐/吐槽/描述口感 全套',mins:14,steps:[
 {t:'intro',h:'食物话题：零门槛高回报',p:['美国人聊吃的高频句：**I\'ve been meaning to try...**(一直想去试试) / **It\'s to die for.**(好吃到升天) / **It hits different.**(就是不一样)','口感描述包：**crispy**(脆)/**juicy**(多汁)/**rich**(浓郁)/**bland**(寡淡)/**greasy**(油腻)','点评公式：总评+一个细节：The ramen was incredible—the broth alone is worth the trip.(拉面绝了——光那口汤就值得跑一趟)'],tip:'聊吃的隐藏福利：每个推荐都能自然转成约饭——We should go sometime!'},
 {t:'chunks',h:'美食语块',sub:'推荐+描述+约饭',items:[
  {x:"I've been meaning to try...",c:'我一直想去试试……',ex:"I've been meaning to try that Korean place forever.",exc:'那家韩餐我惦记好久了',n:'📍been meaning to=一直想做没做，万能句型'},
  {x:"It's to die for.",c:'好吃到值得为它死（夸张好评）',ex:"Their cheesecake is to die for.",exc:'他家芝士蛋糕好吃到升天',n:'美式最高级美食夸赞'},
  {x:"The ... alone is worth the trip.",c:'光……就值得跑一趟',ex:"The broth alone is worth the trip.",exc:'光那口汤就值得专程去',n:'高级推荐句式，美食博主腔'},
  {x:"It was kind of a letdown.",c:'有点失望',ex:"Honestly, the famous spot was kind of a letdown.",exc:'说实话那家网红店有点拉胯',n:'letdown=期望落空；礼貌差评'},
  {x:"I'm a sucker for...",c:'我对……毫无抵抗力',ex:"I'm a sucker for anything matcha.",exc:'抹茶的东西我毫无抵抗力',n:'sucker for=无法抗拒，可爱的自我暴露'},
  {x:"We should go sometime!",c:'咱们哪天一起去呗！',ex:"You'd love it—we should go sometime!",exc:'你肯定爱——哪天一起去！',n:'美食话题→约饭的标准转化句'}]},
 {t:'quiz',h:'美食检验',qs:[
  {q:'「那家店我惦记好久了」?',opts:["I've been meaning to try that place forever.","That shop thinks me long.","I mean that shop.","Long time shop I want."],a:"I've been meaning to try that place forever."},
  {q:'礼貌吐槽「有点失望」?',opts:["It was kind of a letdown.","It is garbage food.","Terrible and bad.","I hate it all."],a:"It was kind of a letdown."},
  {q:"I'm a sucker for matcha 意思是?",opts:['我对抹茶毫无抵抗力','我讨厌抹茶','我被抹茶骗了','我卖抹茶'],a:'我对抹茶毫无抵抗力'}]},
 {t:'task',h:'开口任务',p:['推荐你的心头好餐厅30秒：总评(to die for)+细节(The ___ alone is worth the trip)+约饭(We should go sometime)。','再练一句 I\'m a sucker for ___——你的可爱标签。']}]},

{id:'e61',day:61,week:9,weekTitle:'社交深化',title:'夸人与被夸：美式恭维学',sub:'夸具体+接得住 双向修炼',mins:14,steps:[
 {t:'intro',h:'美国是恭维大国，接不住会冷场',p:['美式夸人铁律：**夸具体不夸笼统**——不说 You\'re great，说 I love how you explained that.(我特喜欢你刚才的讲解方式)','被夸标准接法：**Thanks, that means a lot.**(谢谢，这话对我很重要)——不要中式谦虚「哪里哪里」，美国人会当真。','回夸技术：Thanks! + 反手一夸：Coming from you, that\'s a huge compliment.(你这么说分量可不轻)'],tip:'日语文化谦虚(まだまだです)在美语里要切换：说 Thanks 大方收下——两套文化开关，你都要有。'},
 {t:'chunks',h:'恭维语块',sub:'夸出去+接回来',items:[
  {x:"I love how you...",c:'我特别喜欢你……的方式',ex:"I love how you broke that down for the client.",exc:'我特喜欢你给客户拆解问题的方式',n:'📍夸具体行为，职场最高级恭维；break down=拆解'},
  {x:"You crushed it.",c:'你干得太漂亮了',ex:"That demo? You crushed it.",exc:'那场演示？你绝杀了',n:'crush it=表现炸裂，美式职场高频'},
  {x:"Thanks, that means a lot.",c:'谢谢，这话对我很重要',ex:"Thanks, that means a lot—I worked hard on it.",exc:'谢谢，这评价很重要——我确实下了功夫',n:'接夸标准姿势：收下+轻展开'},
  {x:"Coming from you, that's huge.",c:'出自你之口，分量不轻',ex:"Coming from you, that's huge—you're the expert.",exc:'你说这话分量太重了——你才是专家',n:'反手回夸，双赢收场'},
  {x:"I'm flattered.",c:'受宠若惊',ex:"Wow, I'm flattered. Thank you.",exc:'哇，受宠若惊。谢谢',n:'被大夸时的优雅缓冲'},
  {x:"Where did you get...? I love it.",c:'你这……哪买的？太好看了',ex:"Where did you get that jacket? I love it.",exc:'你这夹克哪买的？太好看了',n:'夸物三连：注意到+问出处+love it，美式日常'}]},
 {t:'quiz',h:'恭维检验',qs:[
  {q:'被夸 Your English is great! 美式标准回应?',opts:["Thanks, that means a lot. I've been working on it.","No no no, very bad.","You are wrong.","Stop it please."],a:"Thanks, that means a lot. I've been working on it.",explain:'大方收下+轻展开——中式谦虚在这会冷场'},
  {q:'夸同事演示做得好，最高级说法?',opts:["I love how you broke that down—you crushed it.","You are a person who works.","Not bad I guess.","Your slides exist."],a:"I love how you broke that down—you crushed it."},
  {q:'crushed it 意思是?',opts:['表现得极好','压坏了它','很沮丧','搞砸了'],a:'表现得极好'}]},
 {t:'task',h:'开口任务',p:['双向修炼各2遍：夸出去(I love how you...)+接回来(Thanks, that means a lot)。','今天真实夸一个人（中文也行），感受「夸具体」的威力——明天用英语夸。']}]},

{id:'e62',day:62,week:9,weekTitle:'社交深化',title:'邀请与做客：美式串门礼仪',sub:'Come over / potluck / What can I bring?',mins:14,steps:[
 {t:'intro',h:'被邀请到家里=友谊升级的信号',p:['邀请句式：**You should come over!**(来我家玩呗)——come over=串门，美式友谊的里程碑动词。','**potluck**文化：各带一菜的聚会——被邀必问 **What can I bring?**(我带点什么?)，空手赴约是大忌。','到场三件套：夸房子(Your place is awesome)+带小礼(I brought some wine)+离场感谢(Thanks for having me)。'],tip:'What can I bring? 是美式做客的通关密语——就算主人说 Just yourself!(带上你自己就行)，问了就是懂事。'},
 {t:'chunks',h:'做客语块',sub:'邀请→赴约→离场',items:[
  {x:"You should come over sometime!",c:'哪天来我家玩呗！',ex:"You should come over sometime—I'll cook.",exc:'哪天来我家——我做饭',n:'📍come over=来家里，友谊升级邀请'},
  {x:"What can I bring?",c:'我带点什么？',ex:"Sounds fun! What can I bring?",exc:'好呀！我带点啥？',n:'受邀必问，美式礼仪硬通货'},
  {x:"I brought a little something.",c:'我带了点小东西',ex:"I brought a little something—hope you like red.",exc:'带了点小心意——希望你喜欢红酒',n:'递礼物时的谦虚句式'},
  {x:"Your place is awesome.",c:'你家太赞了',ex:"Wow, your place is awesome—love the view.",exc:'哇你家绝了——这视野爱了',n:'进门必夸，加一个细节更真诚'},
  {x:"Make yourself at home.",c:'别拘束，当自己家',ex:"Come in! Make yourself at home.",exc:'快进来！当自己家别客气',n:'主人款待标准句，听懂就放松'},
  {x:"Thanks for having me.",c:'谢谢招待',ex:"This was great—thanks for having me!",exc:'今天太开心了——谢谢招待！',n:'离场必说，对应主人的 Thanks for coming'}]},
 {t:'dialog',h:'做客全流程实战',sub:'同事邀你周末BBQ',lang:'en-US',mode:'role',you:'你',lines:[
  {sp:'同事',x:"We're doing a BBQ Saturday—you should come over!",c:'我们周六烧烤——你来呗！'},
  {sp:'你',x:"I'd love that! What can I bring?",c:'太想去了！我带点什么？',n:'接受+通关密语'},
  {sp:'同事',x:"Just yourself! Maybe drinks if you insist.",c:'带上你自己就行！非要带的话带点喝的'},
  {sp:'你',x:"Drinks it is. What time should I swing by?",c:'那就喝的。我几点过去合适？',n:'X it is=那就定X；swing by=顺道过去'},
  {sp:'同事',x:"Anytime after four. See you then!",c:'四点以后随时。到时见！'},
  {sp:'你',x:"Sounds good—see you Saturday!",c:'好嘞——周六见！'}]},
 {t:'quiz',h:'做客检验',qs:[
  {q:'受邀后的礼仪必问?',opts:["What can I bring?","How much money you spend?","Why you invite me?","Who else better than me?"],a:"What can I bring?"},
  {q:'主人说 Make yourself at home 意思是?',opts:['别拘束随意点','请你回家','帮忙打扫','你住这吧'],a:'别拘束随意点'},
  {q:'离场时说?',opts:["Thanks for having me.","Thanks for cooking bad.","I go now bye.","Your home is over."],a:"Thanks for having me."}]},
 {t:'task',h:'开口任务',p:['自演受邀全流程：I\'d love that → What can I bring → What time should I swing by → 离场 Thanks for having me。','这套流程演熟，美国的家门就为你打开了——文化里子和语言面子一起拿下。']}]},

{id:'e63',day:63,week:9,weekTitle:'社交深化',title:'第9周整合 · 社交连续剧',sub:'从陌生到约饭：完整友谊线',mins:15,steps:[
 {t:'intro',h:'整合：友谊的完整生产线',p:['本周军火：转场钩子+热情表达+旅行故事+美食推荐+恭维学+做客礼仪——这是**从认识到成为朋友**的完整链路。','美国社交的真相：没人在意你的语法，人们记住的是**你让他们感觉如何**——细节、热情、接得住，比完美时态值钱一百倍。','今天连续剧验收：一场派对上的完整社交。'],tip:'社交英语的复利公式：每场对话记住对方一个细节，下次见面先问它——你会成为「那个特别会聊的人」。'},
 {t:'dialog',h:'派对社交连续剧',sub:'朋友的homeparty，你一个人都不认识',lang:'en-US',mode:'role',you:'你',lines:[
  {sp:'陌生人',x:"Hey! I don't think we've met—I'm Jordan.",c:'嘿！我们好像没见过——我是Jordan'},
  {sp:'你',x:"Kenny! Nice to meet you. How do you know Sarah?",c:'Kenny！幸会。你和Sarah怎么认识的？',n:'派对破冰标准问：和主人的关系'},
  {sp:'陌生人',x:"College roommates. So what do you do, Kenny?",c:'大学室友。Kenny你做什么工作？'},
  {sp:'你',x:"I'm a Salesforce consultant—basically I help companies untangle their customer data. I could talk about it all day, but I'll spare you.",c:'我是Salesforce顾问——简单说就是帮公司理顺客户数据。这话题我能聊一天，但饶了你吧',n:"untangle=理顺；I'll spare you=饶过你，自嘲式收住"},
  {sp:'陌生人',x:"Ha! Appreciated. Wait—is that a Japan pin on your bag?",c:'哈！感谢嘴下留情。等等——你包上是日本徽章吗？'},
  {sp:'你',x:"Good eye! I got hooked after my first trip. If you ever go, the 7-Eleven food alone is worth the trip.",c:'好眼力！第一次去就上瘾了。你要去的话，光711的吃的就值回票价',n:'good eye=眼尖；热情+推荐，两周装备连发'},
  {sp:'陌生人',x:"That's my kind of travel advice. We should grab ramen sometime—I know a spot.",c:'这旅行建议对我胃口。改天一起吃拉面——我知道个好地方'},
  {sp:'你',x:"I'm so down. Here—put your number in.",c:'太可以了。来——留个号码',n:'社交闭环：从陌生人到约饭，一场对话完成'}]},
 {t:'quiz',h:'第9周通关测',qs:[
  {q:'派对上问陌生人和主人的关系?',opts:["How do you know Sarah?","Why are you here?","Who let you in?","Are you important?"],a:"How do you know Sarah?"},
  {q:'「这话题我能聊一天，但饶了你吧」的后半句?',opts:["I'll spare you.","I'll kill you.","You must listen.","No escape for you."],a:"I'll spare you."},
  {q:'「光711的吃的就值回票价」?',opts:["The 7-Eleven food alone is worth the trip.","7-Eleven is a store with food.","Food travel money good.","Trip worth is 7-Eleven."],a:"The 7-Eleven food alone is worth the trip."},
  {q:'👂听邀约',audio:{x:"We should grab ramen sometime—I know a spot.",lang:'en-US'},opts:['约你改天吃拉面','问拉面做法','推销拉面店','取消拉面计划'],a:'约你改天吃拉面'},
  {q:'good eye 意思是?',opts:['眼力好/观察敏锐','眼睛漂亮','视力检查','好眼药'],a:'眼力好/观察敏锐'}]},
 {t:'task',h:'本周输出任务',p:['3分钟派对模拟：自我介绍→职业一句话+自嘲收住→抓细节转场→热情话题→约饭闭环。','记住社交复利公式：一场对话，记住对方一个细节。从今天的中文社交就开始练。']}]},

{id:'e64',day:64,week:10,weekTitle:'领域深聊',title:'职业故事：Tell me about yourself',sub:'把你的经历讲成一条故事线',mins:15,steps:[
 {t:'intro',h:'最高频也最值钱的问题',p:['**Tell me about yourself / So what\'s your story?**——面试、networking、饭局都会遇到。答好它=黄金第一印象。','故事线结构（60秒版）：**起点**(I started out in...)→**转折**(Then I realized...)→**现在**(These days I focus on...)→**方向**(What I\'m excited about now is...)','关键：不是简历朗读，是**选择+因果**——为什么转、图什么、去哪里。'],tip:'started out=起步于——职业叙事第一动词。你的版本今天就定稿。'},
 {t:'chunks',h:'职业叙事语块',sub:'四段式故事线',items:[
  {x:"I started out in...",c:'我起步于……',ex:"I started out in traditional IT consulting.",exc:'我最早做传统IT咨询',n:'📍职业故事标准开头'},
  {x:"Then I realized...",c:'后来我意识到……',ex:"Then I realized CRM was where things were heading.",exc:'后来我意识到CRM才是大势所趋',n:'转折点=故事的灵魂；where things were heading=趋势所在'},
  {x:"These days I focus on...",c:'现在我专注于……',ex:"These days I focus on helping companies get Salesforce right.",exc:'现在我专注帮企业用好Salesforce',n:'get ... right=把〜做对做好'},
  {x:"What I'm excited about now is...",c:'我现在最兴奋的是……',ex:"What I'm excited about now is where AI fits into all this.",exc:'我现在最兴奋的是AI在其中的位置',n:'面向未来收尾，留下钩子'},
  {x:"One thing led to another.",c:'一来二去就……',ex:"I took one project, one thing led to another, and here I am.",exc:'接了个项目，一来二去就走到今天',n:'跳过细节的优雅过渡'},
  {x:"...which turned out to be the best decision.",c:'……结果成了最正确的决定',ex:"I switched tracks, which turned out to be the best decision.",exc:'我换了赛道，结果证明是最对的决定',n:'switch tracks=换赛道；给转折一个落点'}]},
 {t:'dialog',h:'职业故事实战',sub:'networking活动上被问story',lang:'en-US',mode:'role',you:'你',lines:[
  {sp:'新识',x:"So Kenny, what's your story?",c:'Kenny，说说你的故事？'},
  {sp:'你',x:"Sure! I started out in general IT consulting back in Shanghai. Then I realized CRM was where everything was heading, so I went deep on Salesforce.",c:'好啊！我最早在上海做泛IT咨询。后来意识到CRM是大方向，就在Salesforce上扎了下去',n:'起点+转折，went deep on=深耕'},
  {sp:'新识',x:"Smart move. And now?",c:'明智。那现在呢？'},
  {sp:'你',x:"These days I focus on implementation for mid-size companies. What I'm really excited about now is where AI fits in—it's changing my whole workflow.",c:'现在专注中型企业的实施。最让我兴奋的是AI的切入——它在改变我的整个工作流',n:'现在+未来钩子，对方必追问AI'},
  {sp:'新识',x:"Oh, I want to hear more about that.",c:'哦这个我想多听听',n:'钩子生效——话题的主动权到你手里了'}]},
 {t:'quiz',h:'故事线检验',qs:[
  {q:'职业故事的标准开头?',opts:["I started out in...","I was born in hospital...","My resume says...","Long ago in the past..."],a:"I started out in..."},
  {q:'「后来我意识到CRM是趋势」?',opts:["Then I realized CRM was where things were heading.","CRM realized me the trend.","Then CRM is trend I know.","I see CRM go up so."],a:"Then I realized CRM was where things were heading."},
  {q:'switch tracks 意思是?',opts:['换赛道/转方向','换火车','切换音轨','逃跑'],a:'换赛道/转方向'}]},
 {t:'task',h:'开口任务',p:['定稿你的60秒职业故事：started out→realized→these days→excited about now。用你的真实经历填空。','连说3遍到脱稿——这60秒会在未来的面试、酒会、飞机邻座反复兑现。']}]},

{id:'e65',day:65,week:10,weekTitle:'领域深聊',title:'AI深聊2.0：从观点到洞察',sub:'把第41课的立场升级成完整论述',mins:15,steps:[
 {t:'intro',h:'你的主场话题，配上更锋利的工具',p:['第41课你有了立场，今天升级成**洞察级表达**——三个高级动作：','**区分**(There\'s a difference between A and B)：There\'s a difference between using AI and using it well.','**趋势**(The real shift is...)：The real shift is in how we define productivity.','**预判反驳**(People assume..., but...)：People assume it\'s about speed, but it\'s really about leverage.'],tip:'leverage(杠杆)/edge(优势)/shift(转变)——美式商业深聊三大名词，今天全部入库。'},
 {t:'chunks',h:'洞察语块',sub:'区分/趋势/反驳预判',items:[
  {x:"There's a difference between A and B.",c:'A和B是两回事',ex:"There's a difference between using AI and using it well.",exc:'「用AI」和「用好AI」是两回事',n:'📍一句话建立思考深度'},
  {x:"The real shift is...",c:'真正的转变在于……',ex:"The real shift is in how teams are structured.",exc:'真正的转变在于团队结构',n:'把话题从表面拉到本质'},
  {x:"People assume..., but...",c:'人们以为……但其实……',ex:"People assume it's about replacing people, but it's about leverage.",exc:'人们以为是替代人，其实是杠杆',n:'预判+反转，洞察感拉满'},
  {x:"It gives you an edge.",c:'它给你优势',ex:"Knowing how to prompt well gives you a real edge.",exc:'会写提示词是实打实的优势',n:'edge=竞争优势，商业口语高频'},
  {x:"We're still in the early innings.",c:'现在还只是开局阶段',ex:"Honestly, we're still in the early innings of this.",exc:'说实话这事还在开局阶段',n:'棒球比喻：early innings=前几局，硅谷腔'},
  {x:"Time will tell.",c:'时间会给答案',ex:"Will it last? Time will tell.",exc:'能不能持续？时间会说话',n:'开放式收尾，谦逊又不失态度'}]},
 {t:'quiz',h:'洞察检验',qs:[
  {q:'「会用和用好是两回事」?',opts:["There's a difference between using it and using it well.","Use and use good different.","Two things is using.","Well use is not use."],a:"There's a difference between using it and using it well."},
  {q:'「人们以为是替代，其实是杠杆」?',opts:["People assume it's about replacing, but it's about leverage.","People replace leverage think.","Assume people wrong lever.","Replacing is leverage people say."],a:"People assume it's about replacing, but it's about leverage."},
  {q:'early innings 比喻?',opts:['还在开局阶段','快结束了','局势混乱','注定失败'],a:'还在开局阶段'}]},

{id:'e66',day:66,week:10,weekTitle:'领域深聊',title:'聊钱与投资：财务自由话题',sub:'FIRE / passive income / play the long game',mins:15,steps:[
 {t:'intro',h:'你的第二主场：投资与财务自由',p:['美国聊钱文化：朋友间聊**理念和策略**没问题（具体工资除外）。你的FIRE话题在美国有大量同好。','核心词装备：**FIRE**(财务自由提早退休)/**passive income**(被动收入)/**compound interest**(复利)/**diversify**(分散)/**play the long game**(打长期牌)','你的招牌句预制：**I\'m playing the long game—compound interest does the heavy lifting.**(我打长期牌——复利来干重活)'],tip:'do the heavy lifting=干重活挑大梁——描述系统/工具/策略替你出力，商务口语高频。'},
 {t:'chunks',h:'财务语块',sub:'理念级聊钱',items:[
  {x:"I'm playing the long game.",c:'我打的是长期牌',ex:"No day trading for me—I'm playing the long game.",exc:'我不做短线——打的是长期牌',n:'📍长期主义者的身份宣言'},
  {x:"Compound interest does the heavy lifting.",c:'复利来干重活',ex:"I just stay consistent—compound interest does the heavy lifting.",exc:'我只管坚持投入——复利负责干重活',n:'你的学习观和投资观是同一句话'},
  {x:"...is my main passive income stream.",c:'……是我的主要被动收入',ex:"Index funds are my main passive income play.",exc:'指数基金是我被动收入的主打',n:'stream/play=收入渠道说法'},
  {x:"Don't put all your eggs in one basket.",c:'别把鸡蛋放一个篮子',ex:"Classic advice: don't put all your eggs in one basket.",exc:'老话说得好：鸡蛋别放一个篮子',n:'分散投资谚语，全球通用'},
  {x:"It's about buying your freedom back.",c:'本质是把自由买回来',ex:"FIRE isn't about being rich—it's about buying your freedom back.",exc:'FIRE不是为了富，是把自由买回来',n:'FIRE理念金句，深聊必杀'},
  {x:"Live below your means.",c:'花得比赚得少',ex:"Rule one: live below your means.",exc:'第一原则：花得比赚得少',n:'means=财力；美式理财第一格言'}]},
 {t:'dialog',h:'财务话题实战',sub:'朋友问起你的理财观',lang:'en-US',mode:'role',you:'你',lines:[
  {sp:'朋友',x:"You're into investing, right? Any hot tips?",c:'你搞投资对吧？有什么内幕好料？'},
  {sp:'你',x:"Ha, nothing hot—I'm playing the long game. Index funds, stay consistent, let compound interest do the heavy lifting.",c:'哈，没有内幕——我打长期牌。指数基金，持续投入，让复利干重活',n:'拒绝荐股+理念输出，格局立现'},
  {sp:'朋友',x:"That sounds... boring, honestly.",c:'听起来……说实话有点无聊'},
  {sp:'你',x:"Totally fair—it is boring. But here's the thing: to me, FIRE isn't about getting rich. It's about buying your freedom back.",c:'完全理解——确实无聊。但关键是：对我来说FIRE不是为了暴富，是把自由买回来',n:'接住吐槽+价值观金句，深聊高光时刻'},
  {sp:'朋友',x:"OK, when you put it that way, I get it.",c:'行，你这么说我就懂了',n:'put it that way=这么表述'}]},
 {t:'quiz',h:'财务话题测',qs:[
  {q:'「我打长期牌」?',opts:["I'm playing the long game.","I play long time games.","My game is very long.","Long play I game."],a:"I'm playing the long game."},
  {q:'「复利干重活」?',opts:["Compound interest does the heavy lifting.","Interest lifts heavy things.","Compound is strong muscle.","Heavy money interest works."],a:"Compound interest does the heavy lifting."},
  {q:'live below your means 意思是?',opts:['花得比赚得少','住在楼下','生活水准低','赚得太少'],a:'花得比赚得少'}]},
 {t:'task',h:'开口任务',p:['录60秒你的理财观：playing the long game + compound interest + buying your freedom back——全是你真实的信念，只是换了语言。','这个话题的英语你会讲一辈子——今天铸的每句都是长期资产。']}]},

{id:'e67',day:67,week:10,weekTitle:'领域深聊',title:'介绍中国：家乡与文化话题',sub:'被问 What\'s it like in China? 的从容应对',mins:15,steps:[
 {t:'intro',h:'你一定会被问到的话题',p:['在美国社交，中国背景的你必被问：**What\'s it like in Shanghai?** / **Do you miss home?**——这是好奇不是审视，是你的**独家话题红利**。','应对结构：**一个反差**(What surprises people is...)+**一个细节**(For example...)+**一个共同点**(It\'s actually similar to...)','敏感话题从容化：**It\'s complicated, but my experience was...**(挺复杂的，但我的体验是…)——聊个人体验，不背宏大叙事。'],tip:'讲家乡的黄金素材是「日常细节」：扫码买菜、高铁、外卖速度——比任何大词都让美国人惊叹。'},
 {t:'chunks',h:'家乡话题语块',sub:'反差+细节+桥梁',items:[
  {x:"What surprises people is...",c:'最让人意外的是……',ex:"What surprises people is how digital everything is.",exc:'最让人意外的是一切都数字化了',n:'📍反差开场，瞬间抓住注意力'},
  {x:"Picture this: ...",c:'你想象一下：……',ex:"Picture this: you buy street food by scanning a QR code.",exc:'你想象下：路边摊都是扫码买单',n:'画面感开关，讲细节神器'},
  {x:"It's actually pretty similar to...",c:'其实和……挺像的',ex:"The work culture is actually pretty similar to New York.",exc:'职场文化其实和纽约挺像',n:'找共同点，把「异域」变「共鸣」'},
  {x:"I do miss the food, not gonna lie.",c:'讲真，吃的我是真想',ex:"I do miss the food, not gonna lie—especially breakfast.",exc:'讲真最想吃的——尤其是早餐',n:'do+动词=强调；真诚又轻松的乡愁'},
  {x:"It's complicated, but my experience was...",c:'挺复杂的，但我的体验是……',ex:"It's complicated, but my experience was mostly positive.",exc:'这事挺复杂，但我的个人体验大都是好的',n:'敏感话题的从容框架：只代表自己'},
  {x:"You should visit—I'll be your guide.",c:'你该去看看——我当导游',ex:"Seriously, you should visit—I'll be your guide.",exc:'真的，你该去一趟——我给你当导游',n:'话题收尾+关系升级，一箭双雕'}]},
 {t:'dialog',h:'家乡话题实战',sub:'酒局上被问上海生活',lang:'en-US',mode:'role',you:'你',lines:[
  {sp:'同事',x:"So what's it like living in Shanghai? I've always wondered.",c:'在上海生活什么样？我一直好奇'},
  {sp:'你',x:"What surprises people is the pace—and how digital everything is. Picture this: street food, taxis, rent—all paid by scanning a code. Cash basically disappeared.",c:'最让人意外的是节奏——还有数字化程度。你想象下：路边摊、打车、房租，全扫码。现金基本消失了',n:'反差+画面细节，对方已经wow了'},
  {sp:'同事',x:"That's wild. Do you miss it?",c:'太神了。你想家吗？'},
  {sp:'你',x:"I do miss the food, not gonna lie. The breakfast scene alone is worth a trip. You should visit—I'll be your guide.",c:'讲真最想吃的。光早餐文化就值得飞一趟。你该去看看——我当导游',n:'真诚乡愁+安利+关系升级，完美闭环'},
  {sp:'同事',x:"Careful, I might take you up on that!",c:'小心我当真哦！',n:'take you up on that=接受你的提议'}]},
 {t:'quiz',h:'家乡话题测',qs:[
  {q:'讲家乡的反差开场?',opts:["What surprises people is...","China is big country...","You don't know China...","Let me teach you..."],a:"What surprises people is..."},
  {q:'「你想象一下：全都扫码支付」?',opts:["Picture this: everything's paid by scanning a code.","See photo: code money.","Imagine picture of pay.","Draw this: QR life."],a:"Picture this: everything's paid by scanning a code."},
  {q:'take you up on that 意思是?',opts:['接受你的提议','把你抬上去','超过你','逗你玩'],a:'接受你的提议'}]},
 {t:'task',h:'开口任务',p:['打磨你的「上海60秒」：What surprises people is... + Picture this... + I do miss... + You should visit.','这是你独有的话题主权——练到能带着笑讲完。']}]},

{id:'e68',day:68,week:10,weekTitle:'领域深聊',title:'聊未来规划：where do you see yourself',sub:'五年之问的漂亮答法',mins:14,steps:[
 {t:'intro',h:'五年之问：面试与深聊双场景',p:['**Where do you see yourself in five years?**——面试必考，朋友深聊也会到这。答好的结构：','**方向而非职位**(I see myself moving toward...)+**正在做的事**(That\'s why I\'m currently...)+**开放心态**(But I try to stay open.)','你的真实素材超硬核：五年语言计划+财务自由路线+AI时代站位——今天把它们英语化。'],tip:'美式聊未来的姿态：有方向但不僵硬——ambitious yet flexible，两头都要占。'},
 {t:'chunks',h:'未来语块',sub:'方向+行动+开放',items:[
  {x:"I see myself moving toward...",c:'我看到自己在朝……走',ex:"I see myself moving toward more strategic work.",exc:'我在朝更偏战略的方向走',n:'📍五年之问标准开头，说方向不说头衔'},
  {x:"That's why I'm currently...",c:'所以我现在正在……',ex:"That's why I'm currently learning Japanese and doubling down on AI.",exc:'所以我现在在学日语、深耕AI',n:'double down on=加倍投入；方向落到行动，说服力来源'},
  {x:"The five-year plan is...",c:'五年计划是……',ex:"The five-year plan is financial independence, or at least the option.",exc:'五年计划是财务自由——至少是有得选',n:'or at least=退一步表述，成熟感'},
  {x:"I try to stay open.",c:'我保持开放心态',ex:"That's the direction, but I try to stay open.",exc:'方向是这个，但我保持开放',n:'开放收尾，避免命运立flag'},
  {x:"It's a marathon, not a sprint.",c:'这是马拉松不是冲刺',ex:"Career-wise, it's a marathon, not a sprint.",exc:'职业这事，是马拉松不是百米冲刺',n:'美式长期主义第一谚语'},
  {x:"Ask me again in five years.",c:'五年后再问我（笑）',ex:"Will I get there? Ask me again in five years.",exc:'能不能成？五年后再问我',n:'幽默收尾，自信又不装'}]},
 {t:'quiz',h:'未来之问测',qs:[
  {q:'五年之问的高分开头?',opts:["I see myself moving toward...","I will be CEO exactly...","No idea, whatever...","Five years I am boss..."],a:"I see myself moving toward..."},
  {q:'「所以我现在在学日语」?',opts:["That's why I'm currently learning Japanese.","So now Japanese learns me.","Because Japanese I study now why.","Currently why Japanese learning."],a:"That's why I'm currently learning Japanese."},
  {q:'「马拉松不是冲刺」表达?',opts:["It's a marathon, not a sprint.","Run long no fast.","Marathon wins sprint.","Slow is the winner run."],a:"It's a marathon, not a sprint."}]},
 {t:'task',h:'开口任务',p:['组装你的「五年之答」60秒：moving toward + that\'s why I\'m currently + five-year plan + stay open。','这个答案面试能用、社交能用、对自己更有用——每年复述一次，看它成真。']}]},

{id:'e69',day:69,week:10,weekTitle:'领域深聊',title:'深聊综合战：一场有质量的长谈',sub:'职业+AI+钱+家乡+未来 全话题连轴',mins:15,steps:[
 {t:'intro',h:'终极社交场景：两小时的深聊',p:['真实的深聊不分话题——职业聊到AI，AI聊到钱，钱聊到家乡，家乡聊到未来。**话题会流动，你要能跟着流**。','话题流动润滑剂：**That reminds me of...**(这让我想起) / **Going back to what you said...**(说回你刚才提的) / **On a related note...**(说个相关的)','今天是领域周大考：一场五话题连轴的深聊。'],tip:'深聊的最高技巧是「回收」：把对方20分钟前说的话重新提起——Going back to what you said about...——没有比这更让人感到被倾听的了。'},
 {t:'chunks',h:'话题流动语块',sub:'让长谈自然流转',items:[
  {x:"That reminds me of...",c:'这让我想起……',ex:"That reminds me of something my mentor said.",exc:'这让我想起我导师说过的一句话',n:'📍话题跳转的自然桥'},
  {x:"Going back to what you said about...",c:'说回你刚才提到的……',ex:"Going back to what you said about burnout—I've been there.",exc:'说回你刚才提的职业倦怠——我经历过',n:'回收技术：深聊最高礼遇'},
  {x:"On a related note, ...",c:'说个相关的……',ex:"On a related note, have you tried automating that?",exc:'说个相关的，你试过把它自动化吗？',n:'横向展开话题'},
  {x:"That's a whole other conversation.",c:'那就是另一个大话题了',ex:"Don't get me started on crypto—that's a whole other conversation.",exc:'别让我开聊加密货币——那是另一个大坑',n:"don't get me started=一聊就停不下来"},
  {x:"I've been there.",c:'我经历过/懂那种感受',ex:"Burnout? I've been there. It's rough.",exc:'倦怠？我经历过。真的难',n:'共情三个字，胜过千言'},
  {x:"This was a great conversation.",c:'这场聊天太棒了',ex:"Man, this was a great conversation—let's do it again.",exc:'兄弟这场聊得太好了——下次再来',n:'深聊的完美落幕句'}]},
 {t:'dialog',h:'深聊综合实战',sub:'和新朋友的咖啡长谈（精华剪辑版）',lang:'en-US',mode:'role',you:'你',lines:[
  {sp:'朋友',x:"So your whole job is fixing companies' Salesforce? How did you get into that?",c:'所以你的工作就是帮公司搞定Salesforce？怎么入行的？'},
  {sp:'你',x:"I started out in general consulting, then realized CRM was where things were heading. One thing led to another.",c:'我从泛咨询起步，后来意识到CRM是趋势。一来二去就深耕了',n:'第64课故事线，脱口而出'},
  {sp:'朋友',x:"And now AI is eating consulting too, right? Are you worried?",c:'现在AI又在吞噬咨询业了对吧？你慌吗？'},
  {sp:'你',x:"People assume it's about replacement, but honestly it's about leverage. It's doubled my output. That said, the pace is wild.",c:'人们以为是替代，但说实话是杠杆。它让我产出翻倍。话虽如此，这速度确实吓人',n:'第65课洞察+让步，思想浓度在线'},
  {sp:'朋友',x:"Fair. So what do you do with the extra time—more work?",c:'有理。那省出的时间干嘛——接更多活？'},
  {sp:'你',x:"Ha, no. That reminds me of my whole philosophy—I'm playing the long game. The plan is buying my freedom back, not filling every hour.",c:'哈，不。这让我想起我的整个理念——我打长期牌。计划是把自由买回来，不是填满每小时',n:'话题桥+第66课理念，深聊行云流水'},
  {sp:'朋友',x:"Man, this was a great conversation.",c:'兄弟，这场聊得是真好'},
  {sp:'你',x:"Right? Let's do this again—next one's on me.",c:'是吧？下次再聊——下回我请',n:"on me=我请客。深聊闭环，友谊+1"}]},
 {t:'quiz',h:'深聊流动测',qs:[
  {q:'把话题引回对方之前说的内容?',opts:["Going back to what you said about...","You said before something...","Remember your words...","As you were saying maybe..."],a:"Going back to what you said about..."},
  {q:'「别让我开聊加密货币」?',opts:["Don't get me started on crypto.","No crypto talking start.","Crypto stops my mouth.","Start me not on crypto."],a:"Don't get me started on crypto."},
  {q:"I've been there 意思是?",opts:['我经历过（共情）','我去过那里旅游','我到了','我住在那'],a:'我经历过（共情）'}]},
 {t:'task',h:'开口任务',p:['终极演练：把职业故事→AI观点→理财观三段连讲5分钟，中间用 That reminds me of... 自然过桥。','录音存档——这是你「英语思想者」身份的第一份完整证据。']}]},

{id:'e70',day:70,week:10,weekTitle:'领域深聊',title:'第10周整合 · 你的话题主权地图',sub:'五大主场话题全部武装完毕',mins:14,steps:[
 {t:'intro',h:'盘点你的话题主权',p:['本周你完成了英语学习者最难的跨越：**从「能聊别人的话题」到「有自己的话题」**。','你的五大主场：职业故事(60秒版)/AI洞察(90秒版)/理财哲学(60秒版)/上海故事(60秒版)/五年之答(60秒版)——加起来是**5分钟的思想名片**。','这些内容你会讲几百遍——每讲一遍都在变得更流利，这是最高效的口语复利资产。'],tip:'话题主权的含义：在这五个话题上，你不再是学英语的人，而是「恰好用英语表达的专家」——身份感决定流利度。'},

  {q:'职业故事四段式的顺序?',opts:["started out → realized → these days → excited about","excited → started → realized → days","days → started → excited → realized","realized → excited → started → days"],a:"started out → realized → these days → excited about"},
  {q:'「用AI和用好AI是两回事」?',opts:["There's a difference between using AI and using it well.","AI use good use different thing.","Using AI well is AI using.","Different AI is well used."],a:"There's a difference between using AI and using it well."},

  {q:'👂听深聊',audio:{x:"Going back to what you said about the long game—I think you're onto something.",lang:'en-US'},opts:['回应你之前说的长期主义，觉得有道理','换一个新话题','结束对话','反驳长期主义'],a:'回应你之前说的长期主义，觉得有道理'},
  {q:'讲家乡的画面感开关?',opts:["Picture this: ...","Look my photo...","Imagine if you can...","China has 5000 years..."],a:"Picture this: ..."}]},
 {t:'task',h:'本周输出任务',p:['把五大主场话题各讲一遍（共约5分钟），一次录完不中断——允许卡顿，不允许放弃。','存好这份录音：这是第10周的你。第12周毕业时再录一次，听听两周的差距。']}]}

{id:'e71',day:71,week:11,weekTitle:'听力与语感',title:'缩读II：连读的深水区',sub:'whaddya / lemme / gimme / hafta',mins:14,steps:[
 {t:'intro',h:'听不懂的最后一公里',p:['第3课你学了gonna/wanna，今天进深水区——美国人嘴里的高频压缩包：','**whaddya**(what do you)/**lemme**(let me)/**gimme**(give me)/**hafta**(have to)/**shoulda**(should have)/**dunno**(don\'t know)','规则：这些是**听力必修、口语选修**——听懂是硬需求，自己说可以先用完整形。'],tip:'shoulda/coulda/woulda 连成一句 = 「早知道就…」的马后炮三兄弟，美剧一集出现十次。'},

{id:'e72',day:72,week:11,weekTitle:'听力与语感',title:'短语动词核心批：日常前20',sub:'figure out / deal with / come up 家族',mins:15,steps:[
 {t:'intro',h:'美语的真正词汇量在短语动词里',p:['美国人日常不说 solve/tolerate/occur，说 **figure out/put up with/come up**——动词+小词=美语的原子。','今天核心批按场景装：**搞定系**(figure out弄明白/sort out理顺/work out解决)、**应对系**(deal with处理/put up with忍受)、**出现系**(come up突然出现/show up到场/end up最终成为)','记法铁律：短语动词永远**整块+例句**记，拆开记必忘。'],tip:'come up 三连：Something came up(有事)/A question came up(冒出问题)/It came up in conversation(聊到了)——一个短语动词吃透=十个单词。'},
 {t:'chunks',h:'短语动词核心批',sub:'搞定/应对/出现 三大家族',items:[
  {x:"figure out",c:'弄明白/想出办法',ex:"I finally figured out why the report was off.",exc:'我终于弄明白报表为啥不对了',n:'📍美语第一短语动词，解决问题必用'},
  {x:"deal with",c:'处理/应对',ex:"I'll deal with the client emails first.",exc:'我先处理客户邮件',n:'处理事也处理人：deal with a difficult person'},
  {x:"put up with",c:'忍受',ex:"I don't know how you put up with that noise.",exc:'真不知道你怎么忍受那噪音的',n:'三词短语动词，整块吞'},
  {x:"show up",c:'出现/到场',ex:"Half the team didn't show up to the call.",exc:'一半人没上会',n:'show up late=迟到出现'},
  {x:"run out of",c:'用完/耗尽',ex:"We're running out of time—let's wrap up.",exc:'时间不多了——收尾吧',n:'run out of time/money/patience 全通用'},
  {x:"look forward to",c:'期待',ex:"Looking forward to it!",exc:'超期待！',n:'邮件结尾之王：Looking forward to hearing from you'}]},
 {t:'quiz',h:'短语动词测',qs:[
  {q:'「我弄明白问题出在哪了」?',opts:["I figured out what the problem was.","I looked the problem.","I solved out problem where.","I understand down the problem."],a:"I figured out what the problem was."},
  {q:'「时间快用完了」?',opts:["We're running out of time.","Time is running us.","We run time off.","Out of we run time."],a:"We're running out of time."},
  {q:'put up with 意思是?',opts:['忍受','安装','举起','陪伴'],a:'忍受'},
  {q:'邮件结尾「期待回复」?',opts:["Looking forward to hearing from you.","Waiting your letter always.","Expect you answer me.","Hope mail me back."],a:"Looking forward to hearing from you."}]},
 {t:'task',h:'开口任务',p:['用今天6个短语动词各造一句你生活里的真句——figure out 一定要配你最近真的搞明白的事。','之后遇到不会的动词先想：有没有短语动词版？——思维切换是地道的开始。']}]},

{id:'e73',day:73,week:11,weekTitle:'听力与语感',title:'高频习语：美国人的每日成语',sub:'piece of cake / hit the road / on the fence',mins:14,steps:[
 {t:'intro',h:'习语：懂了才算进了圈子',p:['习语是美语的暗号——字面全懂、含义全猜错。今天装日常前排：','**难易系**：piece of cake(小菜一碟)/not rocket science(没那么难)','**行动系**：hit the road(出发)/call it a day(今天到此为止)','**状态系**：on the fence(还在犹豫)/under the weather(不舒服)/on the same page(共识一致)'],tip:'习语使用铁律：听懂优先，使用克制——一段话塞三个习语像装地道，一段话用对一个是真地道。'},
 {t:'chunks',h:'习语前排批',sub:'按场景成组记',items:[
  {x:"It's a piece of cake.",c:'小菜一碟',ex:"The setup? Piece of cake, ten minutes.",exc:'安装？小菜一碟，十分钟',n:'📍形容事情简单的第一习语'},
  {x:"Let's call it a day.",c:'今天就到这吧',ex:"Good progress—let's call it a day.",exc:'进展不错——今天收工',n:'办公室下班仪式感一句'},
  {x:"I'm still on the fence.",c:'我还在犹豫',ex:"iPhone or Android? I'm still on the fence.",exc:'iPhone还是安卓？我还骑墙呢',n:'骑在栅栏上=两边都没跳'},
  {x:"I'm feeling under the weather.",c:'我有点不舒服',ex:"I'm a bit under the weather—working from home today.",exc:'有点不舒服——今天在家办公',n:'请病假的委婉标准句'},
  {x:"We're on the same page.",c:'我们想法一致',ex:"Quick sync to make sure we're on the same page.",exc:'快速对齐下，确保大家一个思路',n:'职场对齐第一习语'},
  {x:"Let's hit the road.",c:'咱们出发吧',ex:"Everyone ready? Let's hit the road.",exc:'都好了？出发！',n:'hit系：hit the road/the gym/the sack(睡觉)'}]},
 {t:'quiz',h:'习语解码测',qs:[
  {q:'on the fence 意思是?',opts:['还在犹豫','爬栅栏','被困住','站得高'],a:'还在犹豫'},
  {q:'同事说 under the weather 是?',opts:['不太舒服','天气不好','心情差','在楼下'],a:'不太舒服'},
  {q:'「确保我们想法一致」?',opts:["Make sure we're on the same page.","Sure we read same book.","Our pages are equal.","Same paper we are."],a:"Make sure we're on the same page."},
  {q:'call it a day 意思是?',opts:['今天到此为止','给今天起名','打电话一天','约定日期'],a:'今天到此为止'}]},
 {t:'task',h:'开口任务',p:['选3个今天的习语造真句：一件对你 piece of cake 的事/一个你 on the fence 的选择/一句 call it a day。','美剧作业：今晚任意一集，抓一个习语记下来——你的私人习语库从今天开张。']}]},

{id:'e74',day:74,week:11,weekTitle:'听力与语感',title:'幽默与讽刺入门：听懂美式玩笑',sub:'sarcasm雷达 + 自嘲的艺术',mins:14,steps:[
 {t:'intro',h:'听懂玩笑=真正融入的门票',p:['美式幽默两大件：**sarcasm**(反讽——说反话)和 **self-deprecation**(自嘲)。','反讽雷达三信号：**语调拖长**(Oh, greeeat.=糟透了)/**场景反差**(暴雨天说 Lovely weather!)/**过度夸张**(Best. Monday. Ever.)','接玩笑的万能回应：**Ha, right?**(哈，可不是)/**Tell me about it.**(可不是嘛——注意：不是让你真的讲！)'],tip:'Tell me about it 是最大陷阱：字面「跟我讲讲」，实义「我太懂了」——听到别真开讲。'},
 {t:'chunks',h:'幽默解码器',sub:'反讽信号+接梗回应',items:[
  {x:"Oh, great. Just great.",c:'（反讽）好嘛，太「好」了',ex:"Flight delayed again? Oh, great. Just great.",exc:'又延误？好嘛，真是「太好了」',n:'📍重复+拖长调=反话实锤'},
  {x:"Tell me about it.",c:'可不是嘛（我太懂了）',ex:"—Mondays are brutal. —Tell me about it.",exc:'——周一真要命 ——可不是嘛',n:'共鸣接梗，不是请求讲述！'},
  {x:"Story of my life.",c:'我的人生写照（自嘲）',ex:"Missed the bus by ten seconds—story of my life.",exc:'差十秒没赶上车——我的人生写照',n:'小倒霉的自嘲收尾'},
  {x:"Well, that went well.",c:'（反讽）嗯，进行得真「顺利」',ex:"Demo crashed twice. Well, that went well.",exc:'演示崩了两次。嗯，真「顺利」',n:'搞砸后的体面自嘲，职场安全款'},
  {x:"I'm not gonna lie, that was smooth.",c:'不吹不黑，这波挺帅',ex:"You saved that meeting—not gonna lie, that was smooth.",exc:'你救了那场会——讲真这波很漂亮',n:'smooth=漂亮利落；夸人带笑点'},
  {x:"Too soon?",c:'（玩笑后）这梗开早了？',ex:"—He just got dumped. —New profile pic time! ...Too soon?",exc:'——他刚被甩 ——该换头像了！……这梗太早？',n:'玩笑试探边界的自查句'}]},
 {t:'quiz',h:'幽默雷达测',qs:[
  {q:"同事叹气说 Mondays, huh? 你接?",opts:["Tell me about it.","Please tell me about Monday.","Monday is first day.","I like calendars."],a:"Tell me about it.",explain:'共鸣接梗——千万别真讲周一是什么'},
  {q:'暴雨天有人说 Lovely weather! 他在?',opts:['反讽吐槽天气','真心夸天气','预报天气','背课文'],a:'反讽吐槽天气'},
  {q:'Story of my life 用在?',opts:['小倒霉后的自嘲','讲自传时','介绍家人','正式演讲'],a:'小倒霉后的自嘲'}]},

{id:'e75',day:75,week:11,weekTitle:'听力与语感',title:'短信与网络用语：打字的美语',sub:'lol / ngl / tbh / omw 解码+使用',mins:13,steps:[
 {t:'intro',h:'短信美语：另一门方言',p:['美国人打字有自己的语法：**lol**(哈哈·万能软化剂)/**tbh**(讲真)/**ngl**(不骗你)/**omw**(在路上了)/**rn**(现在)/**btw**(顺便说)','用法真相：lol不是大笑，是**语气软化剂**——sure lol(行吧哈)比sure(行。)友好十倍。','短信节奏：美国人回复短、频率快、句号慎用——**句号在短信里显得生气**(K. = 你完了)。'],tip:'速记：ngl=not gonna lie，tbh=to be honest，omw=on my way，idk=I don\'t know，fr=for real(真的)。'},
 {t:'chunks',h:'短信语料包',sub:'解码+实战',items:[
  {x:"omw, be there in 10",c:'在路上了，10分钟到',ex:"omw, be there in 10 lol traffic is wild",exc:'在路上了10分钟到哈，堵疯了',n:'📍赴约短信标准格式'},
  {x:"ngl that was fun",c:'不骗你，真挺好玩',ex:"ngl that was way more fun than expected",exc:'讲真比预想好玩多了',n:'ngl开头=真心话预告'},
  {x:"tbh I'm exhausted rn",c:'讲真我现在累瘫了',ex:"tbh I'm exhausted rn, rain check?",exc:'讲真现在累瘫，改天行吗？',n:'tbh+rn 组合拳，改约短信实战'},
  {x:"sounds good, see u then",c:'行，到时见',ex:"sounds good, see u then!",exc:'好嘞到时见！',n:'u=you；短信约定收尾'},
  {x:"wait what lol",c:'等等什么鬼哈哈',ex:"wait what lol, she said that??",exc:'等等什么鬼哈哈，她真这么说？？',n:'惊讶+软化，短信版No way'},
  {x:"btw did you see my email?",c:'对了，看到我邮件了吗？',ex:"btw did you see my email? no rush",exc:'对了看到我邮件没？不急',n:'no rush=不着急，催而不逼的艺术'}]},
 {t:'quiz',h:'短信解码测',qs:[
  {q:'朋友发 omw 意思是?',opts:['在路上了','哦我的天','等一下','不来了'],a:'在路上了'},
  {q:'ngl = ?',opts:["not gonna lie(讲真)","no good luck","next great level","not going late"],a:"not gonna lie(讲真)"},

  {q:'「讲真现在累瘫了」短信版?',opts:["tbh I'm exhausted rn","to be honest I am exhaust now","truly say I tired this moment","honest talk me tired now"],a:"tbh I'm exhausted rn"}]},
 {t:'task',h:'开口任务',p:['手机备忘录里给虚拟朋友发三条短信：一条omw赴约、一条tbh+rain check改约、一条btw催邮件+no rush。','缩写只在打字用——嘴上还是说完整形，别对着客户说出「o-m-w」。']}]},

{id:'e76',day:76,week:11,weekTitle:'听力与语感',title:'影视精学法：一句台词榨干十倍',sub:'用《老友记》式场景练精听',mins:14,steps:[

 {t:'task',h:'本周输出任务',p:['终极影子练习：把今天6道听力题的原句各跟读3遍——语调、缩读、吞音全部模仿到位。','从下周起，你的耳朵进入「自动进化」模式：每天美剧3句+习语1个，坚持即复利。']}]},

{id:'e78',day:78,week:12,weekTitle:'毕业冲刺',title:'Capstone①：叙事大师课',sub:'把一个完整故事讲出电影感',mins:15,steps:[
 {t:'intro',h:'毕业冲刺周：四场Capstone',p:['最后一周=全装备验收。今天Capstone①：**叙事**——把三个月的故事工具全部用进一个3分钟长故事。','大师级叙事清单：开场钩子(So get this)+背景铺垫(At first)+转折(And then out of nowhere)+反转(Turns out)+情绪标签(which was wild)+收尾金句(Long story short)+听众互动(You know what I mean?)','今天的任务故事：**你人生中最难忘的一次旅行/面试/搬家**——真事才有电影感。'],tip:'3分钟长故事的秘密：中途至少停顿2次让「听众」反应——独角戏也要留出笑声的位置。'},
 {t:'chunks',h:'大师级叙事工具复检',sub:'全部工具最后打磨',items:[
  {x:"You're not gonna believe this.",c:'你绝对不会信',ex:"You're not gonna believe this—they upgraded us for free.",exc:'你绝不会信——他们免费给我们升舱了',n:'📍钩子的钩子，开场前的开场'},
  {x:"Picture this: ...",c:'你脑补一下：……',ex:"Picture this: midnight, pouring rain, no taxis.",exc:'脑补下：午夜，暴雨，没出租车',n:'场景速写三要素：时间+天气+困境'},
  {x:"And just when I thought it was over...",c:'就在我以为结束时……',ex:"And just when I thought it was over, my phone died.",exc:'就在我以为熬过去了，手机没电了',n:'二次反转，故事高手的标志'},
  {x:"Looking back, ...",c:'现在回头看……',ex:"Looking back, it was the best worst day ever.",exc:'回头看，那是最棒的倒霉一天',n:'故事升华句，从事件到意义'},
  {x:"You know what I mean?",c:'你懂我意思吧？',ex:"It was scary but alive, you know what I mean?",exc:'又怕又爽，你懂那感觉吧？',n:'听众互动检查点'},
  {x:"But that's a story for another day.",c:'但那就是另一个故事了',ex:"The sequel is even crazier—but that's a story for another day.",exc:'续集更离谱——但下次再讲',n:'留悬念收尾，听众永远想听你的下一个故事'}]},
 {t:'quiz',h:'叙事结构测',qs:[
  {q:'长故事的正确工具顺序?',opts:["钩子→铺垫→转折→反转→升华","升华→反转→钩子→铺垫","转折→钩子→升华→铺垫","随便讲就行"],a:"钩子→铺垫→转折→反转→升华"},
  {q:'「就在我以为结束时」?',opts:["And just when I thought it was over...","When over I thought just...","Thinking end just me...","Over was thought I when..."],a:"And just when I thought it was over..."},
  {q:'留悬念收尾?',opts:["But that's a story for another day.","The end forever.","No more talking.","Story is died."],a:"But that's a story for another day."}]},
 {t:'task',h:'Capstone任务①',p:['讲一个3分钟真实长故事并录音：必须包含钩子、Picture this、二次反转、Looking back升华、悬念收尾。','这是毕业作品一号——讲到自己都起鸡皮疙瘩为止。']}]},

{id:'e79',day:79,week:12,weekTitle:'毕业冲刺',title:'Capstone②：观点辩护战',sub:'一个立场，扛住三轮追问',mins:15,steps:[
 {t:'intro',h:'Capstone②：观点的压力测试',p:['有观点容易，**扛住追问**才是真功夫。今天模拟三轮追问战：','第一轮亮立场(The way I see it)→第二轮接质疑(That\'s fair, but here\'s the thing)→第三轮举例扛压(For example, in my experience)→终轮优雅收尾(We might have to agree to disagree)','**agree to disagree**(各自保留)——美式辩论的和平条约，激辩后友谊不裂的关键。'],tip:'被追问到答不上来的体面话术：That\'s a great question—I honestly haven\'t thought that through yet.(好问题，我确实还没想透)——诚实比诡辩高级。'},
 {t:'chunks',h:'辩护语块',sub:'三轮攻防+和平条约',items:[
  {x:"Hear me out.",c:'听我说完',ex:"Hear me out—it's less crazy than it sounds.",exc:'听我说完——没听起来那么离谱',n:'📍亮争议观点前的请求专注'},
  {x:"That's fair, but consider this:",c:'有道理，但你想想这点：',ex:"That's fair, but consider this: the data says otherwise.",exc:'有道理，但想想这个：数据不是这么说的',n:'接质疑+反击一体'},
  {x:"In my experience, ...",c:'以我的经验……',ex:"In my experience, clients rarely know what they need at first.",exc:'以我经验，客户一开始很少知道自己要什么',n:'个人经验=无法反驳的论据'},
  {x:"Playing devil's advocate, ...",c:'我唱个反调……',ex:"Playing devil's advocate—what if the trend reverses?",exc:'唱个反调——万一趋势逆转呢？',n:"devil's advocate=故意抬杠方，高级讨论标配"},
  {x:"I honestly haven't thought that through.",c:'这点我确实还没想透',ex:"Great question—I honestly haven't thought that through yet.",exc:'好问题——我确实还没想透',n:'诚实认输一小步，赢得信任一大步'},
  {x:"We might have to agree to disagree.",c:'咱们可能得各自保留了',ex:"Ha, we might have to agree to disagree on this one.",exc:'哈，这条咱们只能各自保留了',n:'辩论和平条约，笑着说'}]},
 {t:'quiz',h:'辩护战测',qs:[
  {q:'亮争议观点前说?',opts:["Hear me out.","Shut up first.","Listen or leave.","I am right period."],a:"Hear me out."},
  {q:"playing devil's advocate 是在?",opts:['故意唱反调以检验观点','崇拜恶魔','帮律师说话','放弃辩论'],a:'故意唱反调以检验观点'},
  {q:'辩论结束保持友谊的条约?',opts:["We might have to agree to disagree.","You lose I win.","Never talk again.","Change your mind now."],a:"We might have to agree to disagree."}]},
 {t:'task',h:'Capstone任务②',p:['选你的真立场（如：AI是杠杆不是威胁），自演三轮攻防并录音：亮观点→自己扮质疑者→扛住→agree to disagree收尾。','毕业作品二号——能自己反驳自己的人，观点才真正属于他。']}]},

{id:'e80',day:80,week:12,weekTitle:'毕业冲刺',title:'Capstone③：职场全流程演习',sub:'一天的职场英语：站会→客户→邮件→冲突',mins:15,steps:[
 {t:'intro',h:'Capstone③：职场的一天全模拟',p:['今天把第7周装备串成完整职场日：**晨会汇报**(on track/blocked)→**客户讲解**(Basically/Think of it as)→**追问澄清**(So what you\'re saying is)→**邮件跟进**(following up)→**小冲突化解**(I see your point, but)','新增终极武器：**Let\'s take this offline.**(咱们会后单聊)——会议里有分歧时的美式标准收束，避免全员看戏。','这是你作为Salesforce顾问的英文工作日全剧本。'],tip:'offline在职场=「会后私下」不是断网——Let\'s take this offline 一出，全场都懂：此题暂停，散会再战。'},
 {t:'chunks',h:'职场终极补充包',sub:'冲突与协作的高阶句',items:[
  {x:"Let's take this offline.",c:'咱们会后单聊',ex:"Good point—let's take this offline after standup.",exc:'有道理——站会后咱们单聊',n:'📍会议分歧的优雅暂停键'},
  {x:"I hear you, and...",c:'我听到你的顾虑了，同时……',ex:"I hear you, and I still think we should test first.",exc:'我懂你的顾虑，同时我仍建议先测试',n:'用and不用but——异议不对抗的高阶技巧'},
  {x:"Let's not reinvent the wheel.",c:'别重复造轮子',ex:"There's a template—let's not reinvent the wheel.",exc:'有现成模板——别重复造轮子',n:'效率派职场习语'},
  {x:"Can we get alignment on this?",c:'这事能拉齐共识吗？',ex:"Before Friday, can we get alignment on scope?",exc:'周五前，范围这事能拉齐吗？',n:'alignment=对齐共识，咨询行业口头禅'},
  {x:"I'll own that.",c:'这事我来负责',ex:"The delay? I'll own that—my miss.",exc:'延误的事？我来担——我的疏漏',n:'own=认领责任；美式职场最圈粉的一句'},
  {x:"Great catch.",c:'发现得好（夸人挑出问题）',ex:"Wrong date on slide 3? Great catch.",exc:'第3页日期错了？抓得好',n:'被指出错误时的正向回应，格局立现'}]},
 {t:'quiz',h:'职场全流程测',qs:[
  {q:'会上争执不下，优雅暂停?',opts:["Let's take this offline.","Stop talking everyone.","I win this meeting.","Delete this topic."],a:"Let's take this offline."},
  {q:'「这事我来负责」圈粉说法?',opts:["I'll own that.","Not my fault.","Someone else did it.","Whatever happens happens."],a:"I'll own that."},
  {q:'同事指出你PPT错误，回应?',opts:["Great catch.","How dare you.","It's fine nobody saw.","You are annoying."],a:"Great catch."},
  {q:'「别重复造轮子」?',opts:["Let's not reinvent the wheel.","Don't make circle again.","Wheel is exist already.","No new round things."],a:"Let's not reinvent the wheel."}]},
 {t:'task',h:'Capstone任务③',p:['5分钟职场日连演并录音：晨会汇报30秒→客户讲解60秒→处理一个质疑(I hear you, and)→邮件口述→冲突暂停(take this offline)→认领一责(I\'ll own that)。','毕业作品三号——你的英文职业人格正式竣工。']}]},

{id:'e81',day:81,week:12,weekTitle:'毕业冲刺',title:'Capstone④：社交马拉松',sub:'从破冰到告别的完整社交剧本',mins:15,steps:[
 {t:'intro',h:'Capstone④：一场聚会的全程社交',p:['模拟一场2小时聚会的完整社交弧线：**破冰**(How do you know...?)→**转场深聊**(You mentioned...)→**讲一个故事**(So get this)→**接住别人的故事**(No way! And then what?)→**互换联系**(hit me up)→**告别**(It was so good meeting you)','新装备·告别的艺术：**I should get going.**(我该走了)+**It was so good meeting you.**+**Let\'s actually do that.**(说好的约定要当真)','美式告别的潜规则：说走之后还会聊5分钟——「假告别」是文化仪式，别真的转身就走。'],tip:"Let's actually do that=把客套的「改天约」变成真约定——actually一词把500句空头支票变成1张真支票。"},
 {t:'chunks',h:'社交收尾语块',sub:'告别与关系延续',items:[
  {x:"I should get going.",c:'我差不多该走了',ex:"It's getting late—I should get going.",exc:'不早了——我该撤了',n:'📍礼貌离场启动键'},
  {x:"It was so good meeting you.",c:'认识你太开心了',ex:"It was so good meeting you, Kenny!",exc:'Kenny，认识你太开心了！',n:'初识告别标配，回应：Likewise!(彼此彼此)'},
  {x:"Likewise!",c:'彼此彼此！',ex:"—So good meeting you! —Likewise!",exc:'——认识你真好！——彼此彼此！',n:'一词回应，优雅省力'},
  {x:"Let's actually do that.",c:'咱们这约要当真',ex:"Ramen next week? Let's actually do that.",exc:'下周拉面？这次来真的',n:'把客套变真约的magic word'},
  {x:"I'll shoot you a text.",c:'我给你发消息',ex:"I'll shoot you a text about Saturday.",exc:'周六的事我发你消息',n:'shoot a text=发短信，轻快版承诺'},
  {x:"Get home safe!",c:'路上注意安全！',ex:"Night! Get home safe!",exc:'晚安！路上小心！',n:'告别的温暖收尾，美式人情味'}]},
 {t:'quiz',h:'社交弧线测',qs:[
  {q:'派对告别启动键?',opts:["I should get going.","I go now bye forever.","This party is over for me.","Door, where?"],a:"I should get going."},
  {q:'对方说 So good meeting you! 你回?',opts:["Likewise!","Yes I am good.","Meeting is over.","Thank you for your meeting."],a:"Likewise!"},
  {q:'把「改天约」变真约?',opts:["Let's actually do that.","Maybe whenever possible.","If destiny allows.","We will see about it."],a:"Let's actually do that."}]},
 {t:'task',h:'Capstone任务④',p:['终极社交连演8分钟并录音：破冰→转场→讲故事→接故事→约定(actually do that)→告别(get going→meeting you→Likewise→Get home safe)。','毕业作品四号——四场Capstone到此集齐。']}]},

{id:'e82',day:82,week:12,weekTitle:'毕业冲刺',title:'误解修复术：说错了怎么救',sub:'That came out wrong / What I meant was',mins:14,steps:[
 {t:'intro',h:'说错话的自救系统',p:['三个月冲刺途中你一定会说错话——高手和新手的区别不是不犯错，是**修复速度**：','**说岔了**：That came out wrong.(我不是那意思) → **What I meant was...**(我想说的是)','**没听懂装懂被拆穿**：You know what, I actually missed that—could you run it by me again?(说实话我刚没跟上，能再过一遍吗)','**词穷卡壳**：How do I put this... (怎么说呢) / What\'s the word... (那个词怎么说来着)——卡壳填充词让你**卡而不慌**。'],tip:'卡壳时用填充词而不是沉默——How do I put this 的0.8秒里，大脑已经找到出路了。填充词是口语的缓冲气囊。'},
 {t:'chunks',h:'修复语块',sub:'说错/没懂/卡壳 三救',items:[
  {x:"That came out wrong.",c:'我这话说岔了',ex:"Wait, that came out wrong. Let me rephrase.",exc:'等等，说岔了。我重新说',n:'📍rephrase=换个说法；秒道歉+秒重来'},
  {x:"What I meant was...",c:'我想表达的是……',ex:"What I meant was the timeline, not your work.",exc:'我说的是时间线问题，不是你的工作',n:'修复误解的核心句'},
  {x:"Could you run it by me again?",c:'能再给我过一遍吗？',ex:"I actually missed that—could you run it by me again?",exc:'我刚真没跟上——能再过一遍吗？',n:'run by=过一遍；承认没懂的体面版'},
  {x:"How do I put this...",c:'怎么说呢……',ex:"How do I put this... the design feels dated.",exc:'怎么说呢……这设计有点过时了',n:'争取思考时间+预告委婉批评'},
  {x:"What's the word... you know what I mean.",c:'那词怎么说来着……你懂的',ex:"It's so... what's the word... polished! That's it.",exc:'特别……那词怎么说……精致！对就是它',n:'词穷自救+找到词的小胜利'},
  {x:"Scratch that.",c:'刚那句作废',ex:"Let's meet at 2—scratch that, 3 works better.",exc:'2点见吧——作废，3点更合适',n:'秒撤回，自我修正的最快捷径'}]},
 {t:'quiz',h:'修复测验',qs:[
  {q:'话说岔了，第一时间说?',opts:["That came out wrong.","You heard wrong.","Forget English.","No comment."],a:"That came out wrong."},
  {q:'「刚那句作废」?',opts:["Scratch that.","Cut this word.","Delete my mouth.","Erase all please."],a:"Scratch that."},
  {q:'卡壳时应该?',opts:['用填充词争取时间','长时间沉默','换成中文','结束对话'],a:'用填充词争取时间'}]},
 {t:'task',h:'开口任务',p:['三救各演一遍：说错→That came out wrong+What I meant was；没懂→run it by me again；卡壳→How do I put this...','从此你在英语对话里没有「死局」——任何失误都有出口。']}]},

{id:'e83',day:83,week:12,weekTitle:'毕业冲刺',title:'终极自我介绍：90秒定制版',sub:'三个月全部武器的浓缩输出',mins:15,steps:[
 {t:'intro',h:'毕业前夜：定稿你的英文名片',p:['明天毕业考。今天定稿**90秒终极自我介绍**——它由你三个月的最强素材组成：','结构：**开场钩**(I\'m Kenny—consultant by day, language nerd by night)→**职业线**(started out→these days)→**热情线**(I\'m really into)→**观点闪光**(The way I see it)→**未来线**(The five-year plan)→**互动收尾**(But enough about me—what\'s your story?)','最后一句是灵魂：**把话筒递回去**——自我介绍的最高境界是让对方也想介绍自己。'],tip:'by day / by night 句式：consultant by day, investor by night(白天顾问，晚上投资人)——一句话立住双面人设，美式开场妙笔。'},
 {t:'chunks',h:'终极模板逐段打磨',sub:'六段式，逐段跟读替换',items:[
  {x:"Consultant by day, language nerd by night.",c:'白天是顾问，晚上是语言宅',ex:"I'm Kenny—consultant by day, language nerd by night.",exc:'我是Kenny——白天做顾问，晚上是语言发烧友',n:'📍双面人设开场钩，10秒被记住'},
  {x:"I help companies get more out of...",c:'我帮企业把……用出更大价值',ex:"I help companies get more out of their Salesforce setup.",exc:'我帮企业把Salesforce用出更大价值',n:'get more out of=榨出更多价值；一句话讲清职业'},
  {x:"Outside of work, I'm really into...",c:'工作之外我特别迷……',ex:"Outside of work, I'm really into Japanese and long-term investing.",exc:'工作之外，我在深学日语、做长期投资',n:'热情线：具体的爱好=聊天钩子'},
  {x:"The way I see it, ...",c:'依我看……',ex:"The way I see it, AI rewards the curious.",exc:'依我看，AI时代奖励好奇心强的人',n:'一句观点闪光，思想者认证'},
  {x:"The long game is...",c:'长期目标是……',ex:"The long game is working across languages and markets.",exc:'长期目标是跨语言跨市场工作',n:'未来一句话，格局收束'},
  {x:"But enough about me—what's your story?",c:'我说得够多了——你的故事呢？',ex:"But enough about me—what's your story?",exc:'我的部分到此——说说你的故事？',n:'递话筒收尾，社交满分动作'}]},
 {t:'quiz',h:'名片检验',qs:[
  {q:'双面人设开场句式?',opts:["Consultant by day, language nerd by night.","I am consultant and also night man.","Day I work, night I sleep.","Two faces I have."],a:"Consultant by day, language nerd by night."},
  {q:'「我帮企业把Salesforce用出更大价值」?',opts:["I help companies get more out of their Salesforce.","I make Salesforce big money company.","Companies use my Salesforce good.","Salesforce is helped by me to companies."],a:"I help companies get more out of their Salesforce."},
  {q:'自我介绍的满分收尾?',opts:["But enough about me—what's your story?","The end of my story forever.","I am done talking now.","Please clap."],a:"But enough about me—what's your story?"}]},
 {t:'task',h:'开口任务',p:['组装并排练终极自我介绍3遍：看稿→半脱稿→全脱稿录音。','明天毕业考。今晚早睡——三个月的最后一冲，明天见。']}]},

{id:'e84',day:84,week:12,weekTitle:'毕业冲刺',title:'三个月毕业考 · 全能力验收',sub:'叙事+观点+职场+社交+听力 终极综合',mins:15,steps:[
 {t:'intro',h:'84天。从「会英语」到「用英语生活」',p:['84天前你有存量词汇但开不了口。今天的你：**故事有骨架、观点有结构、职场有剧本、社交有弧线、耳朵有滤镜**——外加五大主场话题和四份Capstone录音。','毕业考10题覆盖全体系。考过即毕业；考不过，复习卡会精准补弱，明天重考。','考完必看毕业寄语——那里有下一阶段的路线图。'],tip:'最后一考，享受它——三个月前的你会为现在的你骄傲。'},
 {t:'quiz',h:'毕业考 · 综合10题',qs:[

function lessonCards(lesson){
  const cards=[];
  (lesson.steps||[]).forEach((st,si)=>{
    if(st.t==='kana'&&!st.review){
      st.rows.forEach((row,ri)=>row.k.filter(Boolean).forEach((k,ki)=>{
        cards.push({id:lesson.id+':'+si+':'+ri+'_'+ki,type:'kana',front:k[0],ans:k[1],hint:k[2]?'字源：'+k[2]:'',audio:{x:k[0],lang:'ja-JP'}});
      }));
    }
    if(st.t==='phrases'&&!st.noCards){
      st.items.forEach((p,pi)=>{
        cards.push({id:lesson.id+':'+si+':'+pi,type:'phr',front:p.c,ans:p.j,rd:p.r,audio:{x:p.j,lang:'ja-JP'},prompt:'用日语怎么说？'});
      });
    }
    if(st.t==='chunks'){
      st.items.forEach((p,pi)=>{
        cards.push({id:lesson.id+':'+si+':'+pi,type:'chk',front:p.c,ans:p.x,hint:p.ex?'例：'+p.ex:'',audio:{x:p.x,lang:'en-US'},prompt:'用英语怎么说？'});
      });
    }
  });
  return cards;
}
const CardIndex={};
[...JP_LESSONS,...EN_LESSONS].forEach(l=>lessonCards(l).forEach(c=>CardIndex[c.id]=c));

const App=(()=>{
  const S={view:'today',kanaTab:'hira',player:null,review:null};
  const $=id=>document.getElementById(id);
  const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  /* 回调注册表：避免把文本塞进内联属性引发转义问题 */
  let RH=[];
  const reg=f=>(RH.push(f)-1);
  function run(i,el){if(RH[i])RH[i](el);}

  /* ------- 进度 ------- */
  function done(){return DB.get('done',{});}
  function isDone(id){return !!done()[id];}
  function markDone(id){
    const d=done();if(d[id])return;
    d[id]=D.today();DB.set('done',d);
    const days=DB.get('days',{});days[D.today()]=true;DB.set('days',days);
    const l=findLesson(id);
    if(l){
      const raw=l.libIds?l.libIds.map(x=>CardIndex[x]).filter(Boolean):lessonCards(l);
      const n=SRS.addCards(raw);
      /* 测验答错的内容 → 标记优先，明天复习时最先出现（课内已即时重试过一遍） */
      const ws=S.player&&S.player.wrongSet;
      let hot=0;
      if(ws&&ws.size){
        const s=DB.get('srs',{});
        raw.forEach(c=>{const st=s[c.id];if(st&&(ws.has(String(c.ans))||ws.has(String(c.front)))){st.hot=1;hot++;}});
        if(hot)DB.set('srs',s);
      }
      if(n)toast('已加入 '+n+' 张复习卡片'+(hot?'（答错的 '+hot+' 张明天优先出现）':''));
    }
    DB.del('ck.'+id);
    checkFull();
  }
  function nextLesson(list){
    const un=list.find(l=>!isDone(l.id));
    if(un)return un;
    /* 第1月28课完成 → 无缝进入巩固循环课（词库按场景滚动生成，无限续航） */
    const lang=list===EN_LESSONS?'E':'J';
    let n=0;while(isDone('cy'+lang+':'+n))n++;
    return genCycle(lang,n);
  }
  function findLesson(id){
    if(!id)return null;
    const l=[...JP_LESSONS,...EN_LESSONS].find(x=>x.id===id);
    if(l)return l;
    const m=/^cy([EJ]):(\d+)$/.exec(id);
    return m?genCycle(m[1],+m[2]):null;
  }

  /* ------- 每日任务冻结：当天首次打开即锁定，完成一门不会把另一门顶到下一课 ------- */
  function daySession(){
    const t=D.today();
    let ds=DB.get('ds.'+t,null);
    if(!ds||!ds.jp||!ds.en||!findLesson(ds.jp)||!findLesson(ds.en)){
      const jp=nextLesson(JP_LESSONS),en=nextLesson(EN_LESSONS);
      ds={jp:jp.id,en:en.id};
      DB.set('ds.'+t,ds);
    }
    return ds;
  }
  /* 完整打卡 = 当天冻结的 日语课 + 英语课 + 必要复习（有到期卡则至少完成一组）都完成 */
  function checkFull(){
    const t=D.today();const ds=DB.get('ds.'+t,null);if(!ds)return false;
    const revOK=DB.get('rev.'+t,false)||SRS.due().length===0;
    if(isDone(ds.jp)&&isDone(ds.en)&&revOK){
      const f=DB.get('full',{});
      if(!f[t]){f[t]=true;DB.set('full',f);}
      return true;
    }
    return false;
  }

  /* ------- 巩固循环课生成器（确定性：同一编号永远同一内容） ------- */
  function genPoolQuiz(pool,lang){
    const p=shuffle(pool.slice()).slice(0,5);
    return p.map(k=>{
      const others=shuffle(pool.filter(x=>x[0]!==k[0])).slice(0,3);
      return {q:(lang==='en'?'美语怎么说：':'日语怎么说：')+k[lang==='en'?1:k.length-1],opts:shuffle([k[0],...others.map(o=>o[0])]),a:k[0],ja:lang!=='en'};
    });
  }
  function genCycle(lang,n){
    const base=(lang==='E'?EN_LESSONS:JP_LESSONS);
    const lastDay=base.length?base[base.length-1].day:28;
    const day=lastDay+1+n, week=Math.floor((day-1)/7)+1;
    if(lang==='E'){
      const C=EN_LIB.chunks,SC=EN_LIB.scenesE,DM=EN_LIB.domain,P=EN_LIB.patterns;
      const ci=n%C.length,si=n%SC.length,di=n%DM.length;
      const cg=C[ci],sg=SC[si],dg=DM[di];
      const pIdx=[0,1,2,3,4].map(i=>(n*5+i)%P.length);
      const cN=Math.min(8,cg.items.length),sN=Math.min(6,sg.items.length),dN=Math.min(5,dg.items.length);
      const libIds=[
        ...Array.from({length:cN},(_,ii)=>'L:e:c:'+ci+':'+ii),
        ...Array.from({length:sN},(_,ii)=>'L:e:sc:'+si+':'+ii),
        ...Array.from({length:dN},(_,ii)=>'L:e:d:'+di+':'+ii),
        ...pIdx.map(i=>'L:e:p:'+i)
      ];
      return {id:'cyE:'+n,day,week,cycle:true,libIds,
        title:'巩固循环 · '+cg.g,
        sub:'语块「'+cg.g+'」+ 场景「'+sg.g.replace(/^[^ ]+ /,'')+'」+ 你的领域台词',
        mins:15,
        steps:[
          {t:'intro',h:'巩固循环 · 第'+(n+1)+'节',p:['12周84节手写课全部完成后，每天的课改由<b>你的词库</b>按场景滚动生成：一组语块 + 一组场景整句 + 你的领域台词 + 5个句型。','今天的主题圈：<b>'+cg.g+'</b> ×「'+sg.g+'」。','老朋友会反复出现——这正是复利的形状。'],tip:'想要全新手写的第2月课程？随时找 Claude 定制添加。'},
          {t:'chunks',h:'语块巩固 · '+cg.g,sub:'整块听、整块跟读。眼熟的就挑战不看字跟上。',items:cg.items.slice(0,cN).map(it=>({x:it[0],c:it[1],n:it[2]?'📍 '+it[2]:''}))},
          {t:'chunks',h:'场景整句 · '+sg.g,sub:'场景里的整句台词——模仿语调起伏，不只是读音。',items:sg.items.slice(0,sN).map(it=>({x:it[0],c:it[1],n:it[2]?'💬 '+it[2]:''}))},
          {t:'chunks',h:'你的领域台词 · '+dg.g,sub:'第一人称、你的立场。像在真实对话里一样大声说。',items:dg.items.slice(0,dN).map(it=>({x:it[0],c:it[1],n:it[2]?'📍 '+it[2]:''}))},
          {t:'chunks',h:'句型温习',sub:'5个句型——每个换成你自己的内容再说一遍。',items:pIdx.map(i=>({x:P[i][2],c:P[i][3],n:'句型：**'+P[i][0]+'**'}))},
          {t:'task',h:'开口任务',p:['用今天的语块，围绕「'+cg.g+'」大声说 **3 句你自己的话**。','再从领域台词里挑 1 句最像你立场的，说 2 遍。']},
          {t:'quiz',h:'快测',sub:'从今天内容里抽查——答错的会课内重试，明天优先复习。',qs:genPoolQuiz([...cg.items.slice(0,cN),...sg.items.slice(0,sN)],'en')}
        ]};
    }
    const W=JP_LIB.words,SN=JP_LIB.scenes,P=JP_LIB.patterns;
    const wi=n%W.length,si=n%SN.length;
    const wg=W[wi],sg=SN[si];
    const pIdx=[0,1,2].map(i=>(n*3+i)%P.length);
    const wN=Math.min(8,wg.w.length),sN=Math.min(6,sg.items.length);
    const libIds=[
      ...Array.from({length:wN},(_,ii)=>'L:j:w:'+wi+':'+ii),
      ...Array.from({length:sN},(_,ii)=>'L:j:s:'+si+':'+ii),
      ...pIdx.map(i=>'L:j:p:'+i)
    ];
    return {id:'cyJ:'+n,day,week,cycle:true,libIds,
      title:'巩固循环 · '+wg.t,
      sub:'词汇「'+wg.t+'」+ 场景「'+sg.g.replace(/^[^ ]+ /,'')+'」+ 3个句型',
      mins:12,
      steps:[

  /* ------- 今日连续流（按当天冻结的任务走，跳过已完成部分） ------- */
  function startFlow(){

    S.flow=q;flowNext();

    if(!S.flow||!S.flow.length){S.flow=null;showDone();return;}

      list.forEach(l=>{

        html+=`<div class="lessonitem ${cls}" onclick="App.openLesson('${l.id}')" role="button" tabindex="0">

          <div style="flex:1;min-width:0"><div class="t">${esc(l.title)}</div><div class="s">${ck?'⏸ 学到第'+(ck.step+1)+'步 · 点击继续':esc(l.sub||'')}</div></div>

      });

      if(list.some(l=>!isDone(l.id)))return '';

      const next=genCycle(lang,n);
      return `<div class="weekhead">巩固循环 · 12周课程后由词库滚动生成，无限续航</div>
      <div class="lessonitem ${cls}" onclick="App.openLesson('${next.id}')" role="button" tabindex="0">

    const P=S.player;if(!P)return;
    Speech.stop();RH=[];
    const l=P.lesson,steps=l.steps,st=steps[P.step];
    const pct=Math.round((P.step+1)/steps.length*100);

      <div class="phead">

  /* 整段播放：多声源——不同角色用不同声音/音高，接近真实多人对话 */
  function playDialog(st,lang,slow){
    const smooth=!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
    const lines=st.lines||st; // 兼容旧调用（纯文本数组）
    const texts=lines.map(l=>typeof l==='string'?l:l.x);
    let items;
    if(typeof lines[0]==='object'&&DB.get('mvoice',true)){
      const pool=Speech.altVoices(lang.slice(0,2),4);
      const speakers=[...new Set(lines.map(l=>l.sp))];
      const vmap={},pmap={};
      speakers.forEach((sp,si)=>{
        if(sp==='你'){vmap[sp]=null;pmap[sp]=1;} // 你的台词用默认声音
        else{
          vmap[sp]=pool.length>1?pool[(si+1)%pool.length]:null;
          pmap[sp]=1+((si%3)-1)*0.08; // 同声音时靠音高区分说话人
        }
      });
      items=lines.map(l=>({x:l.x,lang,slow,voice:vmap[l.sp],pitch:pmap[l.sp]}));
    }else{
      items=texts.map(x=>({x,lang,slow}));
    }
    Speech.playSeq(items,i=>{
      clearPlaying();
      if(i>=0){const el=$('dl'+i);if(el){el.classList.add('playing');el.scrollIntoView({block:'center',behavior:smooth?'smooth':'auto'});}}
    });
  }
  function tapKana(el,ch){el.classList.add('played');say(ch,'ja-JP');}

  /* ------- 测验 ------- */
  function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
  function initQuiz(){
    const P=S.player,st=P.lesson.steps[P.step];
    if(!P.quiz[P.step]){
      let qs=st.qs?st.qs.slice():[];
      if(st.gen==='kana')qs=genKanaQuiz(st.pool,st.n||6);
      P.quiz[P.step]={qs,i:0,right:0};
    }
    renderQuiz();
  }
  function genKanaQuiz(pool,n){
    // pool: [[kana,romaji],...]
    const qs=[];const p=shuffle(pool).slice(0,n);
    p.forEach(k=>{
      const mode=Math.floor(Math.random()*3); // 0 kana→romaji 1 romaji→kana 2 audio→kana
      const others=shuffle(pool.filter(x=>x[1]!==k[1])).slice(0,3);
      if(mode===0)qs.push({q:'这个假名怎么读？',big:k[0],opts:shuffle([k[1],...others.map(o=>o[1])]),a:k[1]});
      else if(mode===1)qs.push({q:'「'+k[1]+'」是哪个假名？',opts:shuffle([k[0],...others.map(o=>o[0])]),a:k[0],ja:true});
      else qs.push({q:'听音选假名 👇 先点喇叭',audio:{x:k[0],lang:'ja-JP'},opts:shuffle([k[0],...others.map(o=>o[0])]),a:k[0],ja:true});
    });
    return qs;
  }
  function renderQuiz(){
    const P=S.player,Q=P.quiz[P.step];const box=$('quizbox');if(!box)return;
    if(Q.i>=Q.qs.length){
      box.innerHTML=`<div class="quizq" style="text-align:center"><div style="font-size:40px">${Q.right===Q.qs.length?'🏆':Q.right>=Q.qs.length*0.7?'👏':'💪'}</div>
      <h2 style="margin:8px 0 4px">${Q.right} / ${Q.qs.length}</h2>
      <div class="muted">${Q.right===Q.qs.length?'全对！太漂亮了':Q.right>=Q.qs.length*0.7?'不错！答错的刚才已重出一遍，明天复习时会优先出现':'没关系——答错的已重出一遍，明天复习时优先出现——反复见面就是记忆'}</div></div>`;
      const nb=$('nextbtn');if(nb)nb.disabled=false;
      return;
    }
    const q=Q.qs[Q.i];
    box.innerHTML=`<div class="quizq fade">
      <div class="muted" style="margin-bottom:4px">第 ${Q.i+1} / ${Q.qs.length} 题</div>
      <div class="qt">${esc(q.q)}</div>
      ${q.big?'<div class="qbig">'+esc(q.big)+'</div>':''}
      ${q.audio?'<button class="abtn" style="margin:8px 0" onclick="App.run('+reg(()=>say(q.audio.x,q.audio.lang))+')">🔊 播放读音</button>':''}
      <div class="opts ${q.opts.some(o=>String(o).length>14)?'one':''}">
        ${q.opts.map((o,oi)=>`<button class="opt ${q.ja?'ja':''}" data-oi="${oi}" onclick="App.answer(${oi})">${esc(String(o))}</button>`).join('')}
      </div>
    </div>`;
    if(q.audio)setTimeout(()=>say(q.audio.x,q.audio.lang),350);
  }
  function answer(oi){
    const P=S.player,Q=P.quiz[P.step];const q=Q.qs[Q.i];
    if(Q.answered)return;Q.answered=true;
    const correct=q.opts[oi]===q.a;
    document.querySelectorAll('.opt').forEach(b=>{
      const bi=+b.dataset.oi;
      if(q.opts[bi]===q.a)b.classList.add('correct');
      else if(bi===oi&&!correct)b.classList.add('wrong');
      b.style.pointerEvents='none';
    });
    if(correct)Q.right++;
    else{
      /* 错题闭环：本轮末尾再来一次 + 记入答错集（完课后当天进复习） */
      (P.wrongSet=P.wrongSet||new Set()).add(String(q.a));
      if(!q._r){const rq=Object.assign({},q);rq._r=1;Q.qs.push(rq);toast(q.explain||'这题稍后会再来一次');}
      else if(q.explain)toast(q.explain);
    }
    if(correct&&q.explain)toast(q.explain);
    setTimeout(()=>{Q.i++;Q.answered=false;renderQuiz();},correct?750:1700);
  }

  function reveal(){S.review.show=true;renderReview();}
  function grade(g){
    const R=S.review;const it=R.cards[R.i];
    const s=DB.get('srs',{});
    R.hist=R.hist||[];R.hist.push({id:it.id,before:s[it.id]?{...s[it.id]}:null,requeued:g===0});
    SRS.grade(it.id,g);

  function undoReview(){

  let __DLIB={};
  function dojoLib(mode){
    if(__DLIB[mode])return __DLIB[mode];

    if(mode==='libEN'){
      EN_LIB.top.forEach(it=>push(it[0],it[1],1,'频率总榜'));
      EN_LIB.words0.forEach(g=>g.w.forEach(w=>push(w[0],w[1],1,'基础词汇')));

      EN_LIB.chunks.forEach(g=>g.items.forEach(it=>push(it[0],it[1],2,'口语语块')));
      EN_LIB.patterns.forEach(pp=>push(pp[2],pp[3],2,'高频句型'));
      EN_LIB.domain.forEach(g=>g.items.forEach(it=>push(it[0],it[1],3,'领域观点')));
      EN_LIB.slang.forEach(g=>g.items.forEach(it=>push(it[0],it[1],3,'俚语影视')));
    }else{
      JP_LIB.top.forEach(it=>push(it[0],it[1],1,'频率总榜'));
      JP_LIB.words.forEach(g=>g.w.forEach(w=>push(w[0],w[1],1,'N5词汇')));
      JP_LIB.scenes.forEach(g=>g.items.forEach(it=>push(it[0],it[2],1,'场景整句')));
      JP_LIB.patterns.forEach(pp=>push(pp[2],pp[4],1,'N5句型'));
      JP_LIB.wordsN4.forEach(g=>g.w.forEach(w=>push(w[0],w[1],2,'N4词汇')));
      JP_LIB.patternsN4.forEach(pp=>push(pp[2],pp[4],2,'N4句型'));
      JP_LIB.wordsN3.forEach(g=>g.w.forEach(w=>push(w[0],w[1],3,'N3词汇')));
      JP_LIB.patternsN3.forEach(pp=>push(pp[2],pp[4],3,'N3句型'));
      JP_LIB.slang.forEach(g=>g.items.forEach(it=>push(it[0],it[1],3,'俚语口语')));

  function libCnt(mode){const c={1:0,2:0,3:0};dojoLib(mode).forEach(r=>{c[r.lv]++;});return c;}

  function accPick(){
    const acc=Speech.accentVoices();
    if(acc.length>1)return acc[Math.floor(Math.random()*acc.length)];

  function startDojo(mode,lv,cat){
    lv=lv||0;cat=cat||'all';
    let qs=[];
    if(mode==='libEN'||mode==='libJP'){
      const en=mode==='libEN';
      const all=dojoLib(mode);
      const bank=all.filter(r=>(!lv||r.lv===lv)&&(cat==='all'||r.cat===cat));
      const rates=en?{1:0.95,2:1.03,3:1.1}:{1:0.92,2:1.0,3:1.08};
      qs=shuffle(bank).slice(0,8).map(r=>{
        let pool=all.filter(x=>x.cat===r.cat&&x.cn!==r.cn);
        if(pool.length<3)pool=all.filter(x=>x.lv===r.lv&&x.cn!==r.cn);
        const others=shuffle(pool).slice(0,3).map(o=>o.cn);
        const acc=en?accPick():null;
        return {x:r.x,lang:en?'en-US':'ja-JP',voice:acc&&acc.voice,accLabel:acc?acc.label:null,rateAbs:rates[r.lv],lv:r.lv,cat:r.cat,q:'意思是?',opts:shuffle([r.cn,...others]),a:r.cn};
      });
    }else if(mode==='flowEN'||mode==='flowJP'){
      const bank=dojoBank(mode).filter(r=>(!lv||r[4]===lv)&&(cat==='all'||r[5]===cat));
      const rates=mode==='flowEN'?{1:0.95,2:1.05,3:1.15}:{1:0.9,2:1.0,3:1.08};
      qs=shuffle(bank).slice(0,8).map(r=>{
        const acc=mode==='flowEN'?accPick():null;
        return {x:r[0],lang:mode==='flowEN'?'en-US':'ja-JP',voice:acc&&acc.voice,accLabel:acc?acc.label:null,rateAbs:rates[r[4]],lv:r[4],cat:r[5],q:r[1],opts:shuffle(r[2].slice()),a:r[3]};
      });
    }else if(mode==='keigo'){
      const bank=DOJO_KEIGO.filter(r=>(!lv||r[4]===lv)&&(cat==='all'||r[5]===cat));
      const base={1:1.0,2:1.12,3:1.22};
      qs=shuffle(bank).slice(0,8).map((r,i)=>({x:r[0],lang:'ja-JP',rateAbs:Math.min(1.4,base[r[4]]+i*0.02),lv:r[4],cat:r[5],q:r[1],opts:shuffle(r[2].slice()),a:r[3]}));
    }else{
      const bank=dojoBank(mode).filter(sc=>(!lv||sc.lv===lv)&&(cat==='all'||sc.cat===cat));
      const scs=shuffle(bank).slice(0,6);
      qs=scs.map(sc=>{

        return {branch:true,sc,bi,lv:sc.lv,cat:sc.cat,lang:mode==='brEN'?'en-US':'ja-JP'};

    if(!qs.length){toast('该组合暂无内容，换个等级或场景试试');return;}
    S.drill={mode,qs,i:0,right:0,total:0,stage:0,answered:false,lvSel:lv,catSel:cat};

  }

  function shuffleOpts(cur,stage){
    const b=cur.sc.br[cur.bi];const idx=stage===1?1:2;
    if(!cur['_opts'+stage]){
      const others=cur.sc.br.filter((_,i)=>i!==cur.bi).map(x=>x[idx]);
      cur['_opts'+stage]=shuffle([b[idx],...shuffle(others).slice(0,3)]);
    }
    return cur['_opts'+stage];
  }
  function markOpts(correctText,chosenEl,chosen){
    document.querySelectorAll('.opt').forEach(bt=>{
      if(bt.textContent===correctText)bt.classList.add('correct');
      else if(bt===chosenEl)bt.classList.add('wrong');
      bt.style.pointerEvents='none';
    });
  }
  function drillAnswer(o,el){
    const R=S.drill;if(!R||R.answered)return;R.answered=true;
    const cur=R.qs[R.i];
    const ok=o===cur.a;
    if(ok)R.right++;R.total++;
    markOpts(cur.a,el);
    const info=$('drillinfo');
    if(info)info.innerHTML=`<div class="nt" style="margin-top:12px">📝 原文：${esc(cur.x)}${cur.accLabel?'<br>🎙 刚才的口音：<b>'+esc(cur.accLabel)+'</b>':''}</div>
      <button class="btn primary" style="margin-top:12px" onclick="App.run(${reg(()=>{R.i++;R.answered=false;drawDrill();})})">${R.i+1>=R.qs.length?'看结果':'下一题 →'}</button>`;
  }
  function brAnswer(o,el,stage){
    const R=S.drill;if(!R||R.answered)return;R.answered=true;
    const cur=R.qs[R.i];const b=cur.sc.br[cur.bi];
    const correct=stage===1?b[1]:b[2];
    const ok=o===correct;
    if(ok)R.right++;R.total++;
    markOpts(correct,el);
    const info=$('drillinfo');
    if(stage===1){
      if(info)info.innerHTML=`<div class="nt" style="margin-top:12px">📝 对方原话：${esc(b[0])}${cur._accLabel?'<br>🎙 口音：<b>'+esc(cur._accLabel)+'</b>':''}</div>
        <button class="btn primary" style="margin-top:12px" onclick="App.run(${reg(()=>{R.stage=1;R.answered=false;drawDrill(true);})})">第二步：怎么接 →</button>`;
    }else{
      if(info)info.innerHTML=`<div class="nt" style="margin-top:12px">✅ 地道接法：${esc(b[2])}</div>
        <button class="abtn ${cur.lang.startsWith('en')?'en':''}" style="margin-top:8px" onclick="App.run(${reg(()=>Speech.speak(b[2],cur.lang))})">🔊 听一遍你的应对，跟读</button>

    }
  }

    <div class="card">
      <h2>数据备份</h2>
      ${DB.corrupted?'<div class="notice" style="margin-bottom:10px">⚠️ 检测到上次的存档损坏，已自动备份原始内容（rjyl.recovery.*）。当前是全新进度；把备份发给 Claude 可尝试修复。</div>':''}
      <p class="muted" style="margin-bottom:10px">${DB.persistent?'进度已自动保存在本机浏览器中。':'⚠️ 当前环境无法长期保存进度，请常用「导出」备份。'}换手机或清理浏览器前，先导出保存。</p>
      <div class="row">
        <button class="btn ghost" style="flex:1" onclick="App.exportData()">导出进度</button>
        <button class="btn ghost" style="flex:1" onclick="App.importData()">导入进度</button>
      </div>
      <div id="databox"></div>
      <button class="btn ghost" style="margin-top:10px;color:var(--bad);border-color:var(--bad-soft)" onclick="App.resetAll()">清空全部数据</button>
    </div>
    <div class="card">
      <h2>关于本计划</h2>
      <p class="muted">🎯 目标：地道美语与日语的自由交流<br>📐 方法：间隔重复 · 语块教学 · 影子跟读 · 情景任务（每个表达标注场景出处）<br>🗓 节奏：每天40分钟=英语25（复习5+输入10+输出10）+日语15（复习5+新句型5+开口5）·周期3-5年<br>🔁 12周84节手写课（每语言）完成后，自动进入「巩固循环课」——由你的词库按场景滚动生成，无限续航；想要新的手写课或觉得哪里太难/太易，随时反馈给 Claude。<br><br>版本 v${APPV}（数据结构 v${DB.SCHEMA}）· 详细路线图见《学习计划》文档。</p>
    </div>`;
  }
  function setVoice(lang,uri){DB.set('voice.'+lang,String(uri).slice(0,300));toast('已切换声音');}
  function setRate(v){const n=Math.min(1.2,Math.max(0.6,+v||0.95));DB.set('rate',n);const e=$('ratev');if(e)e.textContent=n;}
  /* ------- 版本化导出 / 严格校验导入 ------- */
  function checksum(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return h.toString(36);}
  function exportData(){
    const data=DB.all();
    const body=JSON.stringify(data);
    const env={app:'rjyl',appVersion:APPV,schemaVersion:DB.SCHEMA,exportedAt:new Date().toISOString(),sum:checksum(body),data};
    const box=$('databox');
    box.innerHTML='<p class="muted" style="margin:10px 0 4px">全选复制下面内容，存到备忘录：</p><textarea readonly onclick="this.select()" aria-label="导出的进度数据">'+esc(JSON.stringify(env))+'</textarea>';
  }
  function importData(){
    const box=$('databox');
    box.innerHTML='<p class="muted" style="margin:10px 0 4px">粘贴之前导出的内容，然后点确认（校验失败不会动现有进度）：</p><textarea id="imp" aria-label="粘贴导入数据"></textarea><button class="btn primary" style="margin-top:8px" onclick="App.doImport()">确认导入</button>';
  }
  function validateData(v){
    if(!v||typeof v!=='object'||Array.isArray(v))return{ok:false,why:'结构不是对象'};
    const out={};
    const isDate=x=>typeof x==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x);
    const boolMap=(o)=>{const r={};if(o&&typeof o==='object')for(const k in o){if(typeof k!=='string'||k.length>90||!o[k])continue;r[k]=isDate(o[k])?o[k]:true;}return r;};
    for(const k in v){
      const val=v[k];
      if(k==='schemaVersion'){out[k]=+val||1;}
      else if(k==='onboarded'||k==='a2hs.done'){out[k]=!!val;}
      else if(k==='startDate'){if(isDate(val))out[k]=val;}
      else if(k==='rate'){const n=+val;if(isFinite(n))out[k]=Math.min(1.2,Math.max(0.6,n));}
      else if(k==='revCap'){out[k]=[20,40,60,100,999].includes(+val)?+val:40;}
      else if(k==='newCap'){out[k]=[5,10,15,20,999].includes(+val)?+val:10;}
      else if(k==='romaji'){out[k]=['auto','on','off'].includes(val)?val:'auto';}
      else if(k==='mvoice'){out[k]=!!val;}
      else if(k==='dojo'){const r={};if(val&&typeof val==='object')for(const dd in val){if(isDate(dd)&&val[dd]&&typeof val[dd]==='object'){r[dd]={n:Math.max(0,Math.min(999,Math.floor(+val[dd].n||0))),r:Math.max(0,Math.min(99999,Math.floor(+val[dd].r||0))),t:Math.max(0,Math.min(99999,Math.floor(+val[dd].t||0)))};}}out[k]=r;}
      else if(k==='lessonTab'){continue;}
      else if(k==='done'||k==='days'||k==='full'){out[k]=boolMap(val);}
      else if(k==='out'){const r={};if(val&&typeof val==='object')for(const d in val){if(isDate(d)&&val[d]&&typeof val[d]==='object'){const n=Math.max(0,Math.min(999,+val[d].n||0));if(n)r[d]={n,g:[1,2,3].includes(+val[d].g)?+val[d].g:0};}}out[k]=r;}
      else if(k==='srs'){
        const r={};if(val&&typeof val==='object')for(const id in val){
          const st=val[id];if(typeof id!=='string'||id.length>90||!st||typeof st!=='object')continue;
          const e={lv:Math.max(0,Math.min(7,Math.floor(+st.lv||0))),due:isDate(st.due)?st.due:D.today(),lapses:Math.max(0,Math.min(999,Math.floor(+st.lapses||0)))};
          if(st.lrn!==undefined&&st.lrn!==null)e.lrn=Math.max(0,Math.min(2,Math.floor(+st.lrn||0)));
          if(st.rep!==undefined)e.rep=Math.max(0,Math.min(99999,Math.floor(+st.rep||0)));
          if(st.hot)e.hot=1;
          r[id]=e;
        }
        out[k]=r;
      }
      else if(/^voice\./.test(k)&&typeof val==='string'){out[k]=val.slice(0,300);}
      else if(/^picks\./.test(k)){out[k]=typeof val==='number'?Math.max(0,Math.min(99,val)):!!val;}
      else if(/^rev\./.test(k)){out[k]=!!val;}
      else if(/^intro\./.test(k)){out[k]=Math.max(0,Math.min(999,+val||0));}
      else if(/^ds\./.test(k)&&val&&typeof val==='object'){const jp=typeof val.jp==='string'&&val.jp.length<40?val.jp:null;const en=typeof val.en==='string'&&val.en.length<40?val.en:null;if(jp&&en)out[k]={jp,en};}
      else if(/^ck\./.test(k)&&val&&typeof val==='object'){const s=Math.floor(+val.step||0);if(s>0&&s<60)out[k]={step:s};}
      /* 其余未知键一律丢弃 */
    }
    return{ok:true,data:out};
  }
  function doImport(){
    const el=$('imp');const raw=((el&&el.value)||'').trim();
    if(!raw){toast('请先粘贴导出的内容');return;}
    if(raw.length>3000000){toast('内容过大，不像本App导出的数据（未修改现有进度）');return;}
    let v;
    try{v=JSON.parse(raw);}catch(e){toast('不是有效的数据格式（未修改现有进度）');return;}
    if(v&&typeof v==='object'&&v.app==='rjyl'&&v.data){
      if(v.sum&&checksum(JSON.stringify(v.data))!==v.sum){toast('数据校验和不符——内容可能被截断，请重新完整复制（未修改现有进度）');return;}
      v=v.data;
    }
    const r=validateData(v);
    if(!r.ok){toast('数据校验失败：'+r.why+'（未修改现有进度）');return;}
    if(!Object.keys(r.data).length||!(r.data.done||r.data.srs||r.data.days)){toast('内容里没有可识别的学习进度（未修改现有进度）');return;}
    DB.replace(r.data);
    toast('导入成功 ✓');render();
  }
  function resetAll(){
    if(confirm('确定清空全部学习进度吗？此操作不可恢复。')){DB.replace({});location.reload();}
  }

  /* ------- 启动 ------- */
  function init(){
    render();
    /* 键盘可达性：role=button 的元素支持 Enter/空格触发 */
    document.addEventListener('keydown',e=>{
      if((e.key==='Enter'||e.key===' ')&&e.target&&e.target.getAttribute&&e.target.getAttribute('role')==='button'){e.preventDefault();e.target.click();}
    });
  }
  return{init,go,render,toast,say,clearPlaying,testAudio,finishOnboard,run,
    startFlow,openLesson,closePlayer,prevStep,nextStep,lessonTab,answer,
    libLang,libOpen,libBack,addLib,libSearch,setLibTier,undoReview,dismissA2hs,recordOut,
    setRevCap:v=>{DB.set('revCap',+v);toast('已设置复习上限');},
    setNewCap:v=>{DB.set('newCap',+v);toast('已设置每日新卡上限');render();},
    setRomaji:v=>{DB.set('romaji',['auto','on','off'].includes(v)?v:'auto');toast('已设置罗马音显示');},
    setMvoice:v=>{DB.set('mvoice',v==='1');toast(v==='1'?'对话将分角色朗读':'已关闭多声源');},
    startReview,reveal,grade,exitReview,
    kanaTabSet,kanaInfo,
    setVoice,setRate,exportData,importData,doImport,resetAll};
})();
/* 仅在网站环境启用离线安装；iPhone 本地文件预览不会误报错误。 */
if('serviceWorker' in navigator && location.protocol!=='file:'){
  window.addEventListener('load',()=>{
    const hadController=!!navigator.serviceWorker.controller;
    let refreshing=false;
    navigator.serviceWorker.register('./sw.js',{scope:'./'}).then(reg=>{
      reg.update().catch(()=>{});
      navigator.serviceWorker.addEventListener('controllerchange',()=>{
        if(!hadController||refreshing)return;
        refreshing=true;
        location.reload();
      });
    }).catch(err=>console.warn('PWA 离线服务未启用：',err));
  });
}
window.addEventListener('DOMContentLoaded',App.init);
</script>
</body>
</html>
