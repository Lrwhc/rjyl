  {sp:'同事',x:"Morning! How was your weekend?",c:'早！周末怎么样？'},
  {sp:'你',x:"Pretty good! I checked out that new sushi place on 5th. How about yours?",c:'挺好的！去探了第五街那家新寿司店。你呢？',n:'评价+小事+反问，铁三角'},
  {sp:'同事',x:"Nice! Mine flew by. I ended up working on my side project the whole time.",c:'不错！我的周末一晃就没了，结果全耗在副业项目上了'},
  {sp:'你',x:"Oh nice, how's that going?",c:'哦不错啊，那个进展如何？',n:"how's that going 万能跟进句，显示你在听"}]},
 {t:'quiz',h:'周一模拟测',qs:[
  {q:'同事问 How was your weekend? 最好的回答是?',opts:["Pretty good! I checked out a new cafe. How about yours?","It was fine.","No.","I don't know."],a:"Pretty good! I checked out a new cafe. How about yours?",explain:'具体小事+反问=社交握手完成'},
  {q:'「结果我刷了一整季剧」用哪个语块?',opts:["I ended up binge-watching a season.","I checked out a season.","I ran some errands.","It flew by."],a:"I ended up binge-watching a season."},
  {q:'run errands 意思是?',opts:['办杂事跑腿','跑步锻炼','犯错误','赶时间'],a:'办杂事跑腿'}]},
 {t:'task',h:'开口任务',p:['用铁三角结构说你上周末的真事：评价 + I checked out / I ended up... + 一句感叹 It flew by。','说2遍，第2遍不看提示——下周一真的用上它。']}]},

{id:'e30',day:30,week:5,weekTitle:'讲故事的一周',title:'讲故事的骨架：时间连接词',sub:'So / And then / At first / Turns out',mins:15,steps:[
 {t:'intro',h:'为什么你的英语「像点读机」',p:['单句都对，连起来却生硬——缺的是**故事连接词**。美国人讲事情的骨架就四根：','**So...**(于是/所以，开场万能) → **At first...**(一开始) → **And then...**(然后) → **Turns out...**(结果发现)','套上这副骨架，任何小事都能讲成有起伏的故事——这是美式闲聊的核心能力。'],tip:'So 在美语里常常只是开始讲话的信号，不表示因果——别翻译成「所以」。'},
 {t:'chunks',h:'故事骨架语块',sub:'注意每块在故事里的位置',items:[
  {x:"So get this—",c:'你听我说（有事要讲）',ex:"So get this—my flight got canceled twice.",exc:'你听我说——我航班被取消了两次',n:'📍美剧讲八卦标准开场，瞬间抓住听众'},
  {x:"At first I thought...",c:'一开始我还以为……',ex:"At first I thought it was a scam.",exc:'一开始我还以为是诈骗',n:'铺垫误会，为反转蓄力'},
  {x:"And then out of nowhere...",c:'然后毫无征兆地……',ex:"And then out of nowhere it started pouring.",exc:'然后突然就开始下暴雨',n:'out of nowhere=突然冒出来，画面感拉满'},
  {x:"Turns out...",c:'结果发现……（反转揭晓）',ex:"Turns out the place was closed for renovation.",exc:'结果发现那地方装修停业了',n:'It turns out 的口语省略，故事高潮担当'},
  {x:"Long story short...",c:'长话短说……',ex:"Long story short, we never made it to the concert.",exc:'长话短说，我们最终没赶上演唱会',n:'跳过细节直达结局，节奏控制神器'},
  {x:"...which was wild.",c:'……特别离谱/夸张',ex:"He showed up two hours late, which was wild.",exc:'他迟到了俩小时，太离谱了',n:'which was+形容词=给故事贴情绪标签'}]},
 {t:'quiz',h:'骨架检验',qs:[
  {q:'讲八卦的抓耳开场是?',opts:["So get this—","Long story short—","Turns out—","Which was wild—"],a:"So get this—"},
  {q:'「结果发现店关门了」?',opts:["Turns out the place was closed.","At first the place was closed.","And then closed the place.","So the place get this."],a:"Turns out the place was closed."},
  {q:'想跳过细节说结局用?',opts:["Long story short...","At first...","Out of nowhere...","So get this..."],a:"Long story short..."}]},
 {t:'task',h:'开口任务',p:['把你最近一件小倒霉事套进骨架讲一遍：So get this → At first → And then → Turns out → Long story short。','讲给空气听也要有表情——故事是用情绪讲的，不是用语法。']}]},

{id:'e31',day:31,week:5,weekTitle:'讲故事的一周',title:'接话的艺术：反应语',sub:'No way! / That sucks / Nice! 当个好听众',mins:14,steps:[
 {t:'intro',h:'会接话的人，才有人愿意聊',p:['美国人对话像打乒乓球——对方讲事，你得**有来有回地反应**，不然对话冷场。','三类反应语按情绪分装：**惊讶**(No way! / You\'re kidding!)、**共情坏事**(That sucks / Oh no)、**捧场好事**(Nice! / That\'s awesome)。','进阶动作：反应之后**追一个问题**——Wait, what happened next?'],tip:'千万别对坏消息说 Nice——听清情绪再出牌，反应语的方向比词更重要。'},
 {t:'chunks',h:'反应语弹药库',sub:'按情绪分类装弹',items:[
  {x:"No way!",c:'不会吧！（惊讶）',ex:"No way! She actually said that?",exc:'不会吧！她真那么说了？',n:'📍全美最高频惊讶反应，语调要真惊讶'},
  {x:"You're kidding.",c:'你开玩笑的吧',ex:"You're kidding. Two hours in line?",exc:'开玩笑吧，排了俩小时队？',n:'惊讶+不敢信，配挑眉'},
  {x:"That sucks.",c:'太糟了/真倒霉（共情）',ex:"Ugh, that sucks. Hope it works out.",exc:'唉真糟心，希望能顺利解决',n:'朋友吐槽时的标准共情，日常非正式'},
  {x:"That's awesome!",c:'太棒了！（捧场）',ex:"You got the offer? That's awesome!",exc:'你拿到offer了？太棒了！',n:'好消息标配，比 good 热情十倍'},
  {x:"Wait, seriously?",c:'等等，真的假的？',ex:"Wait, seriously? They canceled the whole event?",exc:'等等真的假的？整个活动都取消了？',n:'wait 表示信息量太大要暂停，超地道'},
  {x:"And then what?",c:'然后呢？（追问）',ex:"No way. And then what did you do?",exc:'不会吧，那你后来怎么办？',n:'反应+追问=最佳听众认证'}]},
 {t:'dialog',h:'接话实战',sub:'朋友讲遭遇，你负责所有反应',lang:'en-US',mode:'role',you:'你',lines:[
  {sp:'朋友',x:"So get this—my landlord raised the rent by 20 percent.",c:'你听我说——房东把房租涨了20%'},
  {sp:'你',x:"Wait, seriously? That sucks.",c:'等等真的假的？太糟了',n:'惊讶+共情双连'},
  {sp:'朋友',x:"Yeah. At first I thought it was a typo. Turns out it wasn't.",c:'是啊，一开始我以为写错了，结果不是'},
  {sp:'你',x:"Ugh. And then what? Are you gonna move?",c:'唉。然后呢？你要搬家吗？',n:'共情+追问，对话永动机'},
  {sp:'朋友',x:"Probably. Long story short, I'm apartment hunting again.",c:'大概吧。长话短说，我又开始找房了'}]},
 {t:'quiz',h:'反应方向测',qs:[
  {q:'朋友说拿到梦想offer，你反应?',opts:["That's awesome!","That sucks.","No way, that's terrible.","Whatever."],a:"That's awesome!"},
  {q:'朋友说手机被偷了，你反应?',opts:["Oh no, that sucks.","Nice!","That's awesome!","Cool story."],a:"Oh no, that sucks."},
  {q:'想让对方继续讲下去说?',opts:["And then what?","Long story short.","You're welcome.","Never mind."],a:"And then what?"}]},
 {t:'task',h:'开口任务',p:['三情绪快反练习：想象听到「涨薪了」「钱包丢了」「航班取消了」三条消息，0.5秒内给出正确方向的反应语。','反应语是听力和口语之间的桥——练到不过脑子。']}]},

{id:'e32',day:32,week:5,weekTitle:'讲故事的一周',title:'聊计划：gonna 的世界',sub:'What are you up to? + 未来表达',mins:14,steps:[
 {t:'intro',h:'美国人聊未来只用一个词：gonna',p:['教科书教 will，街上人人说 **gonna**(=going to)：I\'m gonna grab lunch.','问计划的两大句式：**What are you up to (this weekend)?**(你要干嘛) / **Any plans?**(有安排吗)','没确定的计划用 **I might...**(可能)、**I\'m thinking about -ing**(在考虑)——美国人的计划都是软的。'],tip:'up to 三连击：What are you up to?(干嘛呢) / I\'m up for it(我愿意去) / It\'s up to you(你定)——一词三吃，今天吃第一口。'},
 {t:'chunks',h:'计划语块',sub:'从确定到不确定的光谱',items:[
  {x:"What are you up to this weekend?",c:'这周末你要干嘛？',ex:"Hey, what are you up to this weekend?",exc:'嘿，这周末干嘛去？',n:'📍周四周五办公室高频，比 What will you do 自然一百倍'},
  {x:"I'm gonna...",c:'我要去……（确定计划）',ex:"I'm gonna hit the gym then meet up with some friends.",exc:'我要去健身，然后跟朋友聚聚',n:'hit the gym=去健身房，meet up=碰面'},
  {x:"I might...",c:'我可能……（不确定）',ex:"I might check out that farmers market.",exc:'我可能去逛逛那个农夫市集',n:'计划打五折的说法'},
  {x:"I'm thinking about...",c:'我在考虑……',ex:"I'm thinking about taking a day trip to the coast.",exc:'我在考虑去海边一日游',n:'day trip=一日游'},
  {x:"No big plans, just taking it easy.",c:'没啥大安排，就放松放松',ex:"No big plans, just taking it easy at home.",exc:'没啥安排，在家躺平',n:'take it easy=放松，社恐友好答案'},
  {x:"You should come!",c:'你也来呗！',ex:"We're doing a BBQ Saturday—you should come!",exc:'我们周六烧烤——你也来呗！',n:'美式邀请的轻量说法，不来也不尴尬'}]},
 {t:'quiz',h:'计划表达测',qs:[
  {q:'「这周末你要干嘛?」最自然的问法?',opts:["What are you up to this weekend?","What will you do this weekend?","Where do you go weekend?","How is your weekend plan?"],a:"What are you up to this weekend?"},
  {q:'计划还没定，说?',opts:["I might check out the market.","I will definitely go.","I gonna go.","I am go maybe."],a:"I might check out the market."},
  {q:'hit the gym 意思是?',opts:['去健身房','打拳击','砸健身房','路过健身房'],a:'去健身房'}]},
 {t:'task',h:'开口任务',p:["说你本周末的真实计划：一句 I'm gonna...，一句 I might...，收尾 Should be fun（应该会不错）。",'照镜子练问句 What are you up to this weekend?——升调、连读 whaddaya up to。']}]},

{id:'e33',day:33,week:5,weekTitle:'讲故事的一周',title:'改约与取消：不伤感情的说法',sub:'Rain check / Something came up',mins:14,steps:[
 {t:'intro',h:'取消约定的美式礼仪',p:['临时有事很正常，关键是话术：**Something came up**(有点事)——万能且不需要解释细节。','改期神词 **rain check**：Can I take a rain check?(改天行吗)——来自棒球赛雨天延期票，文化梗今天收下。','公式：道歉轻量 + 原因模糊 + 主动提新时间 = 关系无损：Sorry, something came up—can we do Thursday instead?'],tip:'美国人取消约定不需要复杂理由，过度解释反而显得心虚。Something came up 就是全部。'},
 {t:'chunks',h:'改约语块',sub:'轻道歉+新方案',items:[
  {x:"Something came up.",c:'临时有点事',ex:"So sorry, something came up at work.",exc:'抱歉，工作上临时有点事',n:'📍万能理由，无需细节，全美通用'},
  {x:"Can I take a rain check?",c:'能改天吗？',ex:"I can't make it tonight—can I take a rain check?",exc:'今晚去不了了——能改天吗？',n:"can't make it=去不了；rain check=延期券文化梗"},
  {x:"Can we push it to...?",c:'能推到（周四）吗？',ex:"Can we push it to next week?",exc:'能推到下周吗？',n:'push=往后推，工作场景也高频'},
  {x:"I'm running late.",c:'我要迟到了',ex:"Traffic's crazy—I'm running late, be there in 15.",exc:'堵疯了——我要晚点到，15分钟后到',n:'be there in+分钟=几分钟后到，短信高频'},
  {x:"No worries at all.",c:'完全没事',ex:"No worries at all, let's do next week.",exc:'完全没事，那就下周',n:'对方取消时你的大度回应'},
  {x:"Let's play it by ear.",c:'到时候看情况',ex:"Not sure about Sunday yet—let's play it by ear.",exc:'周日还不确定——到时候看情况',n:'字面「凭耳朵演奏」=随机应变，高频习语'}]},
 {t:'dialog',h:'短信改约实战',sub:'把这段当成你的聊天记录',lang:'en-US',mode:'role',you:'你',lines:[
  {sp:'朋友',x:"Hey, still on for dinner tonight?",c:'嘿，今晚饭局还算数吗？',n:'still on for=还照计划吗，约定确认高频'},
  {sp:'你',x:"Ah, so sorry—something came up at work. Can I take a rain check?",c:'啊抱歉——工作临时有事。能改天吗？',n:'轻道歉+模糊原因+rain check'},
  {sp:'朋友',x:"No worries at all! Thursday work for you?",c:'完全没事！周四行吗？',n:'work for you=对你合适吗'},
  {sp:'你',x:"Thursday works. My treat, to make up for it!",c:'周四可以。我请客，算赔罪！',n:'My treat=我请客；make up for=弥补'}]},
 {t:'quiz',h:'改约检验',qs:[
  {q:'「能改天吗」的地道说法?',opts:["Can I take a rain check?","Can I take a sun check?","Can you change day?","I want another day."],a:"Can I take a rain check?"},
  {q:'取消约定的万能理由?',opts:["Something came up.","I don't want to go.","You are boring.","No reason."],a:"Something came up."},
  {q:'朋友问 Still on for tonight? 是在问?',opts:['今晚还照计划吗','今晚还开着灯吗','你还在楼上吗','今晚几点'],a:'今晚还照计划吗'}]},
 {t:'task',h:'开口任务',p:['完整演一遍改约短信（出声读）：道歉+something came up+rain check+提新时间。','再演对方版：No worries at all!——两边都会，才是社交完全体。']}]},

{id:'e34',day:34,week:5,weekTitle:'讲故事的一周',title:'久别重逢：It\'s been forever!',sub:'catch up 的完整流程',mins:14,steps:[
 {t:'intro',h:'重逢寒暄的固定舞步',p:['偶遇很久没见的人，美国人的舞步固定：**It\'s been forever!**(好久不见)→ **How have you been?**(近来如何)→ 互抛近况 → **We should catch up properly!**(找时间好好聊)','**catch up**=补上错过的近况，重逢场景的灵魂词。','近况快报公式：Same old, same old(老样子) / 一件新事 Actually, I just...(其实我刚…)'],tip:"How have you been? 和 How are you? 的区别：前者问「这段时间」，专用于久别——用对了瞬间显地道。"},
 {t:'chunks',h:'重逢语块',sub:'按舞步顺序记',items:[
  {x:"It's been forever!",c:'好久不见了！',ex:"Oh my gosh, it's been forever!",exc:'天呐，太久没见了！',n:'📍比 Long time no see 更美式自然'},
  {x:"How have you been?",c:'你最近都好吗？',ex:"Good to see you! How have you been?",exc:'见到你真好！最近都好吗？',n:'久别专用问候，现在完成时的意义在这'},
  {x:"Same old, same old.",c:'老样子',ex:"Same old, same old—work, gym, repeat.",exc:'老样子——上班健身循环',n:'谦虚开场，紧接一件小新事更佳'},
  {x:"Actually, I just...",c:'其实我刚……（放新闻）',ex:"Actually, I just switched jobs last month.",exc:'其实我上个月刚换了工作',n:'switch jobs=换工作，近况炸弹标准投放'},
  {x:"We should catch up properly.",c:'我们该找时间好好聚聚',ex:"We should catch up properly—coffee next week?",exc:'该好好聚聚了——下周喝咖啡？',n:'properly=正经地，把偶遇转成约定'},
  {x:"It was so good running into you!",c:'偶遇你太开心了！',ex:"It was so good running into you! Text me!",exc:'碰到你太好了！给我发消息！',n:'run into=偶遇；告别收尾句'}]},
 {t:'dialog',h:'街头偶遇实战',sub:'完整走一遍重逢舞步',lang:'en-US',mode:'role',you:'你',lines:[
  {sp:'老同事',x:"Kenny? No way! It's been forever!",c:'Kenny？不会吧！好久不见！'},
  {sp:'你',x:"Oh wow, good to see you! How have you been?",c:'哇，见到你真好！最近怎么样？',n:'惊喜+舞步第二拍'},
  {sp:'老同事',x:"Same old, same old. Actually, I just moved back to the city.",c:'老样子。其实我刚搬回市里'},
  {sp:'你',x:"That's awesome! We should catch up properly—coffee this week?",c:'太好了！咱们该好好聚聚——这周喝个咖啡？',n:'反应语+转约定，学以致用'},
  {sp:'老同事',x:"Totally! Text me. So good running into you!",c:'必须的！发我消息。偶遇你太开心了！'}]},
 {t:'quiz',h:'重逢检验',qs:[
  {q:'对很久没见的人问候用?',opts:["How have you been?","How do you do?","What is your name?","How old are you?"],a:"How have you been?"},
  {q:'run into someone 意思是?',opts:['偶遇某人','撞倒某人','跑向某人','讨厌某人'],a:'偶遇某人'},
  {q:'「找时间好好聚聚」?',opts:["We should catch up properly.","We should run errands.","We should take a rain check.","We should play it by ear."],a:"We should catch up properly."}]},
 {t:'task',h:'开口任务',p:['自导自演偶遇老朋友全流程：It\'s been forever → How have you been → Same old + Actually I just... → We should catch up。','想一个真实的老朋友套进去演——真人真事，表达才有魂。']}]},

{id:'e35',day:35,week:5,weekTitle:'讲故事的一周',title:'第5周整合 · 完整叙事实战',sub:'把一周的武器连成一场对话',mins:15,steps:[
 {t:'intro',h:'整合：你已经是「能聊的人」了',p:['本周装备复盘：周末话题 + 故事骨架(So/Turns out) + 反应语(No way/That sucks) + 计划(gonna/might) + 改约(rain check) + 重逢(catch up)。','这套组合覆盖美国日常闲聊的 70% 场景——你不再是「能对话」，是「能来回聊」。','今天大整合：一场从偶遇到告别的完整对话。'],tip:'叙事+反应是对话的呼吸：讲的时候给结构，听的时候给反应。'},
 {t:'dialog',h:'综合实战：咖啡店偶遇老友',sub:'你的台词全是本周语块',lang:'en-US',mode:'role',you:'你',lines:[
  {sp:'朋友',x:"Kenny! It's been forever! How have you been?",c:'Kenny！好久不见！最近怎么样？'},
  {sp:'你',x:"Pretty good! Same old, same old. Actually, I just got back from Seattle.",c:'挺好的！老样子。其实我刚从西雅图回来',n:'get back from=从〜回来'},
  {sp:'朋友',x:"No way! For work or fun?",c:'不会吧！出差还是玩？'},
  {sp:'你',x:"Work trip. So get this—my flight got delayed five hours. Turns out the crew just never showed up.",c:'出差。你听我说——航班延误了5小时，结果发现是机组人员压根没来',n:'故事骨架实弹演习'},
  {sp:'朋友',x:"You're kidding. That sucks!",c:'开玩笑吧，太惨了！'},
  {sp:'你',x:"Right? Long story short, I lived at the airport Starbucks. Anyway—what are you up to this weekend? We should catch up properly.",c:'可不是嘛？长话短说，我在机场星巴克住下了。对了——你周末干嘛？咱们该好好聚聚',n:'anyway=话题转换器，聊天方向盘'},
  {sp:'朋友',x:"I'm down! Saturday brunch?",c:'我可以！周六早午餐？',n:"I'm down=我加入（俚语库老朋友）"},
  {sp:'你',x:"Saturday works. If anything comes up, we'll play it by ear.",c:'周六可以。有变动咱们随机应变',n:'完美收尾，改约条款预埋'}]},
 {t:'quiz',h:'第5周通关测',qs:[
  {q:'讲故事的「结果发现」用?',opts:["Turns out...","At first...","So get this...","No way..."],a:"Turns out..."},
  {q:'朋友说航班取消了，你反应?',opts:["You're kidding. That sucks!","That's awesome!","Nice!","Good job!"],a:"You're kidding. That sucks!"},
  {q:'「你周末要干嘛?」?',opts:["What are you up to this weekend?","What is your weekend?","How do you weekend?","Where is weekend?"],a:"What are you up to this weekend?"},
  {q:'临时去不了，改天，说?',opts:["Something came up—can I take a rain check?","I refuse to come.","See you never.","It flew by."],a:"Something came up—can I take a rain check?"},
  {q:'anyway 在对话里的作用是?',opts:['转换话题','结束友谊','表示愤怒','请求重复'],a:'转换话题'}]},
 {t:'task',h:'本周输出任务',p:['2分钟独白挑战：讲你真实的上周——一件事用故事骨架，一个周末计划用 gonna/might，中途至少一次 anyway 转话题。','录音回听。第5周的你 vs 第1周的你——这就是复利曲线的样子。']}]},

{id:'e36',day:36,week:6,weekTitle:'观点与讨论',title:'表达观点：I feel like 时代',sub:'美国人怎么说「我觉得」',mins:14,steps:[
 {t:'intro',h:'I think 之外的观点宇宙',p:["美国日常口语的「我觉得」排位：**I feel like...**(最高频最软) > **I'd say...**(要我说) > **Honestly,...**(说实话) > I think。",'观点软化器：**kind of / sort of / a little**——美国人观点常留余地，全硬观点显得aggressive。','铺垫强观点：**To be honest** / **Not gonna lie**(说真的)——预告接下来是真心话。'],tip:'I feel like 后面接完整句子：I feel like the price is a bit much.——feel like+名词是「想吃/想要」，别混。'},
 {t:'chunks',h:'观点语块',sub:'从软到硬排列',items:[
  {x:"I feel like...",c:'我感觉……（日常观点No.1）',ex:"I feel like this place is overrated.",exc:'我感觉这地方名不副实',n:'📍美国年轻人观点句之王，一天能听二十遍；overrated=被高估'},
  {x:"I'd say...",c:'要我说的话……',ex:"I'd say it's worth the money.",exc:'要我说这钱花得值',n:"worth the money=值这个价"},
  {x:"Honestly, ...",c:'说实话……',ex:"Honestly, I liked the old version better.",exc:'说实话我更喜欢旧版',n:'轻量真心话开场'},
  {x:"Not gonna lie, ...",c:'不骗你/讲真……',ex:"Not gonna lie, that movie made me tear up.",exc:'讲真，那电影看得我想哭',n:'缩写NGL，网络与口语双栖；tear up=眼眶湿润'},
  {x:"It's kind of...",c:'有点……（软化器）',ex:"It's kind of pricey, but the quality is there.",exc:'是有点小贵，但质量在线',n:'pricey=小贵；观点打八折更好入耳'},
  {x:"That's just me though.",c:'不过这只是我个人看法',ex:"I'd skip the dessert—that's just me though.",exc:'我会跳过甜点——不过这只是我的偏好',n:'观点收尾降落伞，避免说教感'}]},
 {t:'quiz',h:'观点表达测',qs:[
  {q:'美国口语最高频的「我觉得」?',opts:["I feel like...","In my opinion...","I am of the view that...","As far as I am concerned..."],a:"I feel like...",explain:'后三个书面/正式场合才用'},
  {q:'「有点小贵但值」?',opts:["It's kind of pricey, but worth it.","It is expensive very.","Price is bad I feel.","Kind of I like price."],a:"It's kind of pricey, but worth it."},
  {q:'观点说完想降低攻击性，加?',opts:["That's just me though.","You must agree.","I am right.","End of story."],a:"That's just me though."}]},
 {t:'task',h:'开口任务',p:['对今天接触的三样东西各发表一句观点：I feel like... / I\'d say... / Honestly...——最后一句加 that\'s just me though。','观点+软化+降落伞，说三轮成肌肉。']}]},

{id:'e37',day:37,week:6,weekTitle:'观点与讨论',title:'同意与反对的艺术',sub:'Totally! / I see your point, but...',mins:14,steps:[
 {t:'intro',h:'美式同意反对的潜规则',p:['同意要热烈：**Totally. / Exactly. / Right?**——一个词就够，配点头。','反对要铺垫：先 **I see your point**(我懂你意思) / **That\'s fair**(有道理)，再 **but here\'s the thing**(但问题是)。','直接说 No, you\'re wrong 在美国日常里几乎等于宣战——反对的艺术是先接住再转向。'],tip:'Right? 用升调说是「对吧?」求认同；用降调 Right. 是「没错」表同意——一词两用靠语调。'},
 {t:'chunks',h:'同意反对语块',sub:'先接住，再转向',items:[
  {x:"Totally.",c:'完全同意',ex:"—This app is so much better. —Totally.",exc:'——这App好用多了 ——完全同意',n:'📍美式同意第一词，heard everywhere'},
  {x:"Exactly!",c:'就是这个意思！',ex:"Exactly! That's what I've been saying.",exc:'就是啊！我一直这么说',n:'对方说中你心声时用'},
  {x:"That's fair.",c:'有道理/可以理解',ex:"That's fair. I hadn't thought of it that way.",exc:'有道理，我没从这角度想过',n:'承认对方合理，风度分拉满'},
  {x:"I see your point, but...",c:'我懂你的点，但是……',ex:"I see your point, but the timing feels off.",exc:'我懂你的意思，但时机感觉不对',n:'礼貌反对的标准开头；feels off=感觉不对劲'},
  {x:"Here's the thing—",c:'但问题是——',ex:"Here's the thing—we don't have the budget.",exc:'但问题是——我们没预算',n:'引出核心矛盾，工作讨论高频'},
  {x:"I'm not so sure about that.",c:'这我可不太确定（=不同意）',ex:"Hmm, I'm not so sure about that.",exc:'嗯……这我可不太认同',n:'美式委婉反对，字面「不确定」实际「不同意」'}]},
 {t:'dialog',h:'观点交锋实战',sub:'和同事聊AI（你的主场话题）',lang:'en-US',mode:'role',you:'你',lines:[
  {sp:'同事',x:"I feel like AI is gonna take over most jobs in ten years.",c:'我感觉AI十年内会取代大部分工作'},
  {sp:'你',x:"I see your point, but here's the thing—it's more about people who use AI replacing people who don't.",c:'我懂你的点，但问题是——更可能是会用AI的人取代不会用的人',n:'接住+转向+你的招牌观点'},
  {sp:'同事',x:"That's fair. So you use it a lot at work?",c:'有道理。所以你工作里常用？'},
  {sp:'你',x:"Totally. Honestly, it's doubled my output.",c:'当然。说实话，它让我的产出翻倍了',n:'同意词+观点语块，全是本周装备'}]},
 {t:'quiz',h:'交锋检验',qs:[
  {q:'礼貌反对的正确打开方式?',opts:["I see your point, but...","No, wrong.","You know nothing.","Shut up but..."],a:"I see your point, but..."},
  {q:"I'm not so sure about that 实际含义?",opts:['我不太同意','我没听清','我不确定时间','我很确定'],a:'我不太同意'},
  {q:'对方说中你心声，热烈同意用?',opts:["Exactly!","That's fair.","Here's the thing.","I might."],a:"Exactly!"}]},
 {t:'task',h:'开口任务',p:['找一个你不同意的常见观点（比如「AI会让人失业」），完整说一遍：That\'s fair... I see your point, but here\'s the thing—...','先接后转，说2遍——这是高情商反对的肌肉记忆。']}]},

{id:'e38',day:38,week:6,weekTitle:'观点与讨论',title:'偏好与比较：I\'d rather',sub:'更喜欢哪个？怎么选？',mins:14,steps:[
 {t:'intro',h:'选择困难的表达自由',p:['**I\'d rather A (than B)**＝比起B更愿意A：I\'d rather stay in tonight.(今晚宁愿宅着)','**I\'m more of a ... person**＝我是〜派：I\'m more of a coffee person.(我是咖啡党)——身份式偏好，聊天利器。','比较级口语化：**way better**(好太多) / **not as good as**(不如)——way 是美式加强词之王。'],tip:'X or Y? 是美国日常最高频提问形态（Coffee or tea? Window or aisle?）——秒答能力今天点亮。'},
 {t:'chunks',h:'偏好语块',sub:'选边站的一百种说法',items:[
  {x:"I'd rather stay in.",c:'我宁愿宅家',ex:"It's freezing—I'd rather stay in tonight.",exc:'冷死了——今晚我宁愿宅着',n:'📍stay in=宅家，反义 go out；周五晚灵魂抉择'},
  {x:"I'm more of a ... person.",c:'我是……派/党',ex:"I'm more of a dog person, honestly.",exc:'讲真我是狗派',n:'cat person/dog person/morning person 全套通用'},
  {x:"...is way better.",c:'……好太多了',ex:"The original is way better than the remake.",exc:'原版比翻拍好太多了',n:'way=美式程度放大器，比much口语'},
  {x:"It's not as good as...",c:'不如……',ex:"It's decent, but not as good as the old one.",exc:'还行，但不如老款',n:'decent=还不错，中性好评'},
  {x:"Either works for me.",c:'哪个都行',ex:"—Pizza or tacos? —Either works for me.",exc:'——披萨还是塔可？——都行',n:'随和不纠结的标准答案'},
  {x:"If I had to choose, ...",c:'非要选的话……',ex:"If I had to choose, I'd go with the blue one.",exc:'非要选的话我选蓝的',n:"go with=选定，点单购物高频"}]},
 {t:'quiz',h:'偏好检验',qs:[
  {q:'「我是早起派」?',opts:["I'm more of a morning person.","I am morning human.","Morning is my person.","I person morning."],a:"I'm more of a morning person."},
  {q:'「原版好太多」?',opts:["The original is way better.","The original is way good.","Original much is better.","Way the original better."],a:"The original is way better."},
  {q:'被问 Coffee or tea? 都行怎么答?',opts:["Either works for me.","Both is not.","No choose.","Whatever you."],a:"Either works for me."}]},
 {t:'task',h:'开口任务',p:['快问快答（自问自答出声）：Coffee or tea? / Stay in or go out? / iOS or Android?——每题用不同句型答。','再声明两个你的「派系」：I\'m more of a ___ person.——身份标签是聊天钩子。']}]},

{id:'e39',day:39,week:6,weekTitle:'观点与讨论',title:'提建议：Why don\'t we...?',sub:'从提议到拍板的全流程',mins:14,steps:[
 {t:'intro',h:'美式提建议：问句的艺术',p:['美国人提建议爱用问句（压力小）：**Why don\'t we...?**(咱们何不) / **How about...?**(〜怎么样) / **Wanna...?**(要不要)','接受：**Sounds good! / I\'m down / Let\'s do it**；犹豫：**I don\'t know...**(拖长音=不太想)','拍板收尾：**It\'s settled.**(就这么定了)——会提议、会接、会拍板，组局能力=社交货币。'],tip:'Wanna grab...? 是万能组局句：grab coffee/lunch/drinks——grab 把正式感全卸掉，只剩轻松。'},
 {t:'chunks',h:'建议语块',sub:'提议→回应→拍板',items:[
  {x:"Why don't we...?",c:'咱们何不……？',ex:"Why don't we split an Uber?",exc:'咱们何不拼个Uber？',n:'📍split=平摊，美国AA文化核心动词'},
  {x:"How about...?",c:'……怎么样？',ex:"How about that Thai place on Main?",exc:'主街那家泰餐怎么样？',n:'提名+问号，选择题式提议'},
  {x:"Wanna grab...?",c:'要不要去搞点……？',ex:"Wanna grab drinks after work?",exc:'下班要不要去喝一杯？',n:'grab drinks/lunch/coffee 三大组局咒语'},
  {x:"Sounds good!",c:'听着不错/行！',ex:"—Seven o'clock? —Sounds good!",exc:'——7点？——行！',n:'接受建议的默认回复，短信口语双栖'},
  {x:"I could go either way.",c:'我都可以',ex:"Thai or ramen? I could go either way.",exc:'泰餐还是拉面？我都行',n:'比 Either works 更悠着点的说法'},
  {x:"It's settled.",c:'就这么定了',ex:"Alright, it's settled—Thai at seven.",exc:'好，定了——7点泰餐',n:'拍板收尾，组局者气场'}]},
 {t:'dialog',h:'组局实战',sub:'你来当组局的人',lang:'en-US',mode:'role',you:'你',lines:[
  {sp:'你',x:"Hey, wanna grab dinner after work?",c:'嘿，下班要不要一起吃个饭？',n:'组局第一咒语'},
  {sp:'同事',x:"I'm down! What are you thinking?",c:'我加入！你想吃啥？',n:'What are you thinking=你怎么想（点单版）'},
  {sp:'你',x:"How about that new Korean BBQ place? I heard it's really good.",c:'那家新开的韩式烤肉怎么样？听说特别好',n:'I heard=听说，种草情报源'},
  {sp:'同事',x:"Ooh, I've been wanting to try it. Six thirty?",c:'哦我一直想去试试。6点半？'},
  {sp:'你',x:"Sounds good. It's settled!",c:'行，就这么定了！',n:'接受+拍板，组局闭环'}]},
 {t:'quiz',h:'组局检验',qs:[
  {q:'「下班去喝一杯不?」最轻松的说法?',opts:["Wanna grab drinks after work?","Do you want to consume beverages?","We must drink.","Drink you tonight?"],a:"Wanna grab drinks after work?"},
  {q:'「咱们拼个Uber吧」?',opts:["Why don't we split an Uber?","Why not we cut Uber?","Let's break an Uber.","We divide Uber ok?"],a:"Why don't we split an Uber?"},
  {q:'拍板「就这么定了」?',opts:["It's settled.","It's sat.","It's seated.","Settle down."],a:"It's settled."}]},
 {t:'task',h:'开口任务',p:['完整组一次局（出声自演双角色）：Wanna grab...? → I\'m down → How about...? → Sounds good → It\'s settled.','本周真实找一个人组一次局——线上中文局也行，脑内英文同步一遍。']}]},

{id:'e40',day:40,week:6,weekTitle:'观点与讨论',title:'解释原因：because 之外',sub:"That's why / The thing is / turned out",mins:14,steps:[
 {t:'intro',h:'把「因为所以」说出层次',p:['口语解释原因的三板斧：**because**(直接)、**so**(所以·结果在后)、**that\'s why**(这就是为什么·点题)。','引出隐情：**The thing is...**(关键是…)——美国人解释复杂情况的万能起手式。','补充说明：**I mean,...**(我是说…)——修正/展开上一句，口语粘合剂。'],tip:'so 和 because 方向相反：I was tired, so I left. = I left because I was tired.——信息焦点不同，讲故事时选对方向。'},
 {t:'chunks',h:'因果语块',sub:'把逻辑说清楚的工具箱',items:[
  {x:"The thing is, ...",c:'关键是……/问题在于……',ex:"I'd love to go. The thing is, I'm swamped this week.",exc:'我很想去。关键是我这周忙疯了',n:'📍swamped=忙到淹没，办公室高频'},
  {x:"That's why...",c:'这就是为什么……',ex:"The trains stop at midnight—that's why I left early.",exc:'地铁午夜停运——这就是为什么我早走了',n:'解释行为的点题句'},
  {x:"I mean, ...",c:'我是说……（展开/修正）',ex:"It's fine. I mean, it's not perfect, but it works.",exc:'还行。我是说，不完美，但能用',n:'口语第一粘合剂，美国人一天说50次'},
  {x:"It's not that..., it's just...",c:'不是……只是……',ex:"It's not that I don't like it, it's just not my style.",exc:'不是不喜欢，只是不是我的风格',n:'高情商拒绝/解释双料句型'},
  {x:"...that's the whole point.",c:'……这才是重点',ex:"It's supposed to be slow—that's the whole point.",exc:'它本来就该慢——这才是重点所在',n:'supposed to=本应；纠正对方误解时用'},
  {x:"Which is why...",c:'也正因如此……',ex:"Rent went up, which is why I'm moving.",exc:'房租涨了，也正因如此我要搬家',n:'书面口语两用的因果连接'}]},
 {t:'quiz',h:'因果检验',qs:[
  {q:'「不是不喜欢，只是太贵了」?',opts:["It's not that I don't like it, it's just too pricey.","No like because expensive.","I don't like it that's why expensive.","Like it not, price yes."],a:"It's not that I don't like it, it's just too pricey."},
  {q:'引出复杂隐情的起手式?',opts:["The thing is...","The stuff is...","Thing be like...","A thing says..."],a:"The thing is..."},
  {q:'swamped 意思是?',opts:['忙疯了','游泳了','困住了','出汗了'],a:'忙疯了'}]},
 {t:'task',h:'开口任务',p:['用三句话解释你最近一个决定（学日语/换工作/买某样东西）：The thing is... / That\'s why... / I mean...','解释清楚一个决定=面试和闲聊的通用硬通货。']}]},

{id:'e41',day:41,week:6,weekTitle:'观点与讨论',title:'话题深聊实战：AI与工作',sub:'把你的招牌观点连成一段发言',mins:15,steps:[
 {t:'intro',h:'从接话到主导话题',p:['你有大量AI实战经验——这是你英语深聊的**主场**。今天把观点、因果、比较全部武器装进一个话题。','深聊结构：**立场**(I feel like...) → **理由**(The thing is...) → **例子**(For example, in my work...) → **让步**(That said,...) → **收尾**(At the end of the day,...)','**That said**(话虽如此)和 **At the end of the day**(说到底)——深聊的两个转弯灯，今天点亮。'],tip:'英语深聊的秘密：不是词汇量，是**结构**。同样的简单词，套上结构就是完整观点。'},
 {t:'chunks',h:'深聊结构语块',sub:'五段式发言骨架',items:[
  {x:"For example, in my work...",c:'比如在我的工作里……',ex:"For example, in my work, AI drafts half my emails now.",exc:'比如在我工作里，AI现在起草我一半的邮件',n:'📍具体例子是观点的锚，个人经验无人能反驳'},
  {x:"That said, ...",c:'话虽如此……（让步转折）',ex:"That said, you still need judgment to use it well.",exc:'话虽如此，用好它仍然需要判断力',n:'先让一步再守住立场，成熟讨论的标志'},
  {x:"At the end of the day, ...",c:'说到底……',ex:"At the end of the day, it's a tool, not a replacement.",exc:'说到底它是工具，不是替代品',n:'总结收尾句，观点落锤'},
  {x:"It's a game changer.",c:'这是颠覆性的',ex:"Honestly, AI has been a game changer for me.",exc:'说实话AI对我来说是颠覆性的',n:'科技话题第一热词'},
  {x:"The way I see it, ...",c:'依我看……',ex:"The way I see it, the gap is only gonna widen.",exc:'依我看，差距只会越拉越大',n:'比 I think 更有分量的观点开场'},
  {x:"...if that makes sense.",c:'……不知道我说明白没',ex:"It's like a copilot, not an autopilot—if that makes sense.",exc:'它像副驾驶而不是自动驾驶——不知道这么说清楚没',n:'长发言收尾软化剂，检查对方接收'}]},
 {t:'dialog',h:'深聊实战：聚会上被问AI',sub:'这是你的主场，放开说',lang:'en-US',mode:'role',you:'你',lines:[
  {sp:'新朋友',x:"So you work in tech, right? Is AI really changing things that much?",c:'你是做科技行业的吧？AI真有传的那么颠覆吗？'},
  {sp:'你',x:"Honestly? It's a game changer. For example, in my work, it's easily doubled my output.",c:'说实话？确实颠覆。比如在我工作里，它轻松让我产出翻倍',n:'立场+个人例子，开局稳'},
  {sp:'新朋友',x:"Wow. Aren't you worried it'll take your job though?",c:'哇。但你不担心它抢你饭碗吗？'},
  {sp:'你',x:"The way I see it, it's less about AI taking jobs and more about people who use AI taking them. That said, the pace is honestly hard to keep up with.",c:'依我看，与其说AI抢工作，不如说会用AI的人抢。话虽如此，这个进展速度确实很难跟上',n:'招牌观点+让步，深度与谦逊双在线'},
  {sp:'新朋友',x:"That's a good way to put it.",c:'这个说法很到位',n:'way to put it=表述方式'},
  {sp:'你',x:"At the end of the day, it's like a copilot, not an autopilot—if that makes sense.",c:'说到底它像副驾驶，不是自动驾驶——不知道这么说清楚没',n:'金句收尾+软化，deep talk完成'}]},
 {t:'quiz',h:'深聊检验',qs:[
  {q:'让步转折「话虽如此」?',opts:["That said, ...","Said that, ...","That saying, ...","To say that..."],a:"That said, ..."},
  {q:'「说到底」收尾用?',opts:["At the end of the day...","In the day end...","Day by day...","End of story..."],a:"At the end of the day..."},
  {q:'game changer 意思是?',opts:['颠覆性的事物','游戏玩家','换游戏的人','规则手册'],a:'颠覆性的事物'}]},
 {t:'task',h:'开口任务',p:['用五段结构对着镜子发表90秒AI观点：The way I see it → The thing is → For example, in my work → That said → At the end of the day。','这段话未来会在真实社交里说出口——今天是排练，不是练习。']}]},

{id:'e42',day:42,week:6,weekTitle:'观点与讨论',title:'第6周整合 · 观点自由输出',sub:'立场-理由-例子-让步-收尾 全流程验收',mins:15,steps:[
 {t:'intro',h:'整合：你已经能「有观点地聊」了',p:['本周军火库：I feel like 系观点 + Totally/That\'s fair 同意反对 + I\'d rather 偏好 + Why don\'t we 建议 + The thing is 因果 + That said 深聊结构。','第5周你学会「讲事」，本周学会「讲理」——事实+观点，对话的两条腿齐了。','今天验收：一场完整的观点交锋。'],tip:'观点不需要正确，只需要清楚+留余地——这是美式讨论的默契。'},
 {t:'dialog',h:'综合实战：办公室午餐辩论',sub:'远程办公好还是坐班好？',lang:'en-US',mode:'role',you:'你',lines:[
  {sp:'同事',x:"I feel like working from home is way better. No commute, no distractions.",c:'我感觉在家办公好太多了。不用通勤，没人打扰'},
  {sp:'你',x:"That's fair. I see your point, but here's the thing—I feel like I focus better at the office. That's just me though.",c:'有道理。我懂你的点，但问题是——我感觉我在办公室更专注。不过这只是我个人',n:'接住+转向+降落伞，教科书级反对'},
  {sp:'同事',x:"Really? I'd rather skip the commute and sleep in.",c:'真的？我宁愿省下通勤多睡会儿',n:'sleep in=睡懒觉'},
  {sp:'你',x:"I mean, the commute sucks, totally. The thing is, at home I end up working way longer hours. If I had to choose, I'd go with hybrid.",c:'我是说，通勤确实烦，完全同意。关键是在家我结果反而工作时间更长。非要选的话，我选混合办公',n:'让步+隐情+选边，三连击'},
  {sp:'同事',x:"Hybrid is the move. Why don't we pitch that to the team?",c:'混合办公是正解。咱们何不跟团队提一下？',n:'is the move=是正确选择（俚语库老朋友）'},
  {sp:'你',x:"Sounds good. It's settled!",c:'行，就这么定了！'}]},
 {t:'quiz',h:'第6周通关测',qs:[
  {q:'先认可再反对的完整句?',opts:["I see your point, but here's the thing—","You're wrong, here is thing—","Point is yours but no—","I take your point away—"],a:"I see your point, but here's the thing—"},
  {q:'「非要选的话我选混合」?',opts:["If I had to choose, I'd go with hybrid.","If choosing, hybrid goes me.","Must choose hybrid I go.","I choose had to hybrid."],a:"If I had to choose, I'd go with hybrid."},
  {q:'「话虽如此」的让步词?',opts:["That said,","Said so,","So that,","Thus spoke,"],a:"That said,"},
  {q:'👂听观点',audio:{x:"Honestly, I feel like it's kind of overrated. That's just me though.",lang:'en-US'},opts:['他觉得名不副实但只是个人看法','他觉得物超所值','他强烈推荐','他没有观点'],a:'他觉得名不副实但只是个人看法'},
  {q:'sleep in 意思是?',opts:['睡懒觉','在里面睡','失眠','睡着了'],a:'睡懒觉'}]},
 {t:'task',h:'本周输出任务',p:['选一个真实争议话题（远程办公/买房租房/iPhone安卓），自演正反双方各60秒——双方都要用本周结构。','能同时说服自己两次的人，才真正掌握了观点表达。']}]}
);

/* ===== 英语第2月 · 第7-8周（Day43-56）：工作英语与生活办事 ===== */
EN_LESSONS.push(
{id:'e43',day:43,week:7,weekTitle:'工作英语实战',title:'会议开场：small talk 到 agenda',sub:'美式会议的前三分钟',mins:15,steps:[
 {t:'intro',h:'美式会议的隐藏规则：先寒暄再干活',p:['美国会议前2-3分钟是**强制寒暄时间**：聊天气、周末、近况——直接谈工作反而失礼。','开场三件套：**How\'s it going?** → 轻聊两句 → **Alright, let\'s dive in.**(好，咱们开始吧)','视频会议专属：**Can everyone hear me OK?** / **You\'re on mute.**(你静音了)——远程时代最高频两句。'],tip:'dive in / jump in / get started 都是「开始」——美国人开会不说 let us begin，太僵。'},
 {t:'chunks',h:'会议开场语块',sub:'从寒暄到切入正题',items:[
  {x:"Thanks for hopping on.",c:'感谢上线参会',ex:"Hey everyone, thanks for hopping on.",exc:'大家好，感谢上线',n:'📍hop on=上线加入，远程会议开场标配'},
  {x:"Can everyone hear me OK?",c:'大家能听到我吗？',ex:"Quick check—can everyone hear me OK?",exc:'确认下——都能听到我吗？',n:'视频会议第一句'},
  {x:"You're on mute.",c:'你静音了',ex:"Sorry Kenny, you're on mute.",exc:'抱歉Kenny，你静音了',n:'远程时代说得最多的一句话，没有之一'},
  {x:"Alright, let's dive in.",c:'好，咱们进入正题',ex:"Alright, let's dive in—first item is the timeline.",exc:'好，进入正题——第一项是时间线',n:'寒暄→正事的切换开关'},
  {x:"I'll keep it short.",c:'我长话短说',ex:"I'll keep it short since we're tight on time.",exc:'时间紧，我长话短说',n:'tight on time=时间紧张'},
  {x:"Can you share your screen?",c:'你能共享下屏幕吗？',ex:"Can you share your screen real quick?",exc:'能快速共享下屏幕吗？',n:'real quick=很快地，美式口头禅'}]},
 {t:'dialog',h:'周会开场实战',sub:'你来主持这个会',lang:'en-US',mode:'role',you:'你',lines:[
  {sp:'你',x:"Hey everyone, thanks for hopping on. How's everyone doing?",c:'大家好，感谢上线。各位都好吗？',n:'主持人开场：致谢+寒暄'},
  {sp:'同事',x:"Doing good! Ready for the weekend already though.",c:'挺好的！不过已经开始盼周末了'},
  {sp:'你',x:"Ha, same here. Alright, let's dive in—quick update on the Salesforce rollout.",c:'哈，我也是。好，进入正题——Salesforce上线的快速更新',n:'same here=我也是；寒暄两句立刻切正题，节奏完美'},
  {sp:'同事',x:"Sounds good. Can you share your screen?",c:'好的。你能共享下屏幕吗？'},
  {sp:'你',x:"Sure thing. One sec... can everyone see it OK?",c:'当然。稍等……大家都能看到吧？',n:'Sure thing=没问题；One sec=稍等'}]},
 {t:'quiz',h:'会议开场测',qs:[
  {q:'同事说话没声音，提醒他?',opts:["You're on mute.","You are quiet person.","Your voice is broken.","Speak up now."],a:"You're on mute."},
  {q:'寒暄结束切入正题说?',opts:["Alright, let's dive in.","Stop talking now.","Meeting begin.","Attention please."],a:"Alright, let's dive in."},
  {q:'hop on 在会议语境是?',opts:['上线参会','跳上桌子','单脚跳','赶时间'],a:'上线参会'}]},
 {t:'task',h:'开口任务',p:['自己主持一个假想会议的前60秒：Thanks for hopping on → 寒暄 → Alright, let\'s dive in → 报出今天第一个议题。','下次真实英文会议，抢下开场这句——主持感是练出来的。']}]},

{id:'e44',day:44,week:7,weekTitle:'工作英语实战',title:'进度汇报：on track 语系',sub:'项目状态的标准表达',mins:15,steps:[
 {t:'intro',h:'三个词说清任何项目状态',p:['美式进度汇报的状态灯：**on track**(按计划) / **slightly behind**(略滞后) / **blocked**(被卡住)。','汇报公式：状态 + 数据 + 下一步：We\'re on track—about 80% done. Next up is testing.','被卡住必须说清卡点：**I\'m blocked on...**(我卡在…)——美国职场文化：暴露问题=专业，隐藏问题=事故。'],tip:'blocked 不是丢脸词，是协作信号——说出来的那一刻，问题就成了团队的问题。'},
 {t:'chunks',h:'汇报语块',sub:'状态灯+细节',items:[
  {x:"We're on track.",c:'进度正常',ex:"We're on track to ship by Friday.",exc:'我们按计划周五上线',n:'📍ship=交付/上线，科技行业动词'},
  {x:"We're slightly behind.",c:'我们略有滞后',ex:"We're slightly behind, but nothing critical.",exc:'稍有滞后，但不严重',n:'nothing critical=无关键问题，稳住军心'},
  {x:"I'm blocked on...",c:'我被……卡住了',ex:"I'm blocked on the API access—waiting on IT.",exc:'我卡在API权限上——在等IT',n:'waiting on=等待某方，甩锅的礼貌形态'},
  {x:"Next up is...",c:'接下来是……',ex:"Next up is user testing next week.",exc:'接下来是下周的用户测试',n:'汇报的「下一步」标准句'},
  {x:"Just to give you a heads-up, ...",c:'先给你打个预防针……',ex:"Just to give you a heads-up, the client wants changes.",exc:'先打个招呼，客户想改需求',n:'heads-up=预警，职场高频名词'},
  {x:"I'll circle back on that.",c:'这个我回头再确认',ex:"Good question—I'll circle back on that tomorrow.",exc:'好问题——我明天回头答复你',n:'circle back=绕回来跟进，办公室黑话之王'}]},
 {t:'quiz',h:'汇报检验',qs:[
  {q:'「进度正常，周五能交付」?',opts:["We're on track to ship by Friday.","We are OK Friday ship.","Friday we track on.","Ship is Friday we."],a:"We're on track to ship by Friday."},
  {q:'「我卡在权限问题上」?',opts:["I'm blocked on the access issue.","I am stop by access.","Access blocks to me.","I block the access."],a:"I'm blocked on the access issue."},
  {q:'heads-up 意思是?',opts:['提前预警','抬头看','头朝上','开会站立'],a:'提前预警'}]},
 {t:'task',h:'开口任务',p:['用状态灯公式汇报你手头真实的一件事（工作或学日语进度都行）：状态 + 具体到哪一步 + Next up is...','再加一句 heads-up 预警任何一个潜在风险——完整的美式汇报就这两句。']}]},

{id:'e45',day:45,week:7,weekTitle:'工作英语实战',title:'讲解与简化：把技术说人话',sub:'Basically / Think of it as... 顾问核心技能',mins:15,steps:[
 {t:'intro',h:'顾问的超能力：把复杂说简单',p:['给客户讲技术，美国人的三板斧：**Basically, ...**(简单说) / **Think of it as...**(把它想成…) / **In plain English, ...**(说人话就是…)','类比句式 **It\'s like...**：It\'s like a filing cabinet for your customer data.(就像客户数据的文件柜)','确认理解闭环：**Does that make sense?**(这么说清楚吗?)——讲完必问，不是客套，是流程。'],tip:'讲解的黄金比例：一句技术 + 一句类比 + 一次确认。你的Salesforce讲解从今天有英文版。'},
 {t:'chunks',h:'讲解语块',sub:'简化、类比、确认',items:[
  {x:"Basically, ...",c:'简单来说……',ex:"Basically, it automates the whole follow-up process.",exc:'简单说，它把整个跟进流程自动化了',n:'📍美国人解释任何事的第一个词'},
  {x:"Think of it as...",c:'把它想象成……',ex:"Think of it as a smart address book that works for you.",exc:'把它想成一个会替你干活的智能通讯录',n:'类比开关，客户秒懂神器'},
  {x:"In plain English, ...",c:'说人话就是……',ex:"In plain English, you'll spend less time on data entry.",exc:'说人话就是：你花在录数据上的时间会变少',n:'自嘲式简化，拉近距离'},
  {x:"The short version is...",c:'简短版本是……',ex:"The short version is: it pays for itself in a year.",exc:'简短版：一年就回本',n:'pays for itself=自己把成本赚回来'},
  {x:"Does that make sense?",c:'这样说清楚了吗？',ex:"That's the workflow. Does that make sense?",exc:'流程就是这样。清楚吗？',n:'讲解闭环必备，升调友好'},
  {x:"Feel free to stop me anytime.",c:'随时可以打断我',ex:"I'll walk you through it—feel free to stop me anytime.",exc:'我带你过一遍——随时打断我',n:'walk you through=带你过一遍，演示第一句'}]},
 {t:'dialog',h:'客户讲解实战',sub:'向不懂技术的客户讲Salesforce',lang:'en-US',mode:'role',you:'你',lines:[
  {sp:'客户',x:"So what exactly does this CRM thing do?",c:'所以这个CRM到底是干嘛的？'},
  {sp:'你',x:"Great question. Basically, it keeps all your customer info in one place. Think of it as a smart filing cabinet that reminds you what to do next.",c:'好问题。简单说，它把你所有客户信息放在一处。把它想成一个会提醒你下一步做什么的智能文件柜',n:'Basically+类比，三板斧连发'},
  {sp:'客户',x:"Huh. And that's worth the price?",c:'嗯……这值那个价吗？'},
  {sp:'你',x:"The short version is: your team stops losing leads. In plain English, it pays for itself. Does that make sense?",c:'简短版：你的团队不再丢线索。说人话：它自己回本。这么说清楚吗？',n:'商业价值+人话+确认闭环，顾问满分话术'},
  {sp:'客户',x:"That actually makes a lot of sense.",c:'这么说确实很明白'}]},
 {t:'quiz',h:'讲解检验',qs:[
  {q:'把复杂概念开始简化时说?',opts:["Basically, ...","Difficultly, ...","Technically complicated, ...","As you cannot know, ..."],a:"Basically, ..."},
  {q:'「把它想象成智能通讯录」?',opts:["Think of it as a smart address book.","Think it is smart address book.","You think smart book.","As smart book you think it."],a:"Think of it as a smart address book."},
  {q:'讲解完确认理解说?',opts:["Does that make sense?","Do you have brain?","Understand or not?","Is clear yes?"],a:"Does that make sense?"}]},
 {t:'task',h:'开口任务',p:['把你工作里最常讲的一个概念（CRM/自动化/AI工具）用三板斧讲60秒：Basically → Think of it as → Does that make sense?','这段话就是你的英文工作demo——练到能对真客户说。']}]},

{id:'e46',day:46,week:7,weekTitle:'工作英语实战',title:'没听懂怎么办：会议求生术',sub:'Could you elaborate? / What do you mean by...?',mins:14,steps:[
 {t:'intro',h:'听不懂不丢人，装懂才致命',p:['会议听不懂的三级求生梯：**Sorry, could you say that again?**(再说一遍) → **What do you mean by...?**(你说的…是指?) → **Just to make sure I got it right, ...**(确认下我理解对不对…)','复述确认是顾问必杀技：**So what you\'re saying is...**(所以你的意思是…)——既确认又显专业。','跟不上语速就控速：**Could you slow down just a bit?**——美国人对此完全习惯，没人介意。'],tip:'开会最贵的错觉是「大概听懂了」。用复述确认把大概变确定——客户还会觉得你严谨。'},
 {t:'chunks',h:'求生语块',sub:'三级求生梯',items:[
  {x:"Sorry, could you say that again?",c:'抱歉能再说一遍吗？',ex:"Sorry, could you say that again? The line cut out.",exc:'抱歉再说一遍？刚才断线了',n:'📍cut out=信号中断，甩锅给网络的艺术'},
  {x:"What do you mean by...?",c:'你说的……具体指什么？',ex:"What do you mean by 'phase two' exactly?",exc:'你说的「第二阶段」具体指什么？',n:'精准定位没懂的词，最高效追问'},
  {x:"So what you're saying is...",c:'所以你的意思是……',ex:"So what you're saying is we push the launch?",exc:'所以你的意思是推迟上线？',n:'复述确认，专业感+安全感双拉满'},
  {x:"Just to make sure I got it right, ...",c:'确认下我理解得对不对……',ex:"Just to make sure I got it right—the budget stays the same?",exc:'确认下我没理解错——预算不变对吧？',n:'会后邮件也用这句开头'},
  {x:"Could you elaborate on that?",c:'能展开讲讲吗？',ex:"Interesting—could you elaborate on that a bit?",exc:'有意思——能稍微展开讲讲吗？',n:'既是没懂的补救，也是捧场的深挖'},
  {x:"Let me get back to you on that.",c:'这个让我回头答复你',ex:"Good question—let me get back to you on that this afternoon.",exc:'好问题——今天下午我回复你',n:'答不上来的体面出口，说了必须做到'}]},
 {t:'quiz',h:'求生检验',qs:[
  {q:'对方说了个模糊的词，追问用?',opts:["What do you mean by that exactly?","What is your talking?","Mean what you?","I no understand your word."],a:"What do you mean by that exactly?"},
  {q:'复述确认的句式?',opts:["So what you're saying is...","So I say to you...","You say what so...","Saying so what is..."],a:"So what you're saying is..."},
  {q:'当场答不上来，体面出口?',opts:["Let me get back to you on that.","I don't know anything.","Ask someone else.","No comment forever."],a:"Let me get back to you on that."}]},
 {t:'task',h:'开口任务',p:['三级求生梯各说2遍，速度拉快——求生句必须比问题快。','看一段英文视频，暂停后用 So what you\'re saying is... 复述——每天一次，听力口语双修。']}]},

{id:'e47',day:47,week:7,weekTitle:'工作英语实战',title:'邮件与安排：async 沟通',sub:'follow up / touch base / EOD 黑话解码',mins:14,steps:[
 {t:'intro',h:'美国职场邮件的高频骨架',p:['邮件三段式：**Just following up on...**(跟进一下…) + 正文一句话 + **Let me know if...**(如果…请告诉我)','时间黑话解码：**EOD**(end of day今天之内) / **EOW**(本周内) / **ASAP**(尽快) / **by COB**(下班前)','约时间神句：**Does Thursday work for you?**(周四行吗) / **I\'m flexible.**(我时间灵活)'],tip:'美式邮件越短越专业。三句话解决的事写五句，对方已经在皱眉了。'},
 {t:'chunks',h:'邮件语块',sub:'拼装即用',items:[
  {x:"Just following up on...",c:'跟进一下……',ex:"Just following up on the proposal I sent Monday.",exc:'跟进下我周一发的方案',n:'📍催人不伤人的标准开头，全美邮箱每天百万次'},
  {x:"Let me know if that works.",c:'行不行告诉我一声',ex:"I suggested 3 PM—let me know if that works.",exc:'我提议下午3点——行不行说一声',n:'邮件万能结尾'},
  {x:"Let's touch base next week.",c:'咱们下周碰一下',ex:"Let's touch base next week once the data is in.",exc:'等数据出来咱们下周碰一下',n:'touch base=简短同步，棒球典故'},
  {x:"Can we hop on a quick call?",c:'能快速通个话吗？',ex:"Easier to explain live—can we hop on a quick call?",exc:'口头说更快——能快速通个话吗？',n:'打字说不清时的救场句'},
  {x:"I'll send it over by EOD.",c:'我今天之内发给你',ex:"Almost done—I'll send it over by EOD.",exc:'快好了——今天之内发你',n:'send over=发过去；EOD=end of day'},
  {x:"Does Thursday work for you?",c:'周四你方便吗？',ex:"Does Thursday at 2 work for you?",exc:'周四2点你方便吗？',n:'work=时间合适，约时间标准句'}]},
 {t:'quiz',h:'黑话解码测',qs:[
  {q:'EOD 指?',opts:['今天下班/结束前','本月底','马上','明天早上'],a:'今天下班/结束前'},
  {q:'「跟进一下上周的报价」邮件开头?',opts:["Just following up on last week's quote.","I chase you for quote.","Where is my quote answer?","Quote! Remember?"],a:"Just following up on last week's quote."},
  {q:'touch base 意思是?',opts:['简短同步一下','触摸基地','建立基础','碰运气'],a:'简短同步一下'}]},
 {t:'task',h:'开口任务',p:['口头拟一封三句邮件（说出来）：Just following up on... + 一句正文 + Let me know if that works.','再约一个时间：Does ___ work for you? I\'m flexible.——你的英文邮件从此有骨架。']}]},

{id:'e48',day:48,week:7,weekTitle:'工作英语实战',title:'客户电话全流程实战',sub:'从接通到挂断的完整剧本',mins:15,steps:[
 {t:'intro',h:'电话英语：最怕也最练人的场景',p:['没有表情和手势，电话是听说的终极考场——也是涨最快的地方。','接通模板：**Hi, this is Kenny from...**(我是…的Kenny) → **Is now a good time?**(现在方便吗)','挂断模板：**I\'ll let you go.**(不耽误你了) → **Thanks for your time.**(感谢你的时间)——美式挂电话有仪式感，直接bye很生硬。'],tip:"I'll let you go 字面「我放你走」，实际「咱收尾吧」——高频到听不懂会以为对方赶你。"},
 {t:'chunks',h:'电话语块',sub:'接通/中场/收尾',items:[
  {x:"Hi, this is Kenny from...",c:'你好，我是……的Kenny',ex:"Hi, this is Kenny from the consulting team.",exc:'你好，我是咨询团队的Kenny',n:'📍电话自报家门用 this is，不用 I am'},
  {x:"Is now a good time?",c:'现在方便说话吗？',ex:"Is now a good time, or should I call back?",exc:'现在方便吗，还是我晚点再打？',n:'call back=回拨；礼貌开局'},
  {x:"I'm calling about...",c:'我打来是关于……',ex:"I'm calling about the renewal coming up next month.",exc:'我打来是关于下个月的续约',n:'开门见山第二句'},
  {x:"Sorry, you cut out for a second.",c:'抱歉你刚才断了一下',ex:"Sorry, you cut out for a second—could you repeat that?",exc:'抱歉刚断了下——能重复一遍吗？',n:'信号救场，实际也是没听懂的完美掩护'},
  {x:"I'll let you go.",c:'那不耽误你了',ex:"Anyway, I'll let you go—thanks so much for your time.",exc:'那就不耽误你了——非常感谢你的时间',n:'挂电话仪式第一步'},
  {x:"Sounds like a plan.",c:'就这么办',ex:"Next Tuesday then—sounds like a plan.",exc:'那就下周二——就这么办',n:'电话敲定事项的收尾扣'}]},
 {t:'dialog',h:'客户电话实战',sub:'完整走一遍：接通→正题→收尾',lang:'en-US',mode:'role',you:'你',lines:[
  {sp:'你',x:"Hi, this is Kenny from the Salesforce team. Is now a good time?",c:'你好，我是Salesforce团队的Kenny。现在方便吗？',n:'自报家门+礼貌确认'},
  {sp:'客户',x:"Hey Kenny! Sure, I've got a few minutes.",c:'嘿Kenny！可以，我有几分钟'},
  {sp:'你',x:"Great. I'm calling about the dashboard updates—we're on track to deliver by Friday.",c:'好的。我打来是关于仪表盘更新——我们按计划周五交付',n:'正题+状态灯，第44课学以致用'},
  {sp:'客户',x:"That's great news. Anything you need from us?",c:'好消息。需要我们做什么吗？'},
  {sp:'你',x:"Just the final logo files—if you could send those over by EOD Thursday, we're all set.",c:'就差最终logo文件——周四之内发我们就齐了',n:"all set=全部就绪，美式高频"},
  {sp:'客户',x:"Done. Anything else?",c:'没问题。还有别的吗？'},
  {sp:'你',x:"That's it! I'll let you go—thanks so much for your time.",c:'就这些！不耽误你了——非常感谢',n:'仪式感收尾，完美挂断'}]},
 {t:'quiz',h:'电话礼仪测',qs:[
  {q:'电话里自我介绍说?',opts:["This is Kenny from the team.","I am Kenny body.","Kenny here is me.","My name calls Kenny."],a:"This is Kenny from the team."},
  {q:"客户说 I'll let you go 意思是?",opts:['准备结束通话了','要放你假','让你离职','放你出去'],a:'准备结束通话了'},
  {q:'「你刚才信号断了一下」?',opts:["You cut out for a second.","You are broken.","Your voice died.","Signal you lost."],a:"You cut out for a second."}]},
 {t:'task',h:'开口任务',p:['完整自演一通2分钟客户电话：自报家门→Is now a good time→正题汇报→约定→I\'ll let you go收尾。','对着手机录音听回放——电话英语的进步全靠回放。']}]},

{id:'e49',day:49,week:7,weekTitle:'工作英语实战',title:'第7周整合 · 职场英语全流程',sub:'开会+汇报+讲解+电话 综合验收',mins:15,steps:[
 {t:'intro',h:'整合：职场英语作战地图',p:['本周装备复盘：会议开场(dive in) + 状态汇报(on track/blocked) + 讲人话(Basically/Think of it as) + 求生术(So what you\'re saying is) + 邮件(following up) + 电话全流程。','这套组合就是Salesforce顾问的一天——你的职业英语从「能应付」升级到「能主导」。','今天验收：一场完整的项目会议。'],tip:'职场英语的本质是流程感：每个场景都有剧本，背熟剧本就有从容。'},
 {t:'dialog',h:'综合实战：项目周会',sub:'你是汇报主角',lang:'en-US',mode:'role',you:'你',lines:[
  {sp:'经理',x:"Alright, let's dive in. Kenny, where are we on the migration?",c:'好，进入正题。Kenny，迁移进展如何？'},
  {sp:'你',x:"We're on track overall—about 80 percent done. I'm blocked on one thing though: still waiting on admin access from the client side.",c:'整体按计划——完成约80%。不过我卡在一件事上：还在等客户那边的管理员权限',n:'状态灯+卡点，标准汇报'},
  {sp:'经理',x:"OK. What's the impact if that slips?",c:'好。如果这事拖了影响是什么？',n:'slip=延误'},
  {sp:'你',x:"Basically, testing gets pushed a week. Just to give you a heads-up, that could affect the launch date.",c:'简单说，测试推迟一周。先打个预防针，可能影响上线日期',n:'Basically+heads-up，简化与预警'},
  {sp:'经理',x:"Got it. Can you follow up with them today?",c:'明白。你今天能跟进他们一下吗？'},
  {sp:'你',x:"Already on it—I'll hop on a quick call this afternoon and send an update by EOD.",c:'已经在办了——下午快速通个电话，今天之内发更新',n:'already on it=已在处理，靠谱人设三件套'},
  {sp:'经理',x:"Perfect. Sounds like a plan.",c:'完美。就这么办'}]},
 {t:'quiz',h:'第7周通关测',qs:[
  {q:'汇报「整体正常但卡在权限」?',opts:["We're on track, but I'm blocked on access.","All good but stop by access.","Track on, access no.","We are OK but access is dead."],a:"We're on track, but I'm blocked on access."},
  {q:'「今天之内发更新给你」?',opts:["I'll send an update by EOD.","I send update today maybe.","Update goes you tonight.","EOD update you receive."],a:"I'll send an update by EOD."},
  {q:'给客户简化讲解开头用?',opts:["Basically, ...","Complicatedly, ...","In tech words, ...","Listen hard, ..."],a:"Basically, ..."},
  {q:'👂听汇报',audio:{x:"We're slightly behind, but nothing critical. Next up is user testing.",lang:'en-US'},opts:['略滞后但不严重，下一步用户测试','严重滞后要取消','完全正常已上线','被彻底卡住了'],a:'略滞后但不严重，下一步用户测试'},
  {q:'already on it 意思是?',opts:['已经在处理了','已经在上面了','马上上线','早就知道'],a:'已经在处理了'}]},
 {t:'task',h:'本周输出任务',p:['3分钟模拟周会：开场寒暄→dive in→用状态灯汇报你的真实一周→一个heads-up→sounds like a plan收尾。','把这场会录下来。这是你英文职场人格的第一份录音简历。']}]},

{id:'e50',day:50,week:8,weekTitle:'生活办事英语',title:'电话预约：诊所/餐厅/理发',sub:'I\'d like to make an appointment',mins:14,steps:[
 {t:'intro',h:'办事英语第一关：打电话预约',p:['万能预约开场：**I\'d like to make an appointment for...**(我想预约…)/ 餐厅版：**I\'d like to make a reservation.**','必被问三连：**What day works for you?**(哪天方便) / **Morning or afternoon?** / **Can I get your name and number?**(留个姓名电话)','改约取消：**I need to reschedule.**(我要改期) / **I have to cancel.**——第33课的rain check是朋友版，这是正式版。'],tip:'appointment=服务类预约（医生/理发），reservation=占位类预约（餐厅/酒店）——用混了也能懂，用对了很地道。'},
 {t:'chunks',h:'预约语块',sub:'打电话前先过一遍',items:[
  {x:"I'd like to make an appointment.",c:'我想预约（服务）',ex:"Hi, I'd like to make an appointment for a haircut.",exc:'你好，我想预约剪发',n:'📍诊所/理发/维修通用开场'},
  {x:"Do you have anything earlier?",c:'有更早的时间吗？',ex:"Hmm, do you have anything earlier in the week?",exc:'嗯，本周有更早的时段吗？',n:'砍时间专用句'},
  {x:"A table for two at seven, please.",c:'7点两位，谢谢',ex:"Could I get a table for two at seven, please?",exc:'能订7点两个人的位子吗？',n:'餐厅订位公式：人数+时间'},
  {x:"I need to reschedule.",c:'我需要改期',ex:"Sorry, I need to reschedule my Thursday appointment.",exc:'抱歉，我周四的预约要改期',n:'正式改约动词，工作生活两用'},
  {x:"Under what name?",c:'用哪个名字（订的）？',ex:"—I have a reservation. —Under what name?",exc:'——我有预约 ——登记的名字是？',n:'到店核对身份必听句'},
  {x:"It's under Kenny.",c:'用Kenny的名字订的',ex:"Reservation for seven—it's under Kenny.",exc:'订了7点的位——名字是Kenny',n:'under+名字＝以某名登记，超高频'}]},
 {t:'dialog',h:'电话订位实战',sub:'给餐厅打电话',lang:'en-US',mode:'role',you:'你',lines:[
  {sp:'店员',x:"Thanks for calling Luigi's, how can I help you?",c:'感谢致电Luigi餐厅，需要什么帮助？'},
  {sp:'你',x:"Hi! I'd like to make a reservation for two, this Saturday at seven.",c:'你好！我想订这周六7点两位',n:'一句话给齐人数+日期+时间，店员最爱'},
  {sp:'店员',x:"Let me check... we have 7:30, does that work?",c:'我看下……有7:30的，可以吗？'},
  {sp:'你',x:"7:30 works. ",c:'7:30可以',n:'works=时间OK，第47课复用'},
  {sp:'店员',x:"Great. Under what name?",c:'好的。用什么名字？'},
  {sp:'你',x:"It's under Kenny. K-E-N-N-Y.",c:'Kenny。K-E-N-N-Y',n:'电话里主动拼写，美国电话文化默认动作'},
  {sp:'店员',x:"Perfect, see you Saturday!",c:'好，周六见！'}]},
 {t:'quiz',h:'预约检验',qs:[
  {q:'预约剪发说?',opts:["I'd like to make an appointment for a haircut.","I want cut hair meeting.","Book my head please.","Reservation hair now."],a:"I'd like to make an appointment for a haircut."},
  {q:'店员问 Under what name? 你答?',opts:["It's under Kenny.","I am under table.","Name is secret.","Under nobody."],a:"It's under Kenny."},
  {q:'餐厅订位用哪个词?',opts:['reservation','appointment','subscription','commitment'],a:'reservation'}]},
 {t:'task',h:'开口任务',p:['完整自演一通订位电话：I\'d like to... → 应对时间调整 → Under Kenny + 拼写你的名字。','把自己名字的英文拼读练到2秒内说完——这是所有电话场景的基本功。']}]},

{id:'e51',day:51,week:8,weekTitle:'生活办事英语',title:'银行与支付：卡刷不过怎么办',sub:'checking account / declined / split the bill',mins:14,steps:[
 {t:'intro',h:'钱的英语：出错时最需要',p:['美国账户双件套：**checking account**(活期/日常卡) / **savings account**(储蓄)。开户、转账都绕不开。','刷卡被拒场景：**My card got declined.**(卡被拒了)——店员会说 **It didn\'t go through.**(没刷过去) → 你回 **Let me try another card.**','分账文化：**Let\'s split it.**(平摊) / **Separate checks, please.**(分开结)——美国餐厅默认支持。'],tip:'declined 不丢人，美国人自己天天遇到（额度/防盗锁/磁条问题）——从容换卡就是本地人姿态。'},
 {t:'chunks',h:'金钱语块',sub:'账户/支付/分账',items:[
  {x:"I'd like to open a checking account.",c:'我想开个活期账户',ex:"Hi, I'd like to open a checking account.",exc:'你好，我想开一个日常账户',n:'📍银行柜台第一句'},
  {x:"My card got declined.",c:'我的卡被拒了',ex:"Weird, my card got declined—let me try another one.",exc:'奇怪，卡被拒了——我试试另一张',n:'weird=奇怪，先甩给系统再换卡，姿态从容'},
  {x:"It didn't go through.",c:'（交易）没成功',ex:"Sorry, it didn't go through. Wanna try tapping?",exc:'抱歉没刷过去。要试试感应支付吗？',n:'tap=拍卡感应支付，美国已普及'},
  {x:"Let's split it.",c:'咱们平摊吧',ex:"Dinner's on us? No no, let's split it.",exc:'你们请？不不，平摊吧',n:'on us/on me=我们/我请客'},
  {x:"Separate checks, please.",c:'请分开结账',ex:"Could we do separate checks, please?",exc:'能分开结吗？',n:'点单时提前说，服务员更方便'},
  {x:"Do you take Apple Pay?",c:'你们收Apple Pay吗？',ex:"Do you guys take Apple Pay?",exc:'你们支持Apple Pay吗？',n:'take=接受某支付方式'}]},
 {t:'quiz',h:'金钱检验',qs:[
  {q:'卡刷不过，店员会说?',opts:["It didn't go through.","Your money is dead.","Card is angry.","No pass card."],a:"It didn't go through."},
  {q:'「咱们平摊」?',opts:["Let's split it.","Let's cut money.","Half you half me pay.","Divide the pay please."],a:"Let's split it."},
  {q:'日常刷卡消费用哪种账户?',opts:['checking account','savings account','retirement account','crypto wallet'],a:'checking account'}]},
 {t:'task',h:'开口任务',p:['自演刷卡被拒15秒剧：Weird, my card got declined—let me try another one. → Do you take Apple Pay?','再练分账双句：Let\'s split it. / Separate checks, please.——饭桌尊严句，务必脱口而出。']}]},

{id:'e52',day:52,week:8,weekTitle:'生活办事英语',title:'药房与看病：说清症状',sub:'I\'ve got a sore throat / something for a cold',mins:14,steps:[
 {t:'intro',h:'身体不适的英语自救包',p:['药房求药公式：**Do you have something for...?**(有治…的东西吗) + 症状名。','高频症状包：**a cold**(感冒)/**a sore throat**(嗓子疼)/**a headache**(头疼)/**an upset stomach**(肠胃不适)/**allergies**(过敏)','程度描述：**It\'s been three days.**(持续三天了) / **It\'s getting worse.**(在恶化)——医生最想听的两类信息。'],tip:'美国小病先去药房（pharmacy/drugstore），药剂师可以直接推荐OTC药——比预约医生快得多也便宜得多。'},
 {t:'chunks',h:'症状语块',sub:'药房柜台直接用',items:[
  {x:"Do you have something for a cold?",c:'有治感冒的药吗？',ex:"Hi, do you have something for a cold? Runny nose, cough.",exc:'你好，有感冒药吗？流鼻涕带咳嗽',n:'📍runny nose=流鼻涕；药剂师需要症状细节'},
  {x:"I've got a sore throat.",c:'我嗓子疼',ex:"I've got a sore throat—it's been two days.",exc:'嗓子疼——已经两天了',n:"I've got=I have 的口语形"},
  {x:"My stomach's been off.",c:'我肠胃一直不舒服',ex:"My stomach's been off since last night.",exc:'从昨晚开始肠胃就不对劲',n:'off=不在状态，万能不适词'},
  {x:"Is this stuff strong?",c:'这药劲儿大吗？',ex:"Is this stuff strong? Will it make me drowsy?",exc:'这药劲大吗？会犯困吗？',n:'drowsy=昏昏欲睡，服药前必问'},
  {x:"How often should I take it?",c:'多久吃一次？',ex:"How often should I take it—with food?",exc:'多久吃一次——随餐吗？',n:'用药三问之一'},
  {x:"I'm allergic to...",c:'我对……过敏',ex:"Just so you know, I'm allergic to penicillin.",exc:'提前说下，我对青霉素过敏',n:'保命句，就医购药都要主动说'}]},
 {t:'dialog',h:'药房实战',sub:'感冒了去CVS求药',lang:'en-US',mode:'role',you:'你',lines:[
  {sp:'药剂师',x:"Hi there, what can I help you with?",c:'你好，需要什么帮助？'},
  {sp:'你',x:"Hi, do you have something for a cold? I've got a sore throat and a cough.",c:'你好，有感冒药吗？我嗓子疼还咳嗽',n:'求药公式+两个症状'},
  {sp:'药剂师',x:"How long has it been going on?",c:'持续多久了？'},
  {sp:'你',x:"About three days. It's not getting worse, but it won't go away.",c:'三天左右。没恶化，但也不见好',n:"won't go away=一直不好，症状描述金句"},
  {sp:'药剂师',x:"This one should help. Take it twice a day with food.",c:'这个应该有用。一天两次随餐服用'},
  {sp:'你',x:"Got it. Will it make me drowsy? I've got work.",c:'明白。会犯困吗？我还得上班',n:'服药场景的最后一问'}]},
 {t:'quiz',h:'症状检验',qs:[
  {q:'「有治头疼的药吗?」',opts:["Do you have something for a headache?","Give me head medicine.","My head wants pills.","Headache drug where?"],a:"Do you have something for a headache?"},
  {q:'「会让我犯困吗?」',opts:["Will it make me drowsy?","Will I be sleep?","Does it tired me?","Sleepy pill or not?"],a:"Will it make me drowsy?"},
  {q:'「我对花生过敏」?',opts:["I'm allergic to peanuts.","Peanuts hate me.","I am dangerous peanuts.","Peanut is my enemy."],a:"I'm allergic to peanuts."}]},
 {t:'task',h:'开口任务',p:['组装你的「症状急救卡」：I\'ve got a ___. It\'s been ___ days. I\'m allergic to ___.——填真实信息说3遍。','这三句关键时刻是保命句——值得练到梦里都会。']}]},

{id:'e53',day:53,week:8,weekTitle:'生活办事英语',title:'租房与水电：公寓生存包',sub:'lease / utilities / The sink is leaking',mins:14,steps:[
 {t:'intro',h:'住的英语：租房+报修',p:['租房核心词：**lease**(租约)/**rent**(房租)/**deposit**(押金)/**utilities**(水电燃气)/**included**(包含在内)','看房必问：**Are utilities included?**(含水电吗) / **When is it available?**(什么时候能入住)','报修公式：**The ___ is leaking/broken/not working.**(…漏水/坏了/不工作了) + **Could you send someone to take a look?**(能派人来看看吗)'],tip:'美国租房水电常不含在房租里——Are utilities included 一句能帮你避开每月几十刀的惊喜。'},
 {t:'chunks',h:'住房语块',sub:'租房+报修双场景',items:[
  {x:"Are utilities included?",c:'水电费包含在内吗？',ex:"The rent looks good—are utilities included?",exc:'租金还行——含水电吗？',n:'📍看房第一问，省钱靠它'},
  {x:"When is it available?",c:'什么时候可以入住？',ex:"Nice place. When is it available?",exc:'房子不错。什么时候能住？',n:'available=可入住/可用'},
  {x:"I'd like to sign the lease.",c:'我想签租约',ex:"We'll take it—I'd like to sign the lease this week.",exc:'我们要了——这周就想签约',n:"We'll take it=我们定了（购物同款）"},
  {x:"The sink is leaking.",c:'水槽在漏水',ex:"Hi, the kitchen sink is leaking pretty bad.",exc:'你好，厨房水槽漏得挺厉害',n:'leaking=漏水，报修高频No.1'},
  {x:"The AC stopped working.",c:'空调不工作了',ex:"The AC stopped working last night.",exc:'空调昨晚罢工了',n:'stopped working=从能用变不能用'},
  {x:"Could you send someone to take a look?",c:'能派人来看看吗？',ex:"Could you send someone to take a look this week?",exc:'这周能派人来看看吗？',n:'报修的行动请求，配时限更有效'}]},
 {t:'quiz',h:'住房检验',qs:[
  {q:'看房问「含水电吗」?',opts:["Are utilities included?","Is water free gift?","Electric money who pay?","Utility have or no?"],a:"Are utilities included?"},
  {q:'「空调坏了，能派人来看看吗」?',opts:["The AC stopped working—could you send someone to take a look?","AC dead, human come see.","Fix air machine please someone.","AC no cold, look it."],a:"The AC stopped working—could you send someone to take a look?"},
  {q:'lease 是?',opts:['租约','钥匙','房东','押金'],a:'租约'}]},
 {t:'task',h:'开口任务',p:['自演一次完整报修电话：自报门牌 → The ___ is leaking/not working → It\'s been ___ days → Could you send someone...','把你家3样最可能坏的东西（sink/AC/heater）各说一遍报修句——有备无患。']}]},

{id:'e54',day:54,week:8,weekTitle:'生活办事英语',title:'退换货与投诉：有礼有力',sub:'I\'d like a refund / It doesn\'t fit',mins:14,steps:[
 {t:'intro',h:'维权英语：礼貌但不退让',p:['退货三件套：**I\'d like to return this.**(我想退货) + 原因 + **Do you have the receipt?**(有小票吗→Yes, right here.)','高频退货理由：**It doesn\'t fit.**(不合身)/**It stopped working.**(用两天坏了)/**It\'s not what I expected.**(和预期不符)','投诉升级链：先 **I\'m sure it\'s not your fault, but...**(我知道不怪你但…) → 不行再 **Could I speak to a manager?**(能找经理吗)'],tip:'美国退货文化极宽松，大方去退——但对店员保持友好：先免责再提要求，效率反而最高。'},
 {t:'chunks',h:'维权语块',sub:'退货/投诉全套',items:[
  {x:"I'd like to return this.",c:'我想退掉这个',ex:"Hi, I'd like to return this jacket.",exc:'你好，我想退这件夹克',n:'📍退货柜台第一句'},
  {x:"It doesn't fit.",c:'尺码不合适',ex:"It doesn't fit—do you have it in a medium?",exc:'不合身——有M码的吗？',n:'退货+换码一句流'},
  {x:"It stopped working after two days.",c:'用了两天就坏了',ex:"It stopped working after two days, so I'd like a refund.",exc:'用两天就坏了，我想退款',n:'refund=退款；exchange=换货'},
  {x:"Could I get store credit instead?",c:'可以换成店内抵扣吗？',ex:"No receipt? Could I get store credit instead?",exc:'没小票？那能给店内抵扣吗？',n:'store credit=店内代金额度，没小票的B方案'},
  {x:"I'm sure it's not your fault, but...",c:'我知道不是你的问题，但……',ex:"I'm sure it's not your fault, but I've been waiting an hour.",exc:'我知道不怪你，但我已经等了一小时',n:'先免责再投诉，美式高情商模板'},
  {x:"Could I speak to a manager?",c:'我能和经理谈谈吗？',ex:"I understand. Still, could I speak to a manager?",exc:'我理解。不过还是想和经理谈谈',n:'升级动作，语气平静杀伤力才大'}]},
 {t:'dialog',h:'退货实战',sub:'耳机用两天坏了，去退',lang:'en-US',mode:'role',you:'你',lines:[
  {sp:'店员',x:"Hi, how can I help you today?",c:'你好，需要什么帮助？'},
  {sp:'你',x:"Hi! I'd like to return these headphones. They stopped working after two days.",c:'你好！我想退这副耳机。用了两天就坏了',n:'诉求+理由，一句到位'},
  {sp:'店员',x:"Oh no, sorry about that. Do you have the receipt?",c:'哎呀抱歉。有小票吗？'},
  {sp:'你',x:"Yes, right here. I'd prefer a refund if possible.",c:'有，在这。可以的话我想要退款',n:"I'd prefer=我倾向于，明确诉求不含糊"},
  {sp:'店员',x:"No problem. It'll go back to your card in 3 to 5 business days.",c:'没问题。3-5个工作日退回你的卡',n:'business days=工作日'},
  {sp:'你',x:"Perfect, thanks so much!",c:'太好了，非常感谢！'}]},
 {t:'quiz',h:'维权检验',qs:[
  {q:'「我想退这个，两天就坏了」?',opts:["I'd like to return this—it stopped working after two days.","This bad thing, money back.","Return! It die two days.","Give refund because broken it."],a:"I'd like to return this—it stopped working after two days."},
  {q:'高情商投诉的开头?',opts:["I'm sure it's not your fault, but...","You are all terrible, and...","This is crime, so...","Listen here, worker..."],a:"I'm sure it's not your fault, but..."},
  {q:'store credit 是?',opts:['店内抵扣额度','商店信用卡','店员小费','会员积分'],a:'店内抵扣额度'}]},
 {t:'task',h:'开口任务',p:['自演完整退货：I\'d like to return... → 理由 → Yes, right here → I\'d prefer a refund.','再练一遍投诉模板：I\'m sure it\'s not your fault, but...——语气友好，立场坚定。']}]},

{id:'e55',day:55,week:8,weekTitle:'生活办事英语',title:'理发与健身房：服务场景',sub:'Just a trim / sign up / cancel my membership',mins:14,steps:[
 {t:'intro',h:'两个最容易翻车的服务场景',p:['理发是英语翻车重灾区——说错一个词头发两个月长不回来：**Just a trim.**(只修一修) / **Take a little off the sides.**(两边稍微剪短) / **Not too short.**(别太短)','健身房双场景：入会 **I\'d like to sign up.** / 退会 **I\'d like to cancel my membership.**——美国健身房退会难是全国性梗，话术要硬。','服务场景通用确认：**How much do I owe you?**(我该付多少)'],tip:'第一次剪发就三句：Just a trim + not too short + 出示照片。照片是跨语言的终极沟通。'},
 {t:'chunks',h:'服务语块',sub:'理发店+健身房',items:[
  {x:"Just a trim, please.",c:'只修一修就好',ex:"Nothing major—just a trim, please.",exc:'不大动——修一修就行',n:'📍nothing major=不做大改动；保命第一句'},
  {x:"Take a little off the sides.",c:'两边稍微剪短一点',ex:"Take a little off the sides, keep the top.",exc:'两边剪短点，顶上保留',n:'keep the top=顶部别动'},
  {x:"Not too short, please.",c:'请别剪太短',ex:"Not too short please—I regret it every time.",exc:'别太短——我每次剪短都后悔',n:'带点自嘲，理发师秒懂'},
  {x:"I'd like to sign up.",c:'我想报名/办卡',ex:"Hi, I'd like to sign up for a membership.",exc:'你好，我想办张会员卡',n:'sign up=注册加入，通用报名动词'},
  {x:"I'd like to cancel my membership.",c:'我想取消会员',ex:"I'd like to cancel my membership, effective this month.",exc:'我想取消会员，本月生效',n:'effective=生效；加时限防拖延'},
  {x:"How much do I owe you?",c:'我该付你多少？',ex:"All done? Great—how much do I owe you?",exc:'弄好了？太好了——多少钱？',n:'owe=欠；服务结账的自然问法'}]},
 {t:'quiz',h:'服务检验',qs:[
  {q:'理发保命句「只修一修」?',opts:["Just a trim, please.","Cut all my hair.","Make me new head.","Small hair please."],a:"Just a trim, please."},
  {q:'「我想取消会员」?',opts:["I'd like to cancel my membership.","Membership goodbye now.","Stop taking my money.","I quit your gym life."],a:"I'd like to cancel my membership."},
  {q:'How much do I owe you? 意思是?',opts:['我该付多少钱','你欠我多少','这个多重','你工资多少'],a:'我该付多少钱'}]},
 {t:'task',h:'开口任务',p:['理发三连练到丝滑：Just a trim + take a little off the sides + not too short.','再练健身房硬话术：I\'d like to cancel my membership, effective this month.——一口气说完不打磕。']}]},

{id:'e56',day:56,week:8,weekTitle:'生活办事英语',title:'第2月毕业 · 自我介绍2.0',sub:'办事英语验收 + 90秒升级版自我介绍',mins:15,steps:[
 {t:'intro',h:'第2月毕业：从对话者到生活者',p:['第1月你能点单问路；第2月你能**讲故事、亮观点、开会汇报、办事维权**——这是「游客英语」到「生活英语」的跨越。','毕业考两part：办事场景快反 + 升级版自我介绍（含职业、观点、近况——全是这月的装备）。','考完看第3月预告：社交深化+你的领域深聊+听力语感——最后一块高地。'],tip:'今天的自我介绍2.0会成为你的「英文名片」——之后每月迭代一次，五年后回看就是成长年轮。'},
 {t:'quiz',h:'毕业考 · 办事场景快反',qs:[
  {q:'电话订位：「周六7点两位」?',opts:["I'd like to make a reservation for two, Saturday at seven.","Two people Saturday seven give table.","Book two human Saturday.","Table Saturday for seven two."],a:"I'd like to make a reservation for two, Saturday at seven."},
  {q:'卡被拒了，从容应对?',opts:["Weird, let me try another card.","Call the police!","This store is broken.","I have no money goodbye."],a:"Weird, let me try another card."},

  {q:'👂听场景',audio:{x:"It didn't go through. Wanna try tapping instead?",lang:'en-US'},opts:['刷卡失败，建议试感应支付','商店要关门了','商品缺货','需要出示会员卡'],a:'刷卡失败，建议试感应支付'},
  {q:'退货：「不合身，有M码吗?」',opts:["It doesn't fit—do you have it in a medium?","Body wrong size change.","Medium me now.","This cloth hates my body."],a:"It doesn't fit—do you have it in a medium?"}]},
 {t:'intro',h:'🎓 第3月预告：深水区',p:['**◇ 社交深化**：从small talk到real talk，交真朋友的英语','**◇ 你的领域深聊**：职业故事、AI观点、投资理财——用英语输出你的思想','**◇ 听力语感**：缩读进阶、短语动词、习语幽默——听懂美国人的「话里话」','**◇ 毕业冲刺**：四大capstone+终极自我介绍'],tip:'第2月毕业快乐！今晚的任务只有一个：休息，和录下面这段。'},
 {t:'task',h:'毕业任务：自我介绍2.0',p:['录90秒英文自我介绍2.0，必须包含：职业一句(I work as...) + 近况一件(Actually, I just...) + 观点一个(The way I see it...) + 计划一句(I\'m gonna...)。','和第28天的1.0版对比——单词量可能没爆炸，但**结构和从容度**是两个人。这就是第2月的复利。']}]}
