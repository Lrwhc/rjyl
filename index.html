<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="日积月累">
<meta name="theme-color" content="#4F46E5">
<meta name="description" content="每天积累地道美语与实用日语，结合课程、场景词库与间隔复习。">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/app-icon-192.png">
<title>日积月累 · 英日双语</title>
<style>
:root{
  --bg:#F4F5F8; --card:#FFFFFF; --text:#1C2330; --sub:#69707D; --line:#E7E9EF;
  --brand:#4F46E5; --brand-soft:#EEF0FE;
  --jp:#C13E24; --jp-soft:#FCEEE9;
  --en:#2B5BD9; --en-soft:#EAF0FC;
  --ok:#2E9E6B; --ok-soft:#E7F5EE; --bad:#D64545; --bad-soft:#FBEBEB;
  --warn:#B7791F; --warn-soft:#FCF3E3;
  --radius:16px; --shadow:0 1px 3px rgba(20,24,40,.06),0 6px 18px rgba(20,24,40,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F1115; --card:#1A1D24; --text:#E9EBEF; --sub:#9AA1AC; --line:#2A2E38;
    --brand:#948DF5; --brand-soft:#252344;
    --jp:#F0684A; --jp-soft:#3A231D;
    --en:#5B85EE; --en-soft:#1D2A45;
    --ok:#4CBA88; --ok-soft:#1C3329; --bad:#E06868; --bad-soft:#3A2222;
    --warn:#D9A048; --warn-soft:#39301D;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans","Hiragino Kaku Gothic ProN","Segoe UI",Roboto,"Noto Sans CJK SC",sans-serif;
  font-size:16px; line-height:1.55;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
}
#app{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;}
.screen{flex:1;padding:14px 16px calc(86px + env(safe-area-inset-bottom));overflow-x:hidden;}
.topbar{padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.topbar h1{font-size:22px;font-weight:700;letter-spacing:.3px;}
.topbar .date{color:var(--sub);font-size:13px;}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px;}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;}
.tag.jp{background:var(--jp-soft);color:var(--jp);}
.tag.en{background:var(--en-soft);color:var(--en);}
.tag.ok{background:var(--ok-soft);color:var(--ok);}
.tag.brand{background:var(--brand-soft);color:var(--brand);}
.tag.warn{background:var(--warn-soft);color:var(--warn);}
.btn{display:block;width:100%;border:none;border-radius:14px;padding:14px;font-size:16px;font-weight:600;font-family:inherit;cursor:pointer;text-align:center;transition:transform .06s;}
.btn:active{transform:scale(.975);}
.btn.primary{background:var(--brand);color:#fff;}
.btn.jpbg{background:var(--jp);color:#fff;}
.btn.enbg{background:var(--en);color:#fff;}
.btn.ghost{background:transparent;color:var(--sub);border:1.5px solid var(--line);}
.btn.soft{background:var(--brand-soft);color:var(--brand);}
.btn.small{width:auto;display:inline-block;padding:8px 14px;font-size:14px;border-radius:10px;}
.btn[disabled]{opacity:.45;pointer-events:none;}
button:focus-visible,[role=button]:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px;}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important;}}
.rd.veil{cursor:pointer;}
.rd.veil .veiltx{display:none;}
.rd.veil .veiltip{opacity:.75;font-size:12px;border-bottom:1px dashed var(--sub);}
.rd.veil.open .veiltx{display:inline;}
.rd.veil.open .veiltip{display:none;}
.calgrid .d.half{background:linear-gradient(135deg,var(--ok-soft) 50%,var(--line) 50%);color:var(--sub);}
.row{display:flex;gap:10px;align-items:center;}
.row.between{justify-content:space-between;}
.muted{color:var(--sub);font-size:13px;}
h2{font-size:18px;margin-bottom:8px;}
h3{font-size:15px;margin-bottom:6px;}
/* ---- tab bar ---- */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--card);border-top:1px solid var(--line);display:flex;max-width:520px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom);}
.tabbar button{flex:1;background:none;border:none;padding:9px 0 7px;font-family:inherit;font-size:11px;color:var(--sub);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;}
.tabbar button.active{color:var(--brand);font-weight:700;}
.tabbar .ticon{font-size:21px;line-height:1;height:24px;display:flex;align-items:center;font-weight:600;}
/* ---- today ---- */
.hero{background:linear-gradient(135deg,var(--brand),#7C3AED);border-radius:20px;color:#fff;padding:18px;margin-bottom:14px;box-shadow:var(--shadow);}
.hero .big{font-size:26px;font-weight:800;}
.hero .sub{opacity:.85;font-size:13px;margin-top:2px;}
.streakbox{display:flex;gap:14px;margin-top:14px;}
.streakbox .item{background:rgba(255,255,255,.16);border-radius:12px;padding:8px 12px;flex:1;text-align:center;}
.streakbox .num{font-size:20px;font-weight:800;}
.streakbox .lab{font-size:11px;opacity:.85;}
.lessonrow{display:flex;align-items:center;gap:12px;padding:4px 0;}
.lessonrow .dot{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0;}
.lessonrow .dot.jp{background:var(--jp-soft);color:var(--jp);}
.lessonrow .dot.en{background:var(--en-soft);color:var(--en);}
.lessonrow .dot.rv{background:var(--brand-soft);color:var(--brand);}
.lessonrow .info{flex:1;min-width:0;}
.lessonrow .t{font-weight:650;font-size:15px;}
.lessonrow .s{color:var(--sub);font-size:12.5px;}
.check{color:var(--ok);font-size:20px;font-weight:800;}
/* ---- lesson list ---- */
.weekhead{font-size:13px;font-weight:700;color:var(--sub);margin:16px 4px 8px;text-transform:uppercase;letter-spacing:.4px;}
.lessonitem{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;margin-bottom:8px;cursor:pointer;}
.lessonitem .day{width:44px;height:44px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;font-weight:800;}
.lessonitem .day small{font-size:9px;font-weight:600;opacity:.8;}
.lessonitem.jp .day{background:var(--jp-soft);color:var(--jp);}
.lessonitem.en .day{background:var(--en-soft);color:var(--en);}
.lessonitem .t{font-weight:650;font-size:14.5px;}
.lessonitem .s{color:var(--sub);font-size:12px;}
.lessonitem.locked{opacity:.55;}
/* ---- player ---- */
.player{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;max-width:520px;margin:0 auto;}
.player .phead{padding:calc(10px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:10px;}
.player .phead .x{background:var(--card);border:none;width:44px;height:44px;border-radius:99px;font-size:17px;color:var(--sub);cursor:pointer;box-shadow:var(--shadow);flex:none;}
.player .phead .pt{flex:1;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pbar{height:4px;background:var(--line);border-radius:99px;margin:4px 16px 0;overflow:hidden;}
.pbar i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .25s;}
.pbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 20px;}
.pfoot{padding:10px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;background:var(--bg);}
.pfoot .btn{flex:1;}
/* ---- step content ---- */
.stepintro h2{font-size:20px;margin-bottom:10px;}
.stepintro p{margin-bottom:10px;font-size:15.5px;}
.stepintro b{color:var(--brand);}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13.5px;margin:10px 0;}
/* kana teach cards */
.kanagrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;}
.kanacard{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px 6px 10px;text-align:center;cursor:pointer;border:2px solid transparent;}
.kanacard.played{border-color:var(--jp);}
.kanacard .g{font-size:44px;font-weight:600;line-height:1.15;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;}
.kanacard .r{color:var(--jp);font-weight:700;font-size:14px;margin-top:2px;}
.kanacard .o{color:var(--sub);font-size:11.5px;margin-top:1px;}
/* phrase cards */
.phrase{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:14px;margin-bottom:10px;}
.phrase .jx{font-size:20px;font-weight:650;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;}
.phrase .ex{font-size:18.5px;font-weight:650;}
.phrase .rd{color:var(--jp);font-size:13px;margin-top:2px;}
.phrase .cn{color:var(--sub);font-size:14px;margin-top:4px;}
.phrase .nt{background:var(--brand-soft);color:var(--brand);border-radius:10px;padding:8px 10px;font-size:13px;margin-top:8px;}
.audiorow{display:flex;gap:8px;margin-top:10px;}
.abtn{border:none;border-radius:10px;padding:7px 13px;font-size:13.5px;font-weight:600;font-family:inherit;cursor:pointer;background:var(--jp-soft);color:var(--jp);}
.abtn.en{background:var(--en-soft);color:var(--en);}
.abtn.gray{background:var(--bg);color:var(--sub);}
/* dialog */
.dlgline{display:flex;gap:10px;margin-bottom:12px;}
.dlgline .who{width:30px;height:30px;border-radius:99px;background:var(--en-soft);color:var(--en);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0;margin-top:2px;}
.dlgline.you .who{background:var(--ok-soft);color:var(--ok);}
.dlgline .bub{background:var(--card);border-radius:4px 14px 14px 14px;box-shadow:var(--shadow);padding:10px 12px;flex:1;cursor:pointer;}
.dlgline .x{font-size:16.5px;font-weight:550;}
.dlgline .x.ja{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;}
.dlgline .rd{color:var(--jp);font-size:12.5px;margin-top:2px;}
.dlgline .cn{color:var(--sub);font-size:13px;margin-top:3px;}
.dlgline .nt{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:6px 9px;font-size:12.5px;margin-top:6px;}
.dlgline.hidden .bub{background:var(--ok-soft);}
.dlgline.playing .bub{outline:2px solid var(--en);}
/* quiz */
.quizq{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:18px;margin-bottom:12px;}
.quizq .qt{font-size:16px;font-weight:650;margin-bottom:4px;}
.quizq .qbig{font-size:46px;text-align:center;margin:10px 0;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
.opts.one{grid-template-columns:1fr;}
.opt{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:13px 8px;font-size:17px;font-weight:600;font-family:inherit;cursor:pointer;color:var(--text);}
.opt.ja{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;}
.opt.correct{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);}
.quiznav{text-align:center;color:var(--sub);font-size:13px;margin-top:6px;}
/* review */
.rvcard{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:26px 18px;text-align:center;margin-bottom:14px;min-height:210px;display:flex;flex-direction:column;justify-content:center;}
.rvcard .front{font-size:24px;font-weight:650;}
.rvcard .front.big{font-size:52px;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;}
.rvcard .back{margin-top:14px;border-top:1px dashed var(--line);padding-top:14px;}
.rvcard .ans{font-size:24px;font-weight:700;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;}
.rvcard .rd{color:var(--jp);font-size:14px;margin-top:3px;}
.rvcard .hint{color:var(--sub);font-size:13.5px;margin-top:6px;}
.gradebtns{display:flex;gap:9px;}
.gradebtns .btn{flex:1;padding:12px 4px;font-size:14.5px;}
.gradebtns .again{background:var(--bad-soft);color:var(--bad);}
.gradebtns .good{background:var(--brand-soft);color:var(--brand);}
.gradebtns .easy{background:var(--ok-soft);color:var(--ok);}
/* kana chart */
.kchart{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;}
.kchart .kc{background:var(--card);border-radius:12px;box-shadow:var(--shadow);text-align:center;padding:9px 2px;cursor:pointer;}
.kchart .kc .g{font-size:27px;font-weight:600;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;line-height:1.2;}
.kchart .kc .r{font-size:10.5px;color:var(--sub);}
.kchart .kc.learned{background:var(--jp-soft);}
.kchart .kc.empty{background:transparent;box-shadow:none;cursor:default;}
.seg{display:flex;background:var(--card);border-radius:12px;padding:4px;box-shadow:var(--shadow);margin-bottom:12px;}
.seg button{flex:1;border:none;background:none;padding:8px;border-radius:9px;font-family:inherit;font-size:14px;font-weight:600;color:var(--sub);cursor:pointer;}
.seg button.active{background:var(--brand);color:#fff;}
/* me/stats */
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px;}
.calgrid .d{aspect-ratio:1;border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--sub);}
.calgrid .d.on{background:var(--ok);color:#fff;font-weight:700;}
.calgrid .d.today{outline:2px solid var(--brand);}
.setrow{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);gap:10px;}
.setrow:last-child{border-bottom:none;}
.setrow select,.setrow input[type=range]{max-width:55%;}
select{font-family:inherit;font-size:14px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);}
textarea{width:100%;min-height:110px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-family:inherit;font-size:12px;padding:10px;}
/* done screen */
.donewrap{text-align:center;padding:40px 10px;}
.donewrap .emoji{font-size:64px;}
.donewrap h2{font-size:24px;margin:12px 0 6px;}
/* onboarding */
.overlay{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;padding:28px;max-width:520px;margin:0 auto;overflow-y:auto;}
.overlay>*{flex:none;}
.overlay::before,.overlay::after{content:'';flex:1 0 0;min-height:8px;}
.overlay h1{font-size:30px;margin-bottom:6px;}
.overlay .lead{color:var(--sub);margin-bottom:22px;font-size:15px;}
.feat{display:flex;gap:12px;margin-bottom:16px;align-items:flex-start;}
.feat .ic{font-size:24px;width:40px;height:40px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.feat .t{font-weight:650;font-size:15px;}
.feat .s{color:var(--sub);font-size:13px;}
.fade{animation:fade .3s ease;}
@keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.pilltip{background:var(--brand-soft);color:var(--brand);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px;}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* =====================================================
   日积月累 · 英日双语学习 App
   为 Kenny 定制 · 目标：英语圈/日本 生活场景流畅交流（美式表达标准）
   方法论：间隔重复 + 语块教学 + 影子跟读 + 情景任务
   ===================================================== */

/* ---------------- 安全存储层（版本化 + 自愈） ---------------- */
const APPV='2.0';
const DB=(()=>{
  const KEY='rjyl.v1';
  const SCHEMA=2;               // 数据结构版本：升级时在 migrate() 里写迁移
  let mem={},usable=false,corrupt=false,saveFailed=false;
  try{const t='__t'+1;window.localStorage.setItem(t,'1');window.localStorage.removeItem(t);usable=true;}catch(e){usable=false;}
  let data={};
  try{if(usable){const raw=window.localStorage.getItem(KEY);if(raw)data=JSON.parse(raw);}}
  catch(e){
    corrupt=true;
    try{const raw=window.localStorage.getItem(KEY);
      if(raw)window.localStorage.setItem('rjyl.recovery.'+Date.now(),raw.slice(0,900000));
    }catch(_){}
    data={};
  }
  function migrate(d){
    d=(d&&typeof d==='object'&&!Array.isArray(d))?d:{};
    const from=+d.schemaVersion||1;
    if(from<2){
      // v1→v2：picks.* 由 true 改为数字张数（旧值保留可读）；无破坏性变更
    }
    d.schemaVersion=SCHEMA;
    return d;
  }
  data=migrate(data);
  const save=()=>{
    try{if(usable)window.localStorage.setItem(KEY,JSON.stringify(data));saveFailed=false;}
    catch(e){
      if(!saveFailed){saveFailed=true;
        setTimeout(()=>{try{App.toast('⚠️ 进度保存失败（存储空间不足？）请尽快在「我的→导出进度」备份');}catch(_){}},400);
      }
    }
  };
  if(usable&&!corrupt)save(); // 落盘版本号
  return{
    get:(k,d)=>k in data?data[k]:d,
    set:(k,v)=>{data[k]=v;save();},
    del:k=>{delete data[k];save();},
    all:()=>data,
    replace:(obj)=>{data=migrate(obj||{});save();},
    persistent:usable,
    get corrupted(){return corrupt;},
    get saveFailed(){return saveFailed;},
    SCHEMA
  };
})();

/* ---------------- 日期工具 ---------------- */
const D={
  today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');},
  addDays(s,n){const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');},
  diff(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);},
  cnDate(){const d=new Date();return (d.getMonth()+1)+'月'+d.getDate()+'日 '+'周'+'日一二三四五六'[d.getDay()];}
};

/* ---------------- 语音引擎（iOS 适配） ---------------- */
const Speech=(()=>{
  const synth=window.speechSynthesis;
  let voices=[],ready=false,chain=null;
  function load(){if(!synth)return;voices=synth.getVoices()||[];if(voices.length)ready=true;}
  if(synth){load();synth.onvoiceschanged=load;}
  // Chrome 桌面版长句暂停 bug 的保险丝
  setInterval(()=>{try{if(synth&&synth.speaking&&synth.paused)synth.resume();}catch(e){}},3000);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});
  function pick(lang){
    load();
    const saved=DB.get('voice.'+lang,null);
    if(saved){const v=voices.find(v=>v.voiceURI===saved);if(v)return v;}
    const prefs=lang==='ja-JP'?['kyoko','o-ren','oren','hattori','otoya']:['samantha','ava','allison','nicky','zoe','joelle','susan','evan','nathan','alex','tom'];
    const pool=voices.filter(v=>v.lang&&v.lang.replace('_','-').toLowerCase().startsWith(lang.slice(0,2).toLowerCase()));
    const exact=pool.filter(v=>v.lang.replace('_','-').toLowerCase()===lang.toLowerCase());
    const cand=exact.length?exact:pool;
    for(const p of prefs){const v=cand.find(v=>v.name.toLowerCase().includes(p));if(v)return v;}
    return cand[0]||null;
  }
  function stop(){try{if(synth)synth.cancel();}catch(e){}chain=null;App.clearPlaying&&App.clearPlaying();}
  let errToastAt=0;
  function speak(text,lang,opts={}){
    if(!synth){App.toast('此浏览器不支持语音朗读');return;}
    try{synth.cancel();}catch(e){}
    const u=new SpeechSynthesisUtterance(text);
    u.lang=lang;
    const v=opts.voice||pick(lang);if(v){u.voice=v;u.lang=v.lang||lang;}
    const base=Math.min(1.2,Math.max(0.6,+DB.get('rate',0.95)||0.95));
    u.rate=opts.rateAbs?Math.min(1.6,Math.max(0.5,opts.rateAbs)):(opts.slow?Math.max(0.5,base*0.65):base);
    u.pitch=Math.min(1.6,Math.max(0.6,opts.pitch||1));
    let started=false,finished=false;
    const finish=()=>{if(finished)return;finished=true;if(opts.onend)opts.onend();};
    u.onstart=()=>{started=true;if(opts.onstart)opts.onstart();};
    u.onend=finish;
    u.onerror=e=>{
      const err=(e&&e.error)||'';
      if(err!=='interrupted'&&err!=='canceled'){
        const now=Date.now();
        if(now-errToastAt>4000){errToastAt=now;App.toast('朗读失败'+(err?'（'+err+'）':'')+'——检查静音键/音量，或到「我的」换个声音');}
      }
      finish(); // 出错也让播放序列继续走，不卡死
    };
    synth.speak(u);
    // 看门狗：4秒仍未开始视为引擎卡死（iOS 常见），取消并提示
    setTimeout(()=>{
      if(!started&&!finished){
        try{synth.cancel();}catch(_){}
        const now=Date.now();
        if(now-errToastAt>4000){errToastAt=now;App.toast('语音没有响应——iPhone 请确认已在系统设置里下载对应语音');}
        finish();
      }
    },4000);
    if(!ready)setTimeout(load,300);
  }
  function playSeq(items,onHighlight,onDone){
    // items: [{x,lang,slow,voice,pitch,rateAbs,gap}]
    stop();
    let i=0;const token={};chain=token;
    const next=()=>{
      if(chain!==token)return;
      if(i>=items.length){onHighlight&&onHighlight(-1);onDone&&onDone();return;}
      const it=items[i];onHighlight&&onHighlight(i);
      speak(it.x,it.lang,{slow:it.slow,voice:it.voice,pitch:it.pitch,rateAbs:it.rateAbs,onend:()=>{i++;setTimeout(next,it.gap||520);}});
    };
    next();
  }
  function voiceList(lang){load();return voices.filter(v=>v.lang&&v.lang.replace('_','-').toLowerCase().startsWith(lang.toLowerCase()));}
  function hasLang(lang){load();return voices.some(v=>v.lang&&v.lang.replace('_','-').toLowerCase().startsWith(lang.toLowerCase()));}
  /* 口音库：检测本机可用的英语口音声音（iOS 可在 设置→辅助功能→朗读内容→声音 添加更多） */
  const ACCENTS=[['en-US','🇺🇸 美音'],['en-GB','🇬🇧 英音'],['en-AU','🇦🇺 澳音'],['en-IN','🇮🇳 印度音'],['en-IE','🇮🇪 爱尔兰音'],['en-ZA','🇿🇦 南非音'],['en-NZ','🇳🇿 新西兰音']];
  function accentVoices(){
    load();const out=[];
    ACCENTS.forEach(([code,label])=>{
      const pool=voices.filter(v=>v.lang&&v.lang.replace('_','-').toLowerCase()===code.toLowerCase());
      if(pool.length)out.push({code,label,voice:pool.find(v=>!/eloquence|compact/i.test(v.name))||pool[0]});
    });
    return out;
  }
  /* 同语言取多个不同声音（多说话人对话用） */
  function altVoices(langPrefix,n){
    load();
    const seen=new Set();const out=[];
    voices.filter(v=>v.lang&&v.lang.replace('_','-').toLowerCase().startsWith(langPrefix.toLowerCase()))
      .forEach(v=>{const k=v.name.replace(/\s*\(.*\)/,'');if(!seen.has(k)&&!/eloquence/i.test(v.name)){seen.add(k);out.push(v);}});
    return out.slice(0,n||4);
  }
  return{speak,stop,playSeq,pick,voiceList,hasLang,accentVoices,altVoices,get voices(){load();return voices;}};
})();

/* ---------------- 环境噪声引擎（WebAudio 合成，无需素材文件） ---------------- */
const Noise=(()=>{
  let ctx=null,nodes=null,cur='off';
  function build(type){
    const sr=ctx.sampleRate,len=2*sr;
    const buf=ctx.createBuffer(1,len,sr);const d=buf.getChannelData(0);
    let last=0;
    for(let i=0;i<len;i++){const w=Math.random()*2-1;last=(last+0.02*w)/1.02;d[i]=last*3.5;}
    const src=ctx.createBufferSource();src.buffer=buf;src.loop=true;
    const f=ctx.createBiquadFilter();
    const g=ctx.createGain();
    if(type==='cafe'){f.type='bandpass';f.frequency.value=750;f.Q.value=0.6;g.gain.value=0.16;}
    else if(type==='station'){f.type='lowpass';f.frequency.value=420;g.gain.value=0.22;}
    else{f.type='highpass';f.frequency.value=300;g.gain.value=0.12;} // street
    // 人群起伏感：慢速LFO调制音量
    const lfo=ctx.createOscillator(),lg=ctx.createGain();
    lfo.frequency.value=type==='station'?0.13:0.21;lg.gain.value=g.gain.value*0.45;
    lfo.connect(lg);lg.connect(g.gain);
    src.connect(f);f.connect(g);g.connect(ctx.destination);
    src.start();lfo.start();
    return {src,lfo};
  }
  function set(type){
    stop();
    if(!type||type==='off'){cur='off';return;}
    try{
      ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
      if(ctx.state==='suspended')ctx.resume();
      nodes=build(type);cur=type;
    }catch(e){cur='off';try{App.toast('此设备不支持环境音');}catch(_){}}
  }
  function stop(){
    if(nodes){try{nodes.src.stop();nodes.lfo.stop();}catch(e){}nodes=null;}
    cur='off';
  }
  return{set,stop,get cur(){return cur;}};
})();

/* ---------------- 间隔重复 SRS（学习步骤 + 新卡预算 + 顽固卡） ---------------- */
const SRS=(()=>{
  const IV=[1,2,4,7,15,30,60,120];   // 复习期间隔（天）
  const LSTEP=[1,3];                 // 学习步骤：首次→+1天→+3天→毕业(+7天)
  function state(){return DB.get('srs',{});}
  function saveState(s){DB.set('srs',s);}
  function addCards(cards){
    const s=state();let n=0;
    cards.forEach(c=>{if(!s[c.id]){s[c.id]={lv:0,due:D.addDays(D.today(),1),lapses:0,lrn:0,rep:0};n++;}});
    saveState(s);return n;
  }
  function isNew(st){return !(st.rep>0)&&!(st.lv>0)&&!(st.lapses>0);}
  function newCap(){const v=+DB.get('newCap',10);return v>=999?Infinity:(v||10);}
  function dueAll(){
    const s=state(),t=D.today();
    return Object.keys(s).filter(id=>s[id].due<=t&&CardIndex[id]).map(id=>({id,card:CardIndex[id],st:s[id]}));
  }
  /* 到期 = 全部旧卡 + 预算内的新卡（防止整课新卡一天涌入） */
  function due(){
    const all=dueAll();
    const seen=all.filter(x=>!isNew(x.st));
    const fresh=all.filter(x=>isNew(x.st)).sort((a,b)=>((b.st.hot||0)-(a.st.hot||0))||(a.st.due<b.st.due?-1:1));
    const introduced=+DB.get('intro.'+D.today(),0);
    const room=Math.max(0,newCap()-introduced);
    return seen.concat(fresh.slice(0,room));
  }
  function newWaiting(){const all=dueAll();return Math.max(0,all.filter(x=>isNew(x.st)).length-Math.max(0,newCap()-(+DB.get('intro.'+D.today(),0))));}
  function grade(id,g){ // g: 0忘了 1记得 2轻松
    const s=state();const st=s[id];if(!st)return;
    if(isNew(st)){const k='intro.'+D.today();DB.set(k,(+DB.get(k,0))+1);} // 记入今日新卡预算
    st.rep=(st.rep||0)+1;
    const inLearn=st.lrn!==undefined&&st.lrn!==null;
    if(g===0){
      st.lapses=(st.lapses||0)+1;
      st.lrn=0;st.lv=0;st.due=D.addDays(D.today(),1); // 重新走学习步骤
    }else if(inLearn){
      if(g===2||st.lrn>=LSTEP.length){ // 轻松直接毕业 / 步骤走完毕业
        delete st.lrn;st.lv=3;st.due=D.addDays(D.today(),IV[3]); // +7天
      }else{
        st.due=D.addDays(D.today(),LSTEP[st.lrn]);st.lrn++;
      }
    }else{
      st.lv=Math.min(IV.length-1,(st.lv||0)+(g===2?2:1));
      st.due=D.addDays(D.today(),IV[st.lv]);
    }
    saveState(s);
  }
  function isLeech(st){return (st.lapses||0)>=4;}
  function stats(){
    const s=state();const ids=Object.keys(s).filter(id=>CardIndex[id]);
    return{total:ids.length,due:due().length,mature:ids.filter(id=>s[id].lv>=4).length,
      leech:ids.filter(id=>isLeech(s[id])).length,newWaiting:newWaiting()};
  }
  return{addCards,due,grade,stats,isLeech,newCap};
})();

  'た行藏着两个特殊读音：**ち 读 chi**（"七"），**つ 读 tsu**——这是中国人最容易卡的音：先发"ts"（像"次"的声母）再接 u，短促干净。多听几遍音频找感觉。',
  '浊音版：ぢ・づ 与 じ・ず 同音，现代日语里极少用，认识即可。',
  '今天开始学**指着买东西**——哪怕只会假名，有这句就能在日本活下来。'],
  tip:'つ 发不好完全不影响交流，先过，两周后回头再磨。'},
 {t:'kana',h:'た行 + だ行',rows:[hrow('た行'),hdrow('だ行')]},
 {t:'phrases',h:'购物生存句',items:[
  {j:'これをください',r:'kore o kudasai',c:'请给我这个',n:'**指着任何东西说这句 = 全日本通用购物**。これ=这个（近处），それ=那个（对方那边），あれ=那个（都远）。'},
  {j:'それをください',r:'sore o kudasai',c:'请给我那个（你旁边的）'},
  {j:'これはなんですか',r:'kore wa nan desu ka',c:'这是什么？',n:'好奇心句型。「〜は なんですか」= …是什么？注意 は 作助词读 **wa**。'}]},
 {t:'quiz',gen:'kana',pool:rp([hrow('さ行'),hrow('た行'),hdrow('だ行')]),n:6},
 {t:'task',h:'今日开口任务',p:['环顾房间，指着 3 样东西，每样说一遍「**これをください**」。','进阶：指着远处的东西说「**それをください**」。']}]},

{id:'j05',day:5,week:1,weekTitle:'发音地基与打招呼',title:'な行 · 自我介绍',sub:'第一次说出完整的自我介绍',mins:13,steps:[
 {t:'intro',h:'今天你将第一次"说日语"',p:[
  'な行没有陷阱，5个音干干净净。省下的力气用来学**自我介绍**——今天结束，你就能用日语介绍自己了。',
  '句型解剖：「わたし**は** ケニー**です**」。は(读wa) = 主题标记"要说的是…"；です = "是"（礼貌收尾）。这是日语第一句型，以后无数句子都是它的变体。'],
  tip:'名字用中文名也完全 OK：わたしは Kenny です。日本人对外国名字很宽容。'},
 {t:'kana',h:'な行',rows:[hrow('な行')]},
 {t:'phrases',h:'自我介绍三连',items:[
  {j:'はじめまして',r:'hajimemashite',c:'初次见面',n:'见新朋友的固定开场白。'},
  {j:'わたしはケニーです',r:'watashi wa Kenī desu',c:'我是 Kenny',n:'替换名字就是你的句子。わたし=我；口语中男性也常用「ぼく」。'},
  {j:'よろしくおねがいします',r:'yoroshiku onegai shimasu',c:'请多关照',n:'自我介绍的**固定收尾**，不说反而奇怪。这句没有完美中文对应——它表达"今后交往拜托了"的善意。'}]},
 {t:'quiz',gen:'kana',pool:rp([hrow('た行'),hrow('な行')]),n:5},
 {t:'task',h:'今日开口任务',p:['把三句连起来，完成你的第一个日语自我介绍：','**はじめまして。わたしはケニーです。よろしくおねがいします。**','对着镜子说 3 遍，最后一遍鞠个躬（15度就好）——身体记忆是最强的记忆。']}]},

{id:'j06',day:6,week:1,weekTitle:'发音地基与打招呼',title:'は行ば行ぱ行 · 问价钱',sub:'一次三行 + いくらですか',mins:14,steps:[
 {t:'intro',h:'半浊音：は行的第二段变身',p:[
  'は行今天一次给你三个版本：**は(ha)** → 加浊点 **ば(ba)** → 加小圆圈（**゜半浊点**）**ぱ(pa)**。全五十音里只有は行有半浊音，物以稀为贵。',
  '注意：**ふ 读 fu**，但嘴唇不咬（不像英语f），像轻轻吹蜡烛的气音。',
  '还记得吗：こんにち**は** 的 は 读 wa——因为它是助词。は行假名作助词时读 wa，这个规律今天正式记住。'],
  tip:'ば行/ぱ行 分不清时摸喉咙：ば 声带先震，ぱ 是爆破后才震。'},
 {t:'kana',h:'は行 + ば行 + ぱ行',rows:[hrow('は行'),hdrow('ば行'),hdrow('ぱ行')]},
 {t:'phrases',h:'钱的事情要问清',items:[
  {j:'いくらですか',r:'ikura desu ka',c:'多少钱?',n:'配合手指：これ、いくらですか（这个多少钱）。日语疑问句**句尾加か**，不用改语序——比英语省心。'},
  {j:'カードでおねがいします',r:'kādo de onegai shimasu',c:'麻烦刷卡',n:'で = 表示手段/方式（"用…"）。现金则说「げんきんで」。日本越来越多店支持刷卡，但乡下仍常要现金。'},
  {j:'ふくろをください',r:'fukuro o kudasai',c:'请给我袋子',n:'日本便利店袋子收费（3-5日元），店员一定会问要不要袋子——下周你会听懂他们问的原话。'}]},
 {t:'quiz',gen:'kana',pool:rp([hrow('な行'),hrow('は行'),hdrow('ば行'),hdrow('ぱ行')]),n:6},
 {t:'task',h:'今日开口任务',p:['完整演一遍便利店结账：指着商品「**これをください**」→ 问「**いくらですか**」→「**カードでおねがいします**」→ 收尾「**ありがとうございます**」。','这就是你在日本的第一笔"交易"，跑通它！']}]},

{id:'j07',day:7,week:1,weekTitle:'发音地基与打招呼',title:'第1周复习日',sub:'26个假名 + 15个句子·大盘点',mins:15,steps:[
 {t:'intro',h:'第一周完成！先看看你已经拥有什么',p:[
  '7天前你还是零基础，现在你已经认识 **26个基础假名+浊音**，会说**打招呼、感谢、道歉、购物、问价、自我介绍**。这就是复利的开始。',
  '今天不学新内容，把学过的东西焊牢。复习的黄金法则：**先自测再看答案**——大脑只有在"努力回想"时才真正长记忆。'],
  tip:'下面的假名墙：先遮住罗马音自测读音，卡住的点开听。'},
 {t:'kana',h:'本周假名总览（点读复习）',review:true,rows:[hrow('あ行'),hrow('か行'),hrow('さ行'),hrow('た行'),hrow('な行'),hrow('は行')]},
 {t:'quiz',h:'第1周大测验',sub:'12题，混合本周所有假名',gen:'kana',pool:rp([hrow('あ行'),hrow('か行'),hrow('さ行'),hrow('た行'),hrow('な行'),hrow('は行'),hdrow('が行'),hdrow('ざ行'),hdrow('だ行'),hdrow('ば行'),hdrow('ぱ行')]),n:12},
 {t:'phrases',h:'本周句子快闪（跟读一遍过）',noCards:true,sub:'每句常速跟读1遍，卡住的点慢速',items:[
  {j:'こんにちは',r:'konnichiwa',c:'你好'},
  {j:'ありがとうございます',r:'arigatō gozaimasu',c:'谢谢'},
  {j:'すみません',r:'sumimasen',c:'不好意思/劳驾'},
  {j:'これをください',r:'kore o kudasai',c:'请给我这个'},
  {j:'いくらですか',r:'ikura desu ka',c:'多少钱'},
  {j:'はじめまして。わたしはケニーです。よろしくおねがいします',r:'hajimemashite...',c:'初次见面，我是Kenny，请多关照'}]},
 {t:'task',h:'周末彩蛋任务',p:['打开任意一个日本便利店视频（B站搜"日本便利店 vlog"），**竖起耳朵抓词**：こんにちは、ありがとうございます、ふくろ……','能从真实语流里抓到哪怕一个学过的词，你的大脑就会兴奋——这种"我听懂了!"的瞬间是最好的学习燃料。']}]},

/* ======== 第2周：完成平假名 · 数字与求助 ======== */
{id:'j08',day:8,week:2,weekTitle:'完成平假名 · 数字与求助',title:'ま行 · 找地方',sub:'〜はどこですか 万能找路句',mins:13,steps:[
 {t:'intro',h:'第二周：本周结束你将读完所有平假名',p:[
  'ま行零陷阱，直接上。省下的精力学**本周核心句型：〜はどこですか（…在哪里?）**。',
  '把任何名词放进「〜」就能找到它：厕所、车站、出口、酒店……在陌生城市，这一句顶半个导航。'],
  tip:'问路时先说「すみません」再问——礼貌开场是日本社交的通行证。'},
 {t:'kana',h:'ま行',rows:[hrow('ま行')]},
 {t:'phrases',h:'找地方',items:[
  {j:'トイレはどこですか',r:'toire wa doko desu ka',c:'厕所在哪里?',n:'トイレ 是片假名词（toilet）——你下周会学片假名，先把这个高频词整体记住。'},
  {j:'えきはどこですか',r:'eki wa doko desu ka',c:'车站在哪里?',n:'えき=车站。日本人指路时听不懂没关系，跟着手势走，到了大概位置再问一次。'},
  {j:'でぐちはどこですか',r:'deguchi wa doko desu ka',c:'出口在哪里?',n:'东京车站内部比迷宫还复杂，这句是刚需。入口=いりぐち。'}]},
 {t:'quiz',gen:'kana',pool:rp([hrow('は行'),hrow('ま行')]),n:6},
 {t:'task',h:'今日开口任务',p:['想象你在新宿站迷路，练习完整流程：「**すみません、でぐちはどこですか**」','再把トイレ、えき替换进去各说一遍。']}]},

{id:'j09',day:9,week:2,weekTitle:'完成平假名 · 数字与求助',title:'や行 · 听不懂救命三连',sub:'只有3个的假名行 + 保命句',mins:13,steps:[
 {t:'intro',h:'や行只有3个成员',p:[
  'や・ゆ・よ——只有3个（yi、ye 在现代日语里消失了）。它们除了自己成音，还有个隐藏技能：**变小字后能拼"拗音"**（きゃ kya 之类），周五就会见到。',
  '今天的句子是**听不懂时的救命三连**。真实对话里你一定会懵——懵不可怕，会救场就行。日本人对努力说日语的外国人极其友善。'],
  tip:'说「わかりません」时不用不好意思，配上抱歉的表情，对方自然会放慢/换说法。'},
 {t:'kana',h:'や行',rows:[hrow('や行')]},
 {t:'phrases',h:'救命三连',items:[
  {j:'わかりません',r:'wakarimasen',c:'我不明白',n:'比「我不会日语」更实用——表示"你说的这句我没懂"，对方会换个方式讲。'},
  {j:'もういちどおねがいします',r:'mō ichido onegai shimasu',c:'请再说一遍',n:'もう一度=再一次。这句本身就是礼貌体，任何场合可用。'},
  {j:'ゆっくりおねがいします',r:'yukkuri onegai shimasu',c:'请说慢一点',n:'ゆっくり=慢慢地。注意っ是**促音**——停顿一拍再发 kuri，明天详细学。'}]},
 {t:'quiz',gen:'kana',pool:rp([hrow('ま行'),hrow('や行')]),n:5},
 {t:'task',h:'今日开口任务',p:['三连击串起来演一遍：对方叽里呱啦→「**すみません、わかりません。もういちどおねがいします。ゆっくりおねがいします。**」','语气放软，微微歪头——这是日式"求助模式"的标准姿态。']}]},

{id:'j10',day:10,week:2,weekTitle:'完成平假名 · 数字与求助',title:'ら行 · 数字0-10',sub:'日语r音 + 钱和数量的地基',mins:14,steps:[
 {t:'intro',h:'日语的 r 不是英语的 r',p:[
  'ら行是中国人第二大发音难点：它**既不是 r 也不是 l**，而是舌尖在上齿龈轻弹一下，接近很轻的"了"。听音频模仿，别用英语r去套。',
  '数字是旅行硬通货：价格、时间、人数、房号全靠它。今天 0-10，明天拼到 99。',
  '两个多音提醒：4 常读 **よん**（し不吉利，谐音"死"），7 常读 **なな**，9 常读 **きゅう**（く谐音"苦"）。'],
  tip:'数字要练到"脱口而出"——听到さんびゃく能立刻反应300，靠的是大量出声重复。'},
 {t:'kana',h:'ら行',rows:[hrow('ら行')]},
 {t:'phrases',h:'数字 0-10',sub:'像小学生背九九表一样，出声念！',items:[
  {j:'ゼロ・いち・に・さん',r:'zero, ichi, ni, san',c:'0 · 1 · 2 · 3'},
  {j:'よん・ご・ろく',r:'yon, go, roku',c:'4 · 5 · 6'},
  {j:'なな・はち・きゅう・じゅう',r:'nana, hachi, kyū, jū',c:'7 · 8 · 9 · 10'},
  {j:'ひとつ、ふたつ、みっつ',r:'hitotsu, futatsu, mittsu',c:'一个、两个、三个（点单用）',n:'点餐说「これを**ひとつ**ください」= 这个来一份。日本有两套数数系统，点单用这套最保险。'}]},
 {t:'quiz',gen:'kana',pool:rp([hrow('や行'),hrow('ら行')]),n:5},
 {t:'task',h:'今日开口任务',p:['从0数到10，出声，来回3遍（顺、倒、随机指物数数）。','点单演练：「すみません、これを**ふたつ**ください」。']}]},

{id:'j11',day:11,week:2,weekTitle:'完成平假名 · 数字与求助',title:'わをん+促音长音 · 数字到99',sub:'平假名集齐！+ 两个节奏规则',mins:15,steps:[
 {t:'intro',h:'平假名今天集齐 + 日语的节奏感',p:[
  '最后三个：**わ(wa)**、**を(o，只作宾语助词)**、**ん(n，唯一的独立辅音)**。至此46个基础平假名全部到手！',
  '两个让你听起来"像日语"的节奏规则：',
  '① **促音っ**（小写的つ）：不发音，**停顿一拍**。きって(邮票)读 ki-(停)-te。类似音乐里的休止符。',
  '② **长音**：元音拖长一拍。おばさん(阿姨) vs おばあさん(奶奶)——**长短不同，意思天差地别**。',
  '数字进阶超简单：**11 = 10+1 = じゅういち；20 = 2×10 = にじゅう；35 = さんじゅうご**。比英语的 eleven/twelve 规则多了。'],
  tip:'を 只出现在"宾语+を+动词"里（これ**を**ください），读音和 お 完全一样。'},
 {t:'kana',h:'わ・を・ん',rows:[hrow('わ行'),hrow('ん')]},
 {t:'phrases',h:'节奏练习 + 大数字',items:[
  {j:'きって',r:'kitte（促音）',c:'邮票——感受中间的停顿'},
  {j:'おばあさん',r:'obāsan（长音）',c:'奶奶——对比：おばさん=阿姨',n:'跟读时夸张地拖长あ，习惯后再自然化。'},
  {j:'にじゅうご',r:'nijūgo',c:'25'},
  {j:'ごじゅうきゅう',r:'gojūkyū',c:'59'},
  {j:'ひゃく',r:'hyaku',c:'100',n:'预告：300读さん**びゃく**、600读ろっ**ぴゃく**、800读はっ**ぴゃく**——音便现象，遇到再记。'}]},
 {t:'quiz',gen:'kana',pool:rp([hrow('ら行'),hrow('わ行'),hrow('ん')]),n:5},
 {t:'task',h:'今日开口任务',p:['报出这些数字（先想再看答案）：17、30、48、99。','答案：じゅうなな・さんじゅう・よんじゅうはち・きゅうじゅうきゅう。']}]},

{id:'j12',day:12,week:2,weekTitle:'完成平假名 · 数字与求助',title:'拗音 · 餐厅点单',sub:'きゃ しゃ ちゃ——小字的魔法',mins:14,steps:[
 {t:'intro',h:'拗音：两个假名，一拍读完',p:[
  '把 **小写的ゃゅょ** 贴在い段假名后面，两个字**合读成一拍**：き+ゃ= **きゃ(kya)**，し+ゅ=**しゅ(shu)**，ち+ょ=**ちょ(cho)**。',
  '判断小字很简单：**大小对比**——きや(ki-ya两拍) vs きゃ(kya一拍)。',
  '常见词全是拗音重灾区：東京(とうきょう)、写真(しゃしん)、お茶(おちゃ)……今天之后你就能正确读"Tokyo"了：to-o-kyo-o，四拍。'],
  tip:'今天只熟悉最常用的9个（きゃ行、しゃ行、ちゃ行），其余的在"假名"页随时可查。'},
 {t:'kana',h:'高频拗音',rows:[{row:'拗音',k:[['きゃ','kya'],['きゅ','kyu'],['きょ','kyo'],['しゃ','sha'],['しゅ','shu'],['しょ','sho'],['ちゃ','cha'],['ちゅ','chu'],['ちょ','cho']]}]},
 {t:'phrases',h:'餐厅点单实战',items:[
  {j:'メニューをおねがいします',r:'menyū o onegai shimasu',c:'请给我菜单',n:'很多店进门就给菜单；没给的时候用这句。'},
  {j:'おみずをください',r:'omizu o kudasai',c:'请给我一杯水',n:'日本餐厅**免费提供冰水**（おひや也指冰水），这句用来续杯。'},
  {j:'おちゃをひとつください',r:'ocha o hitotsu kudasai',c:'请来一杯茶',n:'おちゃ=茶。拗音实战：ちゃ一拍读完。'},
  {j:'とうきょう',r:'Tōkyō',c:'东京（读读看：4拍）',n:'とう(2拍)+きょう(2拍)。读对东京，是拗音+长音毕业的标志。'}]},
 {t:'quiz',gen:'kana',pool:[['きゃ','kya'],['きゅ','kyu'],['きょ','kyo'],['しゃ','sha'],['しゅ','shu'],['しょ','sho'],['ちゃ','cha'],['ちゅ','chu'],['ちょ','cho']],n:6},
 {t:'task',h:'今日开口任务',p:['连读挑战：**とうきょう、きょうと、しゃしん、おちゃ**（东京、京都、照片、茶）。','每个词先拆拍再连读，感受"小字合并"的节奏。']}]},

{id:'j13',day:13,week:2,weekTitle:'完成平假名 · 数字与求助',title:'易混假名特训 · 时间词',sub:'ね/れ/わ、ぬ/め、る/ろ 一网打尽',mins:14,steps:[
 {t:'intro',h:'长得像的假名，今天当面对质',p:[
  '每个学日语的人都会混这几组：**ね/れ/わ**（都有竖笔+弯钩）、**ぬ/め**（都像鱼）、**る/ろ**（差一个圈）、**さ/ち**（镜像感）。',
  '拆解口诀：ね(ne)有**大肚圈**、れ(re)**脚踢出去**、わ(wa)**光滑无圈**；ぬ(nu)**带尾圈**、め(me)没有；る(ru)**卷尾**、ろ(ro)**开口**。',
  '下面点读对比着看，然后测验见真章。'],
  tip:'手写一遍胜过看十遍——纸上把每组各写3遍，混淆立消。'},
 {t:'kana',h:'易混组对照（复习）',review:true,rows:[{row:'易混',k:[['ね','ne'],['れ','re'],['わ','wa'],['ぬ','nu'],['め','me'],['る','ru'],['ろ','ro'],['さ','sa'],['ち','chi']]}]},
 {t:'phrases',h:'时间词开箱',items:[
  {j:'きょう',r:'kyō',c:'今天'},
  {j:'あした',r:'ashita',c:'明天'},
  {j:'きのう',r:'kinō',c:'昨天'},
  {j:'いま なんじですか',r:'ima nanji desu ka',c:'现在几点?',n:'なんじ=几点。回答听不懂？没关系，对方一般会**伸手指**或给你看手机。'}]},
 {t:'quiz',gen:'kana',pool:[['ね','ne'],['れ','re'],['わ','wa'],['ぬ','nu'],['め','me'],['る','ru'],['ろ','ro'],['さ','sa'],['ち','chi'],['きゃ','kya'],['しゅ','shu'],['ちょ','cho']],n:8},

const EN_W1=[
 {sp:'店',x:"Hi there! What can I get started for you?",c:'你好！要点什么？',n:'📍星巴克店员开场原话（美国连锁咖啡标准话术），也常说 What can I get you? / What can I get for you today?'},
 {sp:'你',x:"Hey, how's it going? Can I get a grande latte?",c:'嗨，你好！给我来一杯中杯拿铁',n:'**Can I get...?** 美国日常点单的最高频句型，随口自然。**Could I have...?** 美英都通用、更中性客气——两种都对，本课程按美国街头的实际频率教。📍全美咖啡店/快餐/酒吧通用。顾客先回一句 how’s it going 是美国服务场景的默认礼貌。grande=星巴克中杯（tall中小/grande中/venti大）。'},
 {sp:'店',x:"Sure thing. Hot or iced?",c:'没问题。热的还是冰的？',n:'**Sure thing**=没问题、好嘞。📍美式服务业高频应答，朋友间也用。'},
 {sp:'你',x:"Iced, please. And could I also get one of those blueberry muffins?",c:'冰的。另外再给我来一个那种蓝莓麦芬',n:'**could I also get...**=追加点单；**one of those**=那种的（指着玻璃柜说）。📍点单追加场景。'},
 {sp:'店',x:"You got it. For here or to go?",c:'好嘞。堂食还是带走？',n:'**You got it**=好嘞、收到；**for here or to go** 美式必问（英式是 eat in or takeaway）。📍全美餐饮结账必听句。'},
 {sp:'你',x:"To go. Actually, you know what — make it two muffins.",c:'带走。哎等等——麦芬改成两个吧',n:'**Actually, you know what...** 改主意的地道开场白；**make it two**=改成两个。📍点单改单神句，餐厅酒吧通用。'},
 {sp:'店',x:"No problem. Your total's gonna be nine eighty.",c:'没问题。一共9块8',n:'**Your total’s gonna be...** 美式报价句；**gonna**=going to（美语第一缩读）。nine eighty=$9.80，美元口语常省略 dollars 和 cents。📍收银台标准话术。'},
 {sp:'你',x:"Here you go. Oh, do you guys have Wi-Fi?",c:'给。对了，你们有Wi-Fi吗？',n:'**Here you go**=给（递东西）；**you guys**=你们——美式第二人称复数万能词，对店家、朋友、同事都这么说。📍全美通用。'},
 {sp:'店',x:"Yep, the password's on the receipt. You're all set!",c:'有，密码在小票上。您这边都好了！',n:'**You’re all set**=你这边都办妥了。📍美国万能收尾句：咖啡店、超市、银行、机场值机、DMV办证……办完任何手续都会听到。'},
 {sp:'你',x:"Awesome, thanks so much. Have a good one!",c:'太好了，多谢。祝愉快！',n:'**Awesome**=太棒了（美式万能好评词）；**Have a good one**=祝你今天愉快——告别万能句，不分早晚场合。📍全美日常告别高频第一名。'}];
const EN_W2=[
 {sp:'服',x:"Hi folks, how are we doing tonight? Can I start you off with something to drink?",c:'各位晚上好！先来点喝的吗？',n:'📍美国餐厅服务员开场原话（start you off with drinks 是全美餐厅标准流程）。**folks**=各位（亲切称呼）。'},

 {sp:'服',x:"You got it. Are you ready to order, or do you need a couple more minutes?",c:'好嘞。可以点餐了吗，还是再等几分钟？',n:'**a couple more minutes**=再等两三分钟。**couple**=两三个，美式高频约数词。📍餐厅点餐节奏话术。'},

 {sp:'服',x:"Good choice. Anything else for you guys?",c:'好选择！还要别的吗？',n:'**Good choice** 服务员捧场话术；Anything else 英美通用。'},

{id:'e01',day:1,week:1,weekTitle:'场景：美式咖啡店',title:'听力浸入 · 咖啡店点单',sub:'先泡进美音里，不求全懂',mins:9,steps:[

  '标准口音定为**通用美音（General American）**——美剧、好莱坞、硅谷、播客的主流口音。每个表达都配**精确用例**和**场景出处📍**：它是谁在哪说的、什么语域，让你学到的每句话都有"户口"。',
  '每周一个美国真实场景，同一段对话打磨7天：听懂 → 跟得上 → 说得出 → 语块进复习库。今天只做一件事：**整段听2遍**。第一遍不看字幕感受语速，第二遍逐句点开看解析。'],

{id:'e02',day:2,week:1,weekTitle:'场景：美式咖啡店',title:'影子跟读 · 上半段',sub:'鹦鹉学舌，脸皮越厚进步越快',mins:9,steps:[

{id:'e03',day:3,week:1,weekTitle:'场景：美式咖啡店',title:'发音点：缩读 · 跟读下半段',sub:'gonna wanna gotta——美语的身份证',mins:9,steps:[
 {t:'intro',h:'发音点①：缩读——美语听力的第一道门',p:[
  '美国人日常说话大量**缩读**：**going to→gonna**、**want to→wanna**、**got to→gotta**、**kind of→kinda**、**out of→outta**。这不是懒散，是连贯口语的正常形态——聊天、点单、播客里到处都是；正式演讲和书面场合则会收敛。',
  '虚词还会被压扁：**What can I get you?** 实际听起来是 "Whad-can-I-getcha"；**Do you** 缩成 "D’ya"。',
  '这就是"单词都认识、连起来听不懂"的真相：你在等完整单词，对方给的是压缩包。解压方法：**跟读时故意学他们缩**。'],
  tip:'优先级：**听懂缩读是硬需求**（不会听就跟不上对话）；自己说时随场合选——朋友聊天尽管缩，工作汇报和正式场合说完整形也完全得体，清晰永远不减分。书面别写 gonna/wanna（发消息给朋友可以）。'},
 {t:'dialog',h:'跟读：后5句',sub:'重点：Your total’s gonna be... 的缩读感',lang:'en-US',lines:EN_W1.slice(5)},
 {t:'task',h:'今日收尾',p:['缩读快说3遍：**I’m gonna grab a coffee.**（我去买杯咖啡）','再3遍：**D’you guys have Wi-Fi?**——就要那个含糊劲儿。']}]},
{id:'e04',day:4,week:1,weekTitle:'场景：美式咖啡店',title:'角色扮演 · 你来点单',sub:'今天你是顾客本人',mins:9,steps:[

 {t:'intro',h:'场景2：美国餐厅——热情服务+小费文化',p:[

  '本段对话覆盖全流程：入座点饮料 → 点主菜（牛肉熟度）→ 中途巡桌 → 要账单 → 打包。',
  '老规矩：整段听2遍，第一遍盲听抓词，第二遍逐句对照📍解析。'],
  tip:'本段语速比上周快一点点——刻意的。舒适区边缘才长肌肉。'},
 {t:'dialog',h:'场景：美国餐厅晚餐',sub:'整段听2遍：盲听→逐句对照',lang:'en-US',lines:EN_W2},
 {t:'task',h:'今日收尾',p:['回忆：账单美式怎么说？打包盒呢？（**the check / a to-go box**）','这两个词一周后你会脱口而出。']}]},
{id:'e09',day:9,week:2,weekTitle:'场景：美国餐厅',title:'影子跟读 · 上半段',sub:'点餐五句，练到丝滑',mins:9,steps:[
 {t:'intro',h:'跟读前5句',p:['核心句：**I’ll do the cheeseburger, medium, with fries.**——"I’ll do the + 菜名 + 熟度/配菜"是美式点餐的完整模板，直接套用。','注意 **Could we get...** 用于"我们"点单——和上周 Can I get 同源，**一个句型全场景复用**，这就是语块的复利。'],
  tip:'菜名换着练：I’ll do the pasta / the ribeye / the fish tacos...'},
 {t:'dialog',h:'跟读：前5句',sub:'每句3遍：看字→看字→盲跟',lang:'en-US',lines:EN_W2.slice(0,5)},
 {t:'task',h:'今日收尾',p:['脱稿点一单：牛排(the ribeye steak)，七分熟(medium-well)，配沙拉(with a salad)。','参考：I’ll do the ribeye, medium-well, with a salad.']}]},
{id:'e10',day:10,week:2,weekTitle:'场景：美国餐厅',title:'发音点：Flap T · 跟读下半段',sub:'water 读成 wadder——美音第一标志',mins:9,steps:[
 {t:'intro',h:'发音点②：Flap T（弹舌T）——美音的身份证',p:[
  '规则：**t 夹在两个元音之间且不重读时，读成轻快的"d"**（舌尖弹一下）：**water→"wadder"**、**better→"bedder"**、**little→"liddle"**、**got it→"gah-dit"**、**a lot of→"a-lodda"**。',
  '这是美音区别于英音的第一特征（英国人读清脆的t）。掌握它，你的美语立刻"换声卡"。',
  '下半段全是 Flap T 现场：**tasting / whenever / get a chance / gotta**——逐句抓。'],
  tip:'练法：把 got it 当一个词"gah-dit"说10遍，肌肉自然就会了。'},
 {t:'dialog',h:'跟读：后5句',sub:'盯住 tasting、get a chance、whenever 的弹舌T',lang:'en-US',lines:EN_W2.slice(5)},
 {t:'task',h:'今日收尾',p:['Flap T 连击，各3遍：**water / better / got it / a lot of / check it out**。','读成 wadder/bedder/gah-dit/a-lodda/che-ki-dout，恭喜你解锁美音声卡。']}]},
{id:'e11',day:11,week:2,weekTitle:'场景：美国餐厅',title:'角色扮演 · 你来用餐',sub:'从入座到打包全流程',mins:9,steps:[
 {t:'intro',h:'你的回合',p:['角色扮演：你是顾客（绿色行）。台词覆盖点水、点主菜、应对巡桌、要餐巾纸、要打包盒——**这套流程在美国每家餐厅原样上演**。','第二轮改情节：把汉堡换成三文鱼(the salmon)，熟度不用说，加一句要柠檬水(a lemonade)。'],
  tip:'应对热情服务员的万能三连：Doing great! / Everything’s great! / We’re all set, thanks!'},
 {t:'dialog',h:'角色扮演：你是顾客',sub:'绿色行大声说，再点开对答案',lang:'en-US',mode:'role',you:'你',lines:EN_W2},
 {t:'task',h:'今日收尾',p:['即兴变奏：你吃完了，招手结账+打包，两句话搞定。','参考：Could we get the check when you get a chance? And a to-go box, please.']}]},
{id:'e12',day:12,week:2,weekTitle:'场景：美国餐厅',title:'语块日 · 餐厅万能件',sub:'8个语块进复习库',mins:10,steps:[
 {t:'intro',h:'本周语块拆解',p:['本周8个语块，一半是餐厅专用，一半是**任何场景都能用的口语胶水**（for now / when you get a chance / a couple of）。后者才是真正的宝贝——注意每个📍出处。'],
  tip:'when you get a chance 在职场的用法：Could you review this when you get a chance?——催活儿还显得客气。'},
 {t:'chunks',h:'本周语块 ×8',items:[
  {x:"I'll do the...",c:'我要……（美式点餐）',ex:"I'll do the Caesar salad to start.",exc:'前菜我要凯撒沙拉',n:'📍全美餐厅点餐口语；to start=作为前菜'},
  {x:"for now",c:'先……/暂时',ex:"Just water for now, thanks.",exc:'先来水就行，谢谢',n:'📍点单缓冲；开会也用：Let’s park that for now（这事先放放）'},
  {x:"when you get a chance",c:'您方便的时候（软化请求）',ex:"Could we get the check when you get a chance?",exc:'方便的时候把账单给我们吧',n:'📍餐厅+美国职场通用软化语，邮件口头都高频'},
  {x:"That's it for now.",c:'先这样/暂时就这些',ex:"That's it for now, thank you.",exc:'先这样，谢谢',n:'📍点单收尾；汇报工作结尾也能用'},
  {x:"the check",c:'账单（美式）',ex:"Could we get the check, please?",exc:'麻烦结一下账',n:'📍美国餐厅（英式说 the bill）；AA制说 Can we split the check?'},
  {x:"a to-go box",c:'打包盒',ex:"Could I get a to-go box for this?",exc:'这个能给我个打包盒吗？',n:'📍美国打包文化：剩菜打包是常规操作，没人觉得奇怪'},
  {x:"a couple (of)...",c:'两三个……（美式约数）',ex:"I need a couple more minutes.",exc:'我还需要两三分钟',n:'📍美式高频量词：a couple bucks / a couple blocks / a couple days'},
  {x:"Everything's great, thanks!",c:'都很好，谢谢！（应对巡桌）',ex:"How's everything? — Everything's great, thanks!",exc:'一切都好吗？——都很棒，谢谢！',n:'📍标准应答服务员中途 check-in，微笑+竖个大拇指更佳'}]},
 {t:'task',h:'今日收尾',p:['用 **for now + when you get a chance** 造一个组合句（出声2遍）。','参考：Just the appetizers for now — and could we see the dessert menu when you get a chance?']}]},
{id:'e13',day:13,week:2,weekTitle:'场景：美国餐厅',title:'全速跟读 + 自由输出',sub:'餐厅声场适应训练',mins:9,steps:[
 {t:'intro',h:'全速贴跟',p:['整段常速跟读，目标：**你的声音和原声之间不超过一个词的距离**。','跟完做输出任务：完整下一次馆子。'],
  tip:'这周跟得比上周吃力是正常的——句子更长了。吃力=在长进。'},
 {t:'dialog',h:'全速影子跟读',sub:'不暂停，跟丢就跳下一句',lang:'en-US',lines:EN_W2},
 {t:'task',h:'输出任务：下馆子独角戏',p:['场景：纽约一家美式餐厅，你要：先来杯柠檬水 → 点鸡肉三明治(the chicken sandwich)配薯条 → 应对巡桌 → 要账单和打包盒。全程出声（服务员的话脑补）。','参考：Could I get a lemonade for now? → I’ll do the chicken sandwich with fries. → Everything’s great, thanks! → Could I get the check and a to-go box when you get a chance?']}]},
{id:'e14',day:14,week:2,weekTitle:'场景：美国餐厅',title:'第2周听力测',sub:'餐厅实况级难度',mins:9,steps:[
 {t:'intro',h:'周测',p:['本周听力全部来自餐厅实况：点单、报菜、巡桌、结账。有一题考**小费常识**——这是美国生存题。'],
  tip:'抓关键词就行：菜名、数字、check、box。别贪心全懂。'},
 {t:'quiz',h:'听力测验',qs:[
  {q:'👂 顾客点了什么？',audio:{x:"I'll do the salmon with a side of fries, please.",lang:'en-US'},opts:['三文鱼配薯条','沙拉配薯条','三明治配沙拉','牛排配土豆泥'],a:'三文鱼配薯条',explain:'a side of...=配一份…（side=配菜）'},
  {q:'👂 服务员在做什么？',audio:{x:"How's everything tasting over here?",lang:'en-US'},opts:['中途巡桌问菜品是否满意','催你快点吃','推销新菜','准备收盘子'],a:'中途巡桌问菜品是否满意'},
  {q:'👂 顾客想要什么？',audio:{x:"Could we get the check and a couple of to-go boxes?",lang:'en-US'},opts:['账单和两三个打包盒','支票和两个盒子','菜单和打包袋','账单和收据'],a:'账单和两三个打包盒'},
  {q:'美国餐厅小费的常规比例是？',opts:['18-20%','5%','不用给','50%'],a:'18-20%',explain:'写在账单tip栏或刷卡机上选，服务员主要收入来源'},
  {q:'「您方便的时候」对应哪个软化语？',opts:['when you get a chance','if you are free forever','at your leisure time','when possible for you'],a:'when you get a chance'},
  {q:'五分熟牛排怎么点？',opts:['medium','half cooked','fifty percent','middle done'],a:'medium'}]},
 {t:'task',h:'周末彩蛋',p:['看一段美国餐厅点餐视频（搜 "American diner ordering"），注意听服务员的开场白和巡桌句。','听到一句 How’s everything tasting? 本周圆满。']}]},

/* ---- 第3周：美式寒暄 ---- */
{id:'e15',day:15,week:3,weekTitle:'场景：美式寒暄',title:'听力浸入 · How’s it going?',sub:'美国社交的握手协议',mins:9,steps:[
 {t:'intro',h:'场景3：Small talk——美国人的社交货币',p:[
  '美国的日常寒暄协议：**How’s it going? / How are you?** 是打招呼不是提问，答案永远简短正面（Pretty good! / Not bad!），然后礼貌回抛 How about you?',
  '寒暄三大安全话题：**体育**（NFL/NBA，"did you catch the game?"是万能开场）、**周末计划**（Any plans for the weekend?）、天气。',
  '本段对话是一次标准的邻里/同事寒暄：问候 → 体育 → 吐槽忙 → 周末计划 → 礼貌离场。学会它，你在美国的"陌生人好感度"直接进入本地模式。'],
  tip:'中国人最易踩的坑：把 How are you 当真提问、认真汇报近况。记住：这是握手，不是采访。'},
 {t:'dialog',h:'场景：楼下遇到邻居',sub:'整段听2遍：盲听→逐句对照',lang:'en-US',lines:EN_W3},
 {t:'task',h:'今日收尾',p:['回忆：对方问 How’s it going? 标准接法？（**Pretty good, pretty good. How about you?**）','记住协议：简短、正面、回抛。']}]},
{id:'e16',day:16,week:3,weekTitle:'场景：美式寒暄',title:'影子跟读 · 上半段',sub:'语调比单词重要的一周',mins:9,steps:[
 {t:'intro',h:'跟读前5句：这周练的是"曲调"',p:['寒暄的信息量在**语调**里：How’s it going? 要轻快上扬；Pretty good 要带笑意；**No way!** 要有真惊讶。','把自己当唱歌的：今天跟读时**夸张模仿语调起伏**，宁过勿平。'],
  tip:'中式英语最大特征是语调太平。这周治它。'},
 {t:'dialog',h:'跟读：前5句',sub:'夸张模仿语调，像学一首歌',lang:'en-US',lines:EN_W3.slice(0,5)},
 {t:'task',h:'今日收尾',p:['只用语调玩一遍：把 **Oh man!** 说出3种情绪——同情、无奈、兴奋。','语调自由了，口语就活了。']}]},
{id:'e17',day:17,week:3,weekTitle:'场景：美式寒暄',title:'发音点：附和的艺术 · 跟读下半段',sub:'uh-huh 和 mm-hmm 的使用手册',mins:9,steps:[
 {t:'intro',h:'发音点③：美式附和系统（backchanneling）',p:[
  '美国人聊天时听话方**不能沉默**——要持续给声音反馈：**uh-huh**（嗯/在听）、**mm-hmm**（是的）、**yeah**（对）、**right**（没错）、**totally**（完全同意）、**no way**（不会吧）。',
  '沉默听完在美国文化里=没在听/不感兴趣。**每2-3句给一个附和音**，对方会觉得你"会聊天"——哪怕你只说了 uh-huh。',
  '下半段跟读时，特别模仿 **I hear you** 和 **For sure** 的共情语调。'],
  tip:'这是性价比之王：0词汇量的纯声音技能，立刻让你的对话体验升一档。'},
 {t:'dialog',h:'跟读：后5句',sub:'重点句：I hear you / No way! / For sure',lang:'en-US',lines:EN_W3.slice(5)},
 {t:'task',h:'今日收尾',p:['附和音连练：**uh-huh → mm-hmm → totally → no way → for sure**，用不同语调各说3遍。','今天起看美剧注意听：主角们无时无刻不在 backchanneling。']}]},
{id:'e18',day:18,week:3,weekTitle:'场景：美式寒暄',title:'角色扮演 · 接住闲聊',sub:'你的台词全是高频万能句',mins:9,steps:[
 {t:'intro',h:'你的回合：做那个会聊的人',p:['这次你的台词句句是宝：标准问候应答、吐槽最近忙(swamped)、惊讶(No way!)、周末计划模板(take it easy + grab brunch)、告别(For sure. Take care!)——**这套流程每天在全美办公室和小区原样上演**。','第二轮改剧本：你周末要去 hiking（去徒步），替换进模板。'],
  tip:'接不上话的万能三连：Oh nice! / That’s awesome! / Sounds good!——先接住，再想说啥。'},
 {t:'dialog',h:'角色扮演：你是邻居',sub:'绿色行大声说',lang:'en-US',mode:'role',you:'你',lines:EN_W3},
 {t:'task',h:'今日收尾',p:['hiking版周末回答自编自演：','参考：Not much — probably gonna go hiking with a couple friends. Weather’s supposed to be great.']}]},
{id:'e19',day:19,week:3,weekTitle:'场景：美式寒暄',title:'语块日 · 闲聊万能件',sub:'8个语块，社交润滑油',mins:10,steps:[
 {t:'intro',h:'本周语块：口语的润滑油',p:['这8个语块几乎不承载"信息"，全是**社交润滑油**——但流利感恰恰藏在这些小词里。会用 I gotta run 离场的人，听起来就是流利。每个📍出处都看一眼。'],
  tip:'目标不是记住，是**脱口而出**。复习卡片会帮你磨到那个程度。'},
 {t:'chunks',h:'本周语块 ×8',items:[
  {x:"How's it going?",c:'最近咋样？（美式国民问候）',ex:"Hey Mike! How's it going?",exc:'嘿Mike！最近咋样？',n:'📍全美通用打招呼；标准应答：Pretty good! How about you?'},
  {x:"swamped",c:'忙疯了',ex:"Sorry, I've been swamped this week.",exc:'抱歉，我这周忙疯了',n:'📍美国职场高频；同义还有 slammed / buried'},
  {x:"I hear you.",c:'我懂你/深有同感',ex:"I hear you — Mondays are rough.",exc:'我太懂了——周一是真难熬',n:'📍共情应答；升级版：I feel you（更年轻化）'},
  {x:"No way!",c:'不会吧！（惊讶）',ex:"No way! That's crazy.",exc:'不会吧！太离谱了',n:'📍朋友闲聊必备惊讶词；That’s crazy 是万能跟腔'},
  {x:"grab (coffee/lunch/a bite)",c:'随便吃/喝一顿',ex:"Wanna grab a bite after work?",exc:'下班随便吃点去？',n:'📍美式约饭标准动词：grab coffee/lunch/dinner/drinks/a bite 全系列'},
  {x:"take it easy",c:'放松/歇着',ex:"I'm just gonna take it easy this weekend.",exc:'这周末我就打算歇歇',n:'📍回答周末计划的万能牌；告别时说也=保重'},
  {x:"I gotta run.",c:'我得赶紧走了',ex:"I gotta run — talk soon!",exc:'我得走了——回聊！',n:'📍美式礼貌离场标准句；gotta=got to'},
  {x:"For sure.",c:'必须的/当然',ex:"For sure, sounds good.",exc:'必须的，就这么定',n:'📍美式附和确认；同级：Totally. / Absolutely. / You bet.'}]},
 {t:'task',h:'今日收尾',p:['用三个语块串一段迷你独白（出声）：问候 → 吐槽忙 → 约饭。','参考：How’s it going? ... I’ve been swamped, honestly. ... Wanna grab lunch next week?']}]},
{id:'e20',day:20,week:3,weekTitle:'场景：美式寒暄',title:'全速跟读 + 自由输出',sub:'像本地人一样闲聊90秒',mins:9,steps:[
 {t:'intro',h:'全速贴跟',p:['寒暄的语速是三周里最快的（真实闲聊就是快）。全速跟一遍，重点保住**语调曲线和附和音**，个别词跟丢完全没关系。'],
  tip:'跟读时想象画面：小区门口、拿着咖啡的邻居、阳光——场景感让语言长在情境里。'},
 {t:'dialog',h:'全速影子跟读',sub:'保语调，弃细节',lang:'en-US',lines:EN_W3},
 {t:'task',h:'输出任务：90秒独角戏',p:['自导自演一段完整美式寒暄（你演两个角色）：How’s it going 开场→聊比赛或最近忙→周末计划→I gotta run 离场。','演完给自己鼓个掌——你刚跑通了美国社交全流程。']}]},
{id:'e21',day:21,week:3,weekTitle:'场景：美式寒暄',title:'第3周听力测',sub:'听懂弦外之音',mins:9,steps:[
 {t:'intro',h:'周测：这周考"言外之意"',p:['美式寒暄的难点不在词汇在**潜台词**：How are you 要不要认真答？swamped 是啥状态？I gotta run 是嫌你烦吗（不是）？本周测验专考这些。'],
  tip:'规律：寒暄里一切从简从快从正面。深聊留给熟人和饭局。'},
 {t:'quiz',h:'听力测验',qs:[
  {q:'👂 对方最近状态如何？',audio:{x:"I've been swamped with work lately, honestly.",lang:'en-US'},opts:['忙疯了','失业了','在游泳','很清闲'],a:'忙疯了'},
  {q:'👂 对方在问什么？',audio:{x:"Any plans for the weekend?",lang:'en-US'},opts:['周末有安排吗','有周末加班计划吗','周末要出差吗','周末帮个忙行吗'],a:'周末有安排吗'},
  {q:'👂 对方要做什么？',audio:{x:"I gotta run — good catching up!",lang:'en-US'},opts:['要走了，聊得开心','要去跑步','要赶飞机','让你快走'],a:'要走了，聊得开心',explain:'I gotta run=礼貌离场，catch up=叙旧'},
  {q:'同事说 "Wanna grab lunch?" 意思是？',opts:['一起吃个午饭吗','帮我拿下午饭','抢午饭吗','午饭要打包吗'],a:'一起吃个午饭吗'},
  {q:'How are you? 的正确打开方式？',opts:['简短正面+回抛：Good! You?','详细汇报身体状况','沉默微笑','说 Fine thank you and you 完整版'],a:'简短正面+回抛：Good! You?'},
  {q:'对方讲事情时，表示"在听"的美式声音反馈是？',opts:['uh-huh / mm-hmm','sh...','okay okay okay','loudly breathing'],a:'uh-huh / mm-hmm'}]},

/* ---- 第4周：问路与街区 ---- */
{id:'e22',day:22,week:4,weekTitle:'场景：问路与街区',title:'听力浸入 · 纽约街头问路',sub:'block 体系+方向感英语',mins:9,steps:[
 {t:'intro',h:'场景4：问路——开口回报率最高的场景',p:[
  '美国城市是**网格布局**，方向感的基本单位是 **block（街区）**："走两个block右转"比"走300米"常用一万倍。',
  '本段对话在纽约展开，覆盖问路全流程：礼貌拦人 → 听懂 block+hang a right → 确认(Got it) → 追问耗时 → 找ATM → 走心道谢(I appreciate it)。',
  '美国人指路热情且啰嗦，你只需抓三类词：**数字+block / 转向(hang a right/left) / 地标(on the corner)**。'],
  tip:'现实技巧：听完复述一遍关键步骤（Two blocks, then a right?）确认，错了对方会纠正你。'},
 {t:'dialog',h:'场景：纽约街头问路',sub:'整段听2遍：盲听→逐句对照',lang:'en-US',lines:EN_W4},
 {t:'task',h:'今日收尾',p:['回忆三件套：街区？右转（口语版）？就在街角？（block / hang a right / right on the corner）']}]},
{id:'e23',day:23,week:4,weekTitle:'场景：问路与街区',title:'影子跟读 · 上半段',sub:'把拦人开场刻进DNA',mins:9,steps:[
 {t:'intro',h:'跟读前5句',p:['**Excuse me, sorry — do you know how to get to...?** 这个开场练到条件反射——它是你在美国拦下任何陌生人的通行证。','指路句信息密度高，跟读时**边说边用手比划**：two blocks→伸两根手指向前，hang a right→手向右摆。身体参与，记忆翻倍。'],
  tip:'比划着学方向英语，到了真街头，对方的手势你也能秒懂。'},
 {t:'dialog',h:'跟读：前5句',sub:'边跟读边用手比划方向',lang:'en-US',lines:EN_W4.slice(0,5)},
 {t:'task',h:'今日收尾',p:['脱稿说出完整拦人句：**Excuse me, do you know how to get to...?** 后面接3个地点：the subway station / a pharmacy / Central Park。']}]},
{id:'e24',day:24,week:4,weekTitle:'场景：问路与街区',title:'发音点：卷舌R与连读 · 跟读下半段',sub:'美音收官：R一卷到底',mins:9,steps:[
 {t:'intro',h:'发音点④：卷舌R（rhotic R）+ 连读',p:[
  '美音**所有的 r 都发音**：corner 两个r全卷（"córner"）、there、appreciate、super——舌头后卷但**不碰上颚**。这是和英音的分水岭（英音 corner 读"córna"）。',
  '连读：辅音结尾+元音开头自动粘连——**right on→"righ-don"**、**an ATM→"a-nay-tee-em"**、**check it out→"che-ki-dout"**。',
  '下半段是 R 的海洋：**corner / there / around here somewhere / appreciate**——跟读时把每个r都卷到位。'],
  tip:'卷舌自查法：说 water 时舌尖如果碰到上颚就过头了，悬空后卷才对。'},
 {t:'dialog',h:'跟读：后5句',sub:'重点：right on the corner / I appreciate it 的R与连读',lang:'en-US',lines:EN_W4.slice(5)},
 {t:'task',h:'今日收尾',p:['R字连击各3遍：**corner / super / appreciate / around here somewhere**。','终极挑战连读整句：There’s a Chase right on the corner over there.（5个r，全卷）']}]},
{id:'e25',day:25,week:4,weekTitle:'场景：问路与街区',title:'角色扮演 · 你来问路',sub:'从拦人到道谢全流程',mins:9,steps:[
 {t:'intro',h:'你的回合：主动发起对话',p:['前三周你多是"应答方"，这次**你是发起方**——拦人、提问、确认、追问、道谢，节奏全在你手里。这是口语进阶：从接球到发球。','第二轮改目标：找**最近的地铁站(the nearest subway station)**。'],
  tip:'发起对话的秘诀：先深吸一口气再开口，语速放慢20%，微笑。'},
 {t:'dialog',h:'角色扮演：你是问路人',sub:'绿色行大声说',lang:'en-US',mode:'role',you:'你',lines:EN_W4},
 {t:'task',h:'今日收尾',p:['完整发起一轮（无提示）：拦人→找大都会博物馆→复述确认→问步行时间→道谢。卡住再回看。']}]},
{id:'e26',day:26,week:4,weekTitle:'场景：问路与街区',title:'语块日 · 问路万能件',sub:'8个语块收官，本月满32个',mins:10,steps:[
 {t:'intro',h:'本月最后一批语块',p:['这批语块里，**Got it / I appreciate it / like ..., tops** 都是能用一辈子的口语神器。加上前三周的，你的语块库已满 **32个万能件**——它们会在复习里反复出现，直到成为本能。'],
  tip:'月底彩蛋：把四周语块混着造句，你会发现它们能互相拼装——那就是流利的雏形。'},
 {t:'chunks',h:'本周语块 ×8',items:[
  {x:"How do I get to...?",c:'……怎么走？',ex:"How do I get to Times Square from here?",exc:'从这儿去时代广场怎么走？',n:'📍问路标准句；更礼貌版：Do you know how to get to...?'},
  {x:"hang a right / left",c:'右转/左转（口语）',ex:"Hang a left at the light.",exc:'红绿灯那儿左转',n:'📍美式口语指路（正式场合说 take/make a right）；the light=红绿灯'},
  {x:"two blocks down",c:'往前两个街区',ex:"It's two blocks down on your right.",exc:'往前两个街区，在你右手边',n:'📍block是美国城市方位基本单位；down=沿街往前'},
  {x:"Got it.",c:'明白/收到',ex:"Got it, thanks!",exc:'明白了，谢谢！',n:'📍万能确认词：问路、开会、接任务全场景，美国职场每天十遍'},
  {x:"like ..., tops",c:'大概……顶多',ex:"It's like ten minutes, tops.",exc:'大概10分钟，顶多了',n:'📍口语估数组合：like=大概，tops=顶多（放句尾）'},
  {x:"Is there a ... around here?",c:'这附近有……吗？',ex:"Is there a pharmacy around here?",exc:'这附近有药店吗？',n:'📍街头找设施万能句：ATM/restroom/drugstore/gas station 随意替换'},
  {x:"I appreciate it.",c:'非常感谢（走心版）',ex:"Thanks so much — I appreciate it!",exc:'太谢谢了——真心感谢！',n:'📍受人帮助后的加强道谢；职场对同事帮忙也高频'},
  {x:"right on the corner",c:'就在街角',ex:"The drugstore's right on the corner.",exc:'药店就在街角',n:'📍美国报位置常用：right=正好（加强）；on the corner of A and B=A街B街交口'}]},
 {t:'task',h:'今日收尾',p:['跨周语块拼装挑战（出声造句）：用 **Is there a ... around here? + like ..., tops + I appreciate it** 三件套找咖啡店。','参考：Is there a coffee shop around here? ... Like two blocks? Got it — I appreciate it!']}]},
{id:'e27',day:27,week:4,weekTitle:'场景：问路与街区',title:'全速跟读 + 四场景大串烧',sub:'第1月口语总验收',mins:10,steps:[
 {t:'intro',h:'总验收：四个场景连过',p:['先全速跟读本周对话，然后是**大串烧输出**：把四周的"你方台词"连成一天的纽约之旅——早上买咖啡→中午下馆子→楼下寒暄→街头问路。','这是你第1月口语的完整验收，也是下月对话课的起点。'],
  tip:'串烧时忘词就翻语块库（复习页），那里是你的军火库。'},
 {t:'dialog',h:'全速影子跟读',sub:'最后一次，全力贴跟',lang:'en-US',lines:EN_W4},
 {t:'task',h:'纽约一日游 · 台词串烧',p:['大声完成你的一天（只说你的台词）：','☕ Hey, how’s it going? Can I get a grande latte? To go. Awesome, have a good one!','🍔 I’ll do the cheeseburger, medium, with fries. Could we get the check when you get a chance?','🏙 Pretty good, pretty good! I’ve been swamped lately. Gonna take it easy this weekend.','🗺 Excuse me, do you know how to get to the Met? Got it — I appreciate it!','连说无卡顿 = 第1月圆满毕业。']}]},
{id:'e28',day:28,week:4,weekTitle:'场景：问路与街区',title:'第1月综合听力测 · 下月预告',sub:'毕业考+新地图',mins:10,steps:[
 {t:'intro',h:'英语线毕业考',p:['6题综合听力，横跨四个场景。答完看下月预告。'],

 {t:'intro',h:'🎓 第2月预告：从"应对"到"聊天"',p:[

/* 拆分安装：slim三字段入库、freq入串、例句入EXS */
(function(){
  function install(lib,exsKey,freqKey,packs){
    packs.forEach(p=>{
      if(!p[0]||!p[0].items)return; // 跳过占位
      const grp=p[0],digits=p[1];
      EXS[exsKey].push(grp.items.map(i=>[i[3],i[4]]));
      FREQ[freqKey].push(digits);
      lib.push({g:grp.g,items:grp.items.map(i=>[i[0],i[1],i[2]])});
    });
  }
  install(EN_LIB.slang,"L:e:sl","L:e:sl",NEW_EN_SLANG);
  install(JP_LIB.slang,"L:j:sl","L:j:sl",NEW_JP_SLANG);
})();

{id:'j36',day:36,week:6,weekTitle:'动词ます形',title:'去/来/回 + 方向助词へ',sub:'いきます・きます・かえります',mins:13,steps:[

 {t:'phrases',h:'移动实战',sub:'注意「目的地へ+动词」语序',items:[

  {j:'まいにち かいしゃへ いきます',r:'mainichi kaisha e ikimasu',c:'每天去公司',n:'まいにち＝每天。上班族日常句。'},

  {j:'でんしゃで いきます',r:'densha de ikimasu',c:'坐电车去',n:'交通工具+で＝乘坐。タクシーで、バスで同理。'},
  {j:'ひとりで いきます',r:'hitori de ikimasu',c:'一个人去',n:'ひとりで＝独自。旅行常用。'}]},
 {t:'quiz',h:'移动检验',qs:[

  {q:'「坐电车去」的「坐」用?',opts:['で','へ','に','を'],a:'で',ja:true},

  {q:'日语动词的位置在?',opts:['句尾','句首','主语后','随意'],a:'句尾'}]},

{id:'j62',day:62,week:9,weekTitle:'て形：日语的分水岭',title:'てはいけません：禁止与规则',sub:'听懂「不可以」——保命的语法',mins:12,steps:[
 {t:'intro',h:'听懂禁止，避免尴尬',p:['**ては いけません**＝不可以〜（规则禁止）。你自己少说，但**必须听懂**——日本规则多，标识和店员都会说：','ここで しゃしんを とっては いけません(此处禁止拍照)','口语缩音：**ちゃだめ**：たべちゃだめ(不能吃)——朋友间和对小孩说的版本，日剧里铺天盖地。','标识汉字包：**禁止・立入禁止(禁止进入)・撮影禁止(禁止拍摄)**——看懂少踩雷。'],tip:'被提醒了怎么办：すみません、しりませんでした(抱歉我不知道)+马上停——态度到位，万事化小。'},
 {t:'phrases',h:'禁止听力包',sub:'重点是听懂+得体回应',items:[
  {j:'ここで たばこを すっては いけません',r:'koko de tabako o suttewa ikemasen',c:'这里不能吸烟',n:'すいます＝吸。日本吸烟规则极严。'},
  {j:'しゃしんは ちょっと…',r:'shashin wa chotto…',c:'拍照的话有点…（=请别拍）',n:'店员的委婉版禁止，听懂ちょっと就够。'},
  {j:'すみません、しりませんでした',r:'sumimasen, shirimasen deshita',c:'抱歉，我不知道（这个规定）',n:'被提醒后的标准得体回应。'},
  {j:'たちいりきんし',r:'tachiiri kinshi',c:'禁止进入（标识）',n:'立入禁止。看到就绕路。'},
  {j:'ここは だいじょうぶですか',r:'koko wa daijōbu desu ka',c:'这里可以吗？',n:'不确定就问——万能安全确认句。'},
  {j:'だめです',r:'dame desu',c:'不行',n:'直接版禁止。だめ也是日常吐槽词：もうだめ(不行了/累瘫)。'}]},
 {t:'quiz',h:'禁止听力测',qs:[
  {q:'👂听警告',audio:{x:'すみません、ここで しゃしんを とっては いけません',lang:'ja-JP'},opts:['这里禁止拍照','这里禁止吸烟','这里禁止饮食','这里可以拍照'],a:'这里禁止拍照'},
  {q:'被提醒违规后得体回应?',opts:['すみません、しりませんでした','だいじょうぶです','どうぞ','いいですよ'],a:'すみません、しりませんでした',ja:true},
  {q:'「立入禁止」意思是?',opts:['禁止进入','禁止停车','禁止拍照','禁止吸烟'],a:'禁止进入'}]},
 {t:'task',h:'开口任务',p:['演一遍「踩雷现场」：被店员说 しゃしんは ちょっと…→你立刻 あ、すみません！しりませんでした。','不确定场合先问：ここは だいじょうぶですか——把「先问」刻进旅行本能。']}]},

{id:'j73',day:73,week:11,weekTitle:'场景实战月II',title:'身体不适与就医',sub:'びょういん：从预约到描述症状',mins:13,steps:[
 {t:'intro',h:'就医日语：希望用不上，必须会',p:['挂号开场：**きぶんが わるいんですが**(不太舒服……) / **ねつが あります**(发烧了)','医生必问三连：**どう しましたか**(怎么了) / **いつからですか**(从什么时候开始) / **アレルギーは？**','症状描述装备：きのうから(从昨天起)+症状+程度：きのうから ねつが あります。'],tip:'保险句提前备好：りょこうほけんに はいって います(我买了旅行保险)——就医场景的定心丸。'},
 {t:'phrases',h:'就医实战句',sub:'描述症状全套',items:[
  {j:'きぶんが わるいんですが',r:'kibun ga waruin desu ga',c:'我不太舒服……',n:'きぶん＝身体状态感受。就医万能开场。'},
  {j:'きのうから ねつが あります',r:'kinō kara netsu ga arimasu',c:'从昨天开始发烧',n:'时间起点+症状，医生最想要的格式。'},
  {j:'どう しましたか',r:'dō shimashita ka',c:'怎么了？（医生问）',n:'听懂后开始描述症状。'},
  {j:'ここが いたいです',r:'koko ga itai desu',c:'这里疼',n:'指着说——身体词忘了就用ここ，万能。'},
  {j:'はきけが します',r:'hakike ga shimasu',c:'恶心想吐',n:'〜が します＝有某种感觉：めまいが します(头晕)。'},
  {j:'くすりを ください',r:'kusuri o kudasai',c:'请给我开药',n:'诊疗收尾句。'}]},
 {t:'quiz',h:'就医检验',qs:[
  {q:'医生问「どう しましたか」是在?',opts:['问你怎么了','问你叫什么','问你去哪','问你几岁'],a:'问你怎么了'},
  {q:'「从昨天开始发烧」?',opts:['きのうから ねつが あります','きのうまで ねつです','ねつは きのうです','きのうに ねつを します'],a:'きのうから ねつが あります',ja:true},
  {q:'说不出部位名，指着说?',opts:['ここが いたいです','これは なんですか','どこですか','いたいは ここです'],a:'ここが いたいです',ja:true}]},
 {t:'task',h:'开口任务',p:['组装急诊卡并说3遍：**きぶんが わるいんですが。きのうから ＿＿が あります/します。アレルギーは ありません。**','希望永远用不上，但会说这三句，日本任何城市你都有安全网。']}]},

{id:'j74',day:74,week:11,weekTitle:'场景实战月II',title:'麻烦与求助：丢东西了',sub:'なくしました/わすれました/たすけて',mins:13,steps:[
 {t:'intro',h:'意外时刻的日语自救',p:['丢失双动词：**なくしました**(弄丢了) / **わすれました**(落下了)：さいふを なくしました(钱包丢了) / でんしゃに かばんを わすれました(包落电车上了)','求助流程：找**こうばん**(派出所·日本街头密度极高) → 说明丢失物+地点 → 留联系方式。','关键装备：**けいさつ**(警察)/**わすれもの**(失物)/**とどけ**(申报)——落し物大国日本，找回率世界第一，别慌。'],tip:'日本失物找回率极高（钱包找回率约70%）——丢了第一时间去こうばん，大概率有惊喜。'},
 {t:'phrases',h:'求助实战句',sub:'丢东西全流程',items:[
  {j:'さいふを なくしました',r:'saifu o nakushimashita',c:'钱包丢了',n:'さいふ＝钱包。求助第一句。'},
  {j:'でんしゃに かばんを わすれました',r:'densha ni kaban o wasuremashita',c:'包落在电车上了',n:'场所に+物を+わすれました 公式。'},
  {j:'こうばんは どこですか',r:'kōban wa doko desu ka',c:'派出所在哪？',n:'こうばん＝交番，街角小警亭。'},
  {j:'なかに パスポートが あります',r:'naka ni pasupōto ga arimasu',c:'里面有护照',n:'描述失物内容，存在句实战。'},
  {j:'みつかったら、れんらくを おねがいします',r:'mitsukattara, renraku o onegai shimasu',c:'找到了请联系我',n:'たら＝如果（第12周正式讲），整句先背。'},
  {j:'たすけて ください',r:'tasukete kudasai',c:'请帮帮我/救命',n:'紧急万能句。真遇急事，喊出来。'}]},
 {t:'quiz',h:'求助检验',qs:[
  {q:'「钱包丢了」?',opts:['さいふを なくしました','さいふを かいました','さいふが ほしいです','さいふは どこですか'],a:'さいふを なくしました',ja:true},
  {q:'「包落在电车上了」?',opts:['でんしゃに かばんを わすれました','でんしゃで かばんを かいました','かばんは でんしゃが すきです','でんしゃを わすれました'],a:'でんしゃに かばんを わすれました',ja:true},
  {q:'街头求助去哪?',opts:['こうばん','コンビニ','いざかや','えきの ホーム'],a:'こうばん',ja:true}]},
 {t:'task',h:'开口任务',p:['自演丢包报案30秒：さいふを なくしました→地点(でんしゃで)→内容(なかに カードが あります)→みつかったら、れんらくを おねがいします。','希望永不上演，但这30秒的排练可能价值一本护照。']}]},

{id:'j75',day:75,week:11,weekTitle:'场景实战月II',title:'寒暄进阶：季节与近况',sub:'ひさしぶり/あついですね/おかげさまで',mins:12,steps:[
 {t:'intro',h:'从「会说话」到「会来事儿」',p:['久别重逢：**おひさしぶりです**(好久不见) → **おげんきですか** → 神回复 **おかげさまで、げんきです**(托您的福，很好)','おかげさまで＝「托您的福」——日本社交最高情商词，被问近况永远先说它。','天气寒暄进阶：あついですね→**そうですね、まいにち あついですね**——同意+复读=日式共鸣的标准舞步。'],tip:'日本寒暄的本质不是交换信息，是交换「我们关系不错」的信号——内容不重要，来回才重要。'},
 {t:'phrases',h:'寒暄进阶句',sub:'重逢+季节+告别',items:[
  {j:'おひさしぶりです',r:'o-hisashiburi desu',c:'好久不见',n:'朋友版：ひさしぶり！'},
  {j:'おかげさまで、げんきです',r:'okagesama de, genki desu',c:'托您的福，我很好',n:'情商天花板回复，必练。'},
  {j:'そうですね、まいにち あついですね',r:'sō desu ne, mainichi atsui desu ne',c:'是啊，每天都好热啊',n:'そうですね开头＝日式共鸣第一步。'},
  {j:'さいきん どうですか',r:'saikin dō desu ka',c:'最近怎么样？',n:'さいきん＝最近。你主动关心别人的开场。'},
  {j:'あいかわらずです',r:'aikawarazu desu',c:'老样子',n:'Same old的日语版，谦虚又自然。'},
  {j:'また ちかいうちに！',r:'mata chikai uchi ni!',c:'改天再聚！',n:'ちかいうちに＝近期内。告别的温暖收尾。'}]},
 {t:'quiz',h:'寒暄检验',qs:[
  {q:'被问おげんきですか，情商回复?',opts:['おかげさまで、げんきです','はい','げんきです よ','あなたは?'],a:'おかげさまで、げんきです',ja:true},
  {q:'「老样子」?',opts:['あいかわらずです','かわりました','あたらしいです','まだまだです'],a:'あいかわらずです',ja:true},
  {q:'日式共鸣的开头词?',opts:['そうですね','ちがいます','だめです','どうぞ'],a:'そうですね',ja:true}]},
 {t:'task',h:'开口任务',p:['完整寒暄舞步自演：おひさしぶりです→おげんきですか→おかげさまで→さいきん どうですか→あいかわらずです→また ちかいうちに。','这套舞步跳熟，你在日本的每次重逢都有了固定的温暖开场。']}]},

{id:'j77',day:77,week:11,weekTitle:'场景实战月II',title:'第11周整合 · 实战场景总演习',sub:'电话+问路+就医+求助+寒暄 五连测',mins:13,steps:[

  {q:'「包落在电车上了」?',opts:['でんしゃに かばんを わすれました','でんしゃで かばんを なくします','かばんに でんしゃを わすれました','でんしゃの かばんです'],a:'でんしゃに かばんを わすれました',ja:true},
  {q:'被问近况，情商满分答?',opts:['おかげさまで、げんきです','げんきかも しれません','だいじょうぶです','どうも'],a:'おかげさまで、げんきです',ja:true}]},

{id:'j78',day:78,week:12,weekTitle:'毕业冲刺',title:'形容词过去形：たのしかった！',sub:'旅行感想的语法：好玩/好吃/太贵了(过去版)',mins:13,steps:[

 {t:'phrases',h:'感想实战句',sub:'聊旅行/聊昨天',items:[
  {j:'りょこうは どうでしたか',r:'ryokō wa dō deshita ka',c:'旅行怎么样？',n:'どうでしたか＝过去版怎么样，聊感想的钥匙。'},
  {j:'とても たのしかったです',r:'totemo tanoshikatta desu',c:'特别开心',n:'感想第一句。'},
  {j:'ラーメンが ほんとうに おいしかったです',r:'rāmen ga hontō ni oishikatta desu',c:'拉面真的太好吃了',n:'ほんとうに＝真的。'},
  {j:'ちょっと たかかったです',r:'chotto takakatta desu',c:'有点小贵',n:'たかい→たかかった。吐槽也要过去形。'},
  {j:'てんきも よかったです',r:'tenki mo yokatta desu',c:'天气也很好',n:'いい的过去是よかった——特殊变化，死记。'},
  {j:'きょうとは しずかで、きれいでした',r:'Kyōto wa shizuka de, kirei deshita',c:'京都很安静，很美',n:'な形容词过去用でした。'}]},
 {t:'quiz',h:'过去形检验',qs:[
  {q:'「特别开心(过去)」?',opts:['たのしかったです','たのしいでした','たのしみです','たのしくです'],a:'たのしかったです',ja:true},
  {q:'いい 的过去形?',opts:['よかった','いかった','いいでした','よいです'],a:'よかった',ja:true},
  {q:'「京都很安静(过去)」?',opts:['しずかでした','しずかかったです','しずかいでした','しずかくです'],a:'しずかでした',ja:true}]},
 {t:'task',h:'开口任务',p:['用过去形说你昨天的三个感想：ごはんは おいしかった/しごとは いそがしかった(忙)/てんきは よかった——按真实情况改。','从今天起，每晚一句「今日感想」——かった句式的终身订阅。']}]},

{id:'j79',day:79,week:12,weekTitle:'毕业冲刺',title:'说理由：から',sub:'因为〜所以〜：解释你的一切',mins:12,steps:[
 {t:'intro',h:'有理由的人最有说服力',p:['**句子+から**＝因为〜：あついですから、まどを あけても いいですか(因为热，能开窗吗)','回答「为什么」：**どうしてですか**(为什么?)→ 〜からです(因为〜)','拒绝的艺术+理由：すみません、よていが ありますから…(抱歉，因为有安排…)——比光说ちょっと更诚恳一档。'],tip:'から接在礼貌形后面（ですから/ますから）最安全——先用这个形态，绝不失礼。'},
 {t:'phrases',h:'理由实战句',sub:'解释+拒绝+请求',items:[
  {j:'どうしてですか',r:'dōshite desu ka',c:'为什么？',n:'追问理由。朋友间：なんで？'},
  {j:'にほんが すきですから',r:'nihon ga suki desu kara',c:'因为喜欢日本',n:'被问为什么学日语的标准答案。'},
  {j:'あしたは やすみですから、だいじょうぶです',r:'ashita wa yasumi desu kara, daijōbu desu',c:'明天休息，所以没问题',n:'理由+结论结构。'},
